<!DOCTYPE html>
<html lang="fi" data-inline-logout>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="auth-gate.js" defer></script>
<script src="submission-sync.js" defer></script>

<title>Kenttälomake</title>

<style>
:root{
  --ink:#1c1f1a;
  --paper:#f2f0e8;
  --card:#fff;
  --line:#d8d4c6;
  --safety:#c2410c;
  --safety-dark:#9a3412;
  --muted:#6b6656;
  --footer-h:120px;
  --focus:#1d4ed8;
  --ok:#2f6b3a;
  --warn:#b7791f;
  --error:#a3271b;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(var(--footer-h) + 28px);
  -webkit-tap-highlight-color:transparent
}

button,
input,
select,
textarea{
  font-family:inherit
}

button{
  -webkit-tap-highlight-color:transparent
}

.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:14px 16px 12px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:3px solid var(--safety)
}

.topbar .eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#c9c6b8
}

.topbar h1{
  margin:2px 0 0;
  font-size:19px;
  font-weight:700;
  letter-spacing:-.01em
}

.wrap{
  padding:14px 14px 0
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin-bottom:12px
}

.card h2{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-family:var(--mono);
  color:#66604f;
  margin:0 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  margin:10px 0 4px;
  color:#3a3a34
}

label.req::after{
  content:" *";
  color:var(--safety)
}

input[type=text],
input[type=number],
input[type=date],
select,
textarea{
  width:100%;
  font-size:16px;
  padding:10px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  font-family:inherit
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--safety)
}

textarea{
  min-height:70px;
  resize:vertical
}

input[type=number]{
  appearance:textfield
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  opacity:1
}

.hint{
  font-size:11.5px;
  color:#6b6656;
  margin-top:3px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:none;
  border-radius:8px;
  padding:11px 16px;
  font-size:14.5px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

.btn-primary{
  background:var(--safety);
  color:#fff
}

.btn-primary:active{
  background:var(--safety-dark)
}

.btn-outline{
  background:#fff;
  color:var(--ink);
  border:1.5px solid var(--line)
}

.btn-ghost{
  background:transparent;
  color:#8a3a15;
  padding:8px 10px;
  font-size:13px
}

.btn-block{
  width:100%
}

.btn-sm{
  padding:7px 10px;
  font-size:12.5px;
  border-radius:6px
}

.btn-danger{
  background:#fff;
  color:#a3271b;
  border:1.5px solid #e3b3ab
}

.method-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.method-tile{
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:12px 10px;
  text-align:left;
  cursor:pointer;
  font-size:13.5px;
  font-weight:700;
  line-height:1.25;
  color:var(--ink)
}

.method-tile .num{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--safety);
  display:block;
  margin-bottom:3px
}

.method-tile:active{
  border-color:var(--safety)
}

.field-guide-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-left:8px;
  vertical-align:middle;
  padding:3px 9px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  cursor:pointer
}

.field-guide-btn:active{
  border-color:var(--safety)
}

.guide-file{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0
}

.guide-file .guide-ico{
  font-size:24px
}

.guide-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.entry-card{
  border:1.5px solid var(--line);
  border-left:5px solid var(--safety);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:9px;
  background:#fffdf9
}

.entry-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px
}

.entry-title{
  font-weight:700;
  font-size:14.5px
}

.entry-sub{
  font-size:12px;
  color:#6b6656;
  margin-top:2px;
  font-family:var(--mono)
}

.entry-actions{
  display:flex;
  gap:6px;
  margin-top:8px
}

.thumbs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px
}

.thumb{
  position:relative;
  width:56px;
  height:56px;
  border-radius:6px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#f6f4ed
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.thumb .rm{
  position:absolute;
  top:1px;
  right:1px;
  background:rgba(0,0,0,.65);
  color:#fff;
  border:none;
  width:28px;
  height:28px;
  border-radius:50%;
  font-size:18px;
  line-height:1;
  padding:0;
  cursor:pointer
}

.photo-add{
  display:flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  border-radius:6px;
  border:1.5px dashed var(--line);
  color:#6b6656;
  font-size:22px;
  background:#fbfaf6;
  cursor:pointer
}

.photo-card-item{
  display:flex;
  flex-direction:column;
  gap:4px;
  width:90px
}

.photo-card-item .thumb{
  width:90px;
  height:90px
}

.photo-caption{
  width:100%;
  font-size:13px;
  padding:6px 5px;
  border:1px solid var(--line);
  border-radius:4px
}

.empty{
  text-align:center;
  padding:24px 10px;
  color:#6b6656;
  font-size:13.5px
}

.footerbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--card);
  border-top:1.5px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:30
}

.step-back{
  font-family:var(--mono);
  font-size:14px;
  color:var(--muted);
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:0 0 6px -6px;
  padding:10px 12px 10px 6px;
  min-height:44px;
  background:none;
  border:none;
  cursor:pointer
}

.badge{
  display:inline-block;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--mono);
  font-size:10.5px;
  padding:2px 6px;
  border-radius:4px;
  margin-left:6px
}

select{
  -webkit-appearance:none;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23666' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;
  background-position:right 10px center
}

.toast{
  position:fixed;
  bottom:calc(var(--footer-h) + 12px);
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:9px 16px;
  border-radius:20px;
  font-size:13px;
  z-index:500;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1
}

.sync-status{
  font-family:var(--mono);
  font-size:12px;
  color:#d9d6c8;
  text-align:right;
  line-height:1.3
}

.sync-status.ok{
  color:#a7dcb0
}

.sync-status.warn{
  color:#f0c27b
}

.sync-status.error{
  color:#f4a09a
}

.loading{
  text-align:center;
  padding:40px 20px;
  color:#6b6656
}

.field-hint-host{
  position:relative
}

.field-hint-btn{
  position:absolute;
  top:-4px;
  right:0;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1.5px solid var(--warn);
  background:#fbf1de;
  color:var(--warn);
  font-weight:800;
  font-size:.82rem;
  line-height:1;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2
}

.field-hint-box{
  display:none;
  margin:6px 0 4px;
  padding:8px 10px;
  border-radius:8px;
  background:#fbf1de;
  border:1px solid var(--warn);
  color:var(--warn);
  font-size:.85rem
}

.field-hint-box.open{
  display:block
}

.table-field{
  margin-top:10px
}

.table-field-scroll{
  overflow-x:auto;
  margin:6px 0 8px;
  -webkit-overflow-scrolling:touch
}

.table-field-table{
  border-collapse:collapse;
  width:100%
}

.table-field-table th{
  font-family:var(--mono);
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#66604f;
  text-align:left;
  padding:4px 6px;
  border-bottom:1.5px solid var(--line);
  white-space:nowrap
}

.table-field-table td{
  padding:4px 6px 4px 0;
  border-bottom:1px solid var(--line);
  vertical-align:middle
}

.table-field-table input[type=text],
.table-field-table input[type=number],
.table-field-table select{
  width:100px;
  min-width:78px;
  padding:6px 7px;
  font-size:14px;
  border-radius:6px
}

.table-field-table td:last-child{
  padding-right:0
}

.field-hint-btn-inline{
  width:28px;
  height:28px;
  border-radius:50%;
  border:1.5px solid var(--warn);
  background:#fbf1de;
  color:var(--warn);
  font-weight:800;
  font-size:.82rem;
  line-height:1;
  cursor:pointer;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto
}

.table-field-action{
  position:sticky;
  right:0;
  background:var(--card);
  box-shadow:-4px 0 4px -2px rgba(0,0,0,.08)
}

@media(min-width:700px){
  .wrap{
    max-width:850px;
    margin:auto
  }

  .method-grid{
    grid-template-columns:repeat(3,1fr)
  }
}

/* ---- Käytettävyysparannukset ---- */
:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px
}
input:focus,select:focus,textarea:focus{
  box-shadow:0 0 0 3px rgba(194,65,12,.25)
}
.toprow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}
.toprow a{
  color:#d9d6c8;
  font-size:13px;
  text-decoration:none;
  font-family:var(--mono);
  padding:8px 0;
  display:inline-block
}
.has-error input,
.has-error select,
.has-error textarea{
  border-color:var(--error);
  background:#fff6f5
}
.has-error .chip-group{
  outline:2px solid var(--error);
  outline-offset:3px;
  border-radius:10px
}
.field-error-msg{
  color:var(--error);
  font-size:13px;
  font-weight:600;
  margin:4px 0 2px
}
.chip-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:2px
}
.chip{
  flex:1 1 auto;
  min-height:44px;
  padding:8px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font-size:15px;
  font-weight:600;
  cursor:pointer
}
.chip[aria-checked=true]{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}
.jump-note{
  font-size:13px;
  color:var(--muted);
  background:#f1efe6;
  border-radius:8px;
  padding:6px 10px;
  margin:8px 0 2px
}
.entry-card.tappable{
  cursor:pointer
}
.entry-card.tappable:active{
  background:#f6f0e6
}
.entry-meta{
  font-size:13px;
  color:#3a3a34;
  margin-top:4px
}
.entry-warn{
  display:inline-block;
  margin-top:6px;
  font-size:12.5px;
  font-weight:700;
  color:#8a5a00;
  background:#fbf1de;
  border:1px solid var(--warn);
  border-radius:6px;
  padding:2px 8px
}
.footer-row{
  display:flex;
  gap:8px
}
.footer-row .btn{
  flex:1
}
.more-menu{
  padding:0
}
.more-menu summary{
  list-style:none;
  padding:14px;
  font-weight:700;
  cursor:pointer;
  min-height:48px
}
.more-menu summary::-webkit-details-marker{
  display:none
}
.more-menu .more-body{
  padding:0 14px 14px;
  display:flex;
  flex-direction:column;
  gap:8px
}
.net-banner{
  display:none;
  background:#fbf1de;
  color:#6b4a00;
  border-bottom:1px solid var(--warn);
  font-size:13px;
  padding:6px 14px;
  text-align:center
}
.net-banner.show{
  display:block
}
</style>
</head>

<div id="bootSplash" style="visibility:visible;position:fixed;inset:0;z-index:99990;background:#233043;color:#f2efe6;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;">Ladataan lomaketta…</div>

<div class="topbar">
  <div class="toprow">

<div class="footerbar" id="footer"></div>
<div class="toast" id="toast"></div>

/*
 * METHODS on muokattava kopio DEFAULT_METHODS-listasta. Käyttäjä voi
 * lisätä/muokata/poistaa menetelmiä "Muokkaa menetelmiä" -näkymässä.
 *
 * Muutokset tallennetaan ensisijaisesti käyttäjäkohtaisesti Supabaseen
 * (tauluun CUSTOM_METHODS_TABLE, yksi rivi per kirjautunut käyttäjä),
 * jotta ne näkyvät samalla tunnuksella kaikilla laitteilla.
 * localStorageen (avain METHODS_STORAGE_KEY) tallennetaan aina myös
 * laitekohtainen kopio, jota käytetään heti sivun latauksen
 * yhteydessä (nopea, ei vaadi verkkoa) sekä varalla, jos
 * pilviyhteyttä ei ole.
 */
const METHODS_STORAGE_KEY="kenttalomake_custom_methods_v1";
const CUSTOM_METHODS_TABLE="custom_methods";

let METHODS=cloneMethods(DEFAULT_METHODS);

function cloneMethods(list){
  return JSON.parse(JSON.stringify(list));
}

function genMethodId(){
  return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function genFieldId(){
  return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function loadCustomMethods(){
  try{
    const raw=localStorage.getItem(METHODS_STORAGE_KEY);
    if(!raw)return;
    const custom=JSON.parse(raw);
    if(Array.isArray(custom)&&custom.length){
      METHODS=custom;
    }
  }catch(err){
    console.warn("Menetelmien lataus localStoragesta epäonnistui",err);
  }
}

/*
 * Hakee kirjautuneen käyttäjän tallentamat menetelmät Supabasesta ja
 * korvaa METHODS-listan niillä (RLS rajaa haun automaattisesti vain
 * omaan riviin, joten mitään user_id-suodatinta ei tarvita tässä).
 *
 * Jos pilvessä ei vielä ole tätä käyttäjää varten riviä mutta tällä
 * laitteella on paikallisesti (localStorage) muokattuja menetelmiä
 * — esim. ennen tätä päivitystä tehtyjä — viedään ne pilveen kertaalleen,
 * jotta ne eivät katoa ja tulevat käyttöön myös muilla laitteilla.
 */
async function syncCustomMethodsFromCloud(){
  if(!window.__supabaseClient)return;

  try{
    const {data,error}=
      await window.__supabaseClient
        .from(CUSTOM_METHODS_TABLE)
        .select("methods")
        .maybeSingle();

    if(error){
      console.warn("Menetelmien lataus pilvestä epäonnistui",error);
      toast("Menetelmien haku pilvestä epäonnistui: "+(error.message||error.code||"tuntematon"));
      return;
    }

    if(data && Array.isArray(data.methods) && data.methods.length){
      METHODS=data.methods;
      try{
        localStorage.setItem(METHODS_STORAGE_KEY,JSON.stringify(METHODS));
      }catch(err){
        console.warn("Menetelmien paikallinen välimuistitallennus epäonnistui",err);
      }
      return;
    }

    if(JSON.stringify(METHODS)!==JSON.stringify(DEFAULT_METHODS)){
      await pushMethodsToCloud();
    }
  }catch(err){
    console.warn("Menetelmien synkronointi pilvestä epäonnistui",err);
  }
}

/*
 * Vie nykyisen METHODS-listan Supabaseen kirjautuneen käyttäjän
 * riville (upsert user_id-sarakkeen mukaan; user_id täyttyy
 * automaattisesti sarakkeen oletusarvosta auth.uid()).
 */
async function pushMethodsToCloud(){
  if(!window.__supabaseClient)return false;

  try{
    const {error}=
      await window.__supabaseClient
        .from(CUSTOM_METHODS_TABLE)
        .upsert(
          {
            methods:METHODS,
            updated_at:new Date().toISOString()
          },
          {onConflict:"user_id"}
        );

    if(error){
      console.warn("Menetelmien tallennus pilveen epäonnistui",error);
      toast("Menetelmät tallennettu vain tälle laitteelle. Pilvivirhe: "+(error.message||error.code||"tuntematon"));
      return false;
    }

    return true;

  }catch(err){
    console.warn("Menetelmien tallennus pilveen epäonnistui",err);
    toast("Menetelmät tallennettu vain tälle laitteelle (pilvitallennus epäonnistui).");
    return false;
  }
}

async function persistMethods(){
  try{
    localStorage.setItem(METHODS_STORAGE_KEY,JSON.stringify(METHODS));
  }catch(err){
    console.warn("Menetelmien tallennus localStorageen epäonnistui",err);
    toast("Menetelmien tallennus epäonnistui laitteelle.");
  }

  await pushMethodsToCloud();
}

const CLOUD_TIMEOUT_MS=8000;

function withTimeout(promise,ms,label){

  return new Promise((resolve,reject)=>{

    let settled=false;

    const timer=setTimeout(()=>{

      if(settled)return;

      settled=true;

      reject(new Error("timeout:"+(label||"")));

    },ms);


    Promise.resolve(promise).then(
      value=>{

        if(settled)return;

        settled=true;

        clearTimeout(timer);

        resolve(value);
      },
      err=>{

        if(settled)return;

        settled=true;

        clearTimeout(timer);

        reject(err);
      }
    );
  });
}

let DB_NAME="kenttalomakeDB";
const DB_STORE="state";

function floorPlanKey(){
  return "kenttalomake_floorplan_"+SUBMISSION_ID;
}

/*
 * KORJAUS: window.storage/localStorage-varmistustallennus käytti aiemmin
 * kiinteää avainta "kenttalomake_state" riippumatta SUBMISSION_ID:stä.
 * Tämä sekoitti eri projektien paikalliset varmuuskopiot keskenään --
 * uutta projektia avatessa saatettiin ladata edellisen projektin data
 * ja näyttää virheellisesti "Offline - paikallinen kopio". IndexedDB oli
 * jo oikein SUBMISSION_ID:llä eroteltu (DB_NAME), joten korjataan nyt
 * myös nämä kaksi varmistustasoa samalla periaatteella.
 */
function portableStateKey(){
  return "kenttalomake_state_"+SUBMISSION_ID;
}

function idbOpen(){

  return new Promise((resolve,reject)=>{

    if(!window.indexedDB){
      reject(new Error("no-idb"));
      return;
    }

    const req=indexedDB.open(DB_NAME,1);

    req.onupgradeneeded=()=>{
      const db=req.result;

      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE);
      }
    };

    req.onsuccess=()=>{
      const db=req.result;

      db.onversionchange=()=>{
        db.close();
      };

      resolve(db);
    };

    req.onerror=()=>{
      reject(req.error);
    };
  });
}

function idbSet(key,value){

  return idbOpen().then(db=>new Promise((resolve,reject)=>{

    const tx=db.transaction(DB_STORE,"readwrite");

    tx.objectStore(DB_STORE).put(value,key);

    tx.oncomplete=()=>{
      db.close();
      resolve();
    };

    tx.onerror=()=>{
      db.close();
      reject(tx.error);
    };
  }));
}

function idbGet(key){

  return idbOpen().then(db=>new Promise((resolve,reject)=>{

    const tx=db.transaction(DB_STORE,"readonly");

    const req=tx.objectStore(DB_STORE).get(key);

    req.onsuccess=()=>{
      resolve(req.result);
    };

    req.onerror=()=>{
      reject(req.error);
    };

    tx.oncomplete=()=>{
      db.close();
    };
  }));
}

function idbDel(key){

  return idbOpen().then(db=>new Promise((resolve,reject)=>{

    const tx=db.transaction(DB_STORE,"readwrite");

    tx.objectStore(DB_STORE).delete(key);

    tx.oncomplete=()=>{
      db.close();
      resolve();
    };

    tx.onerror=()=>{
      db.close();
      reject(tx.error);
    };
  }));
}

/*
 * KORJAUS: kokonaisen submission-kohtaisen IndexedDB-tietokannan
 * poisto. Aiemmin clearForm() tyhjensi vain avaimet mutta jätti
 * tyhjän tietokannan roikkumaan selaimen tallennustilaan pysyvästi.
 */
function idbDeleteDatabase(name){

  return new Promise((resolve)=>{

    if(!window.indexedDB || !name){
      resolve();
      return;
    }

    try{

      const req=indexedDB.deleteDatabase(name);

      req.onsuccess=()=>resolve();
      req.onerror=()=>resolve();
      req.onblocked=()=>resolve();

    }catch(err){

      resolve();
    }
  });
}

/*
 * KORJAUS: varoitus jos joudutaan turvautumaan JSON-varmuuskopioon
 * ja osalla valokuvista ei vielä ole pilvipolkua — nämä kuvat
 * katoaisivat, jos IndexedDB ei ole käytettävissä sivun uudelleenlatauksessa.
 */
function hasUnsyncedLocalOnlyPhotos(){

  return entries.some(e=>
    (e.photos||[]).some(p=>!p.path && p.blob instanceof Blob)
  );
}

async function autosave(){

  if(autosaveInProgress)return;

  autosaveInProgress=true;
  clearTimeout(saveTimer);

  setSyncStatus("Tallennetaan...");

  const indexedState=createIndexedDbState();
  const portableState=createPortableState();

  let localSaved=false;
  let indexedDbSaved=false;

  /*
   * IndexedDB on ensisijainen paikallinen tallennus.
   * Täällä Blobit säilyvät.
   */
  try{

    await idbSet(
      "kenttalomake_state",
      indexedState
    );

    localSaved=true;
    indexedDbSaved=true;

  }catch(err){

    console.warn("IndexedDB-tallennus epäonnistui",err);
  }


  /*
   * window.storage on vaihtoehtoinen varmistus.
   * Sinne tallennetaan vain JSON-yhteensopiva tila.
   */
  if(window.storage){

    try{

      await window.storage.set(
        portableStateKey(),
        JSON.stringify(portableState)
      );

      localSaved=true;

    }catch(err){

      console.warn("window.storage-tallennus epäonnistui",err);
    }
  }


  /*
   * localStorage viimeisenä varmistuksena.
   */
  try{

    localStorage.setItem(
      portableStateKey(),
      JSON.stringify(portableState)
    );

    localSaved=true;

  }catch(err){

    console.warn("localStorage-tallennus epäonnistui",err);
  }


  if(localSaved){

    lastSaveFailed=false;

    if(indexedDbSaved){

      setSyncStatus(navigator.onLine?"Tallennettu laitteelle":"Offline – tallennettu laitteelle","ok");

    }else{

      /*
       * IndexedDB ei toiminut: kuvat, joita ei ole vielä
       * synkronoitu pilveen, voivat kadota sivun sulkeutuessa.
       */
      setSyncStatus("Tallennettu (rajoitetusti)","warn");

      if(hasUnsyncedLocalOnlyPhotos()){

        toast(
          "Huom: osaa valokuvista ei ole vielä varmuuskopioitu pilveen. "+
          "Pidä sivu auki kunnes synkronointi valmistuu."
        );
      }
    }

  }else{

    if(!lastSaveFailed){
      toast("Paikallinen tallennus epäonnistui – vapauta laitteen tallennustilaa.");
    }

    lastSaveFailed=true;
    setSyncStatus("Tallennus epäonnistui","error");
  }

  autosaveInProgress=false;

  /*
   * Pilvisynkronointi käynnistetään erillisenä jonona.
   */
  syncToCloud();
}

function deriveTitle(){

  return (
    project.nimi &&
    project.nimi.trim()
  ) || "(nimetön kohde)";
}


async function syncToCloud(){

  if(!window.SubmissionSync || !SUBMISSION_ID){
    return;
  }

  /*
   * Jos synkronointi on jo käynnissä,
   * merkitään uusi synkronointi jonoon.
   */
  if(cloudSyncInFlight){

    cloudSyncQueued=true;

    return;
  }

  cloudSyncInFlight=true;
  cloudSyncQueued=false;

  setSyncStatus("Synkronoidaan...");

  try{

    /*
     * Ladataan uudet valokuvat pilveen.
     */
    for(const e of entries){

      for(const p of (e.photos||[])){

        if(!p.path && p.blob){

          try{

            const path=await window.SubmissionSync.uploadPhoto(
              SUBMISSION_ID,
              p.id+".jpg",
              p.blob
            );

            if(path){
              p.path=path;
            }

          }catch(err){

            console.warn(
              "Kuvan lataus epäonnistui:",
              p.id,
              err
            );

            /*
             * Ei keskeytetä koko synkronointia.
             */
          }
        }
      }
    }


    /*
     * Pohjakuva.
     */
    if(floorPlanBlob && !floorPlanPath){

      try{

        floorPlanPath=
          await window.SubmissionSync.uploadPhoto(
            SUBMISSION_ID,
            "floorplan.pdf",
            floorPlanBlob
          );


        /*
         * KORJAUS: vasta kun uusi pohjakuva on varmasti tallentunut
         * pilveen, poistetaan mahdollinen vanha pohjakuva. Aiemmin
         * vanha tiedosto poistettiin heti kuvan valinnan yhteydessä,
         * jolloin yhteysongelma saattoi hävittää pohjakuvan kokonaan.
         */
        if(floorPlanPath && pendingOldFloorPlanPath){

          const toDelete=pendingOldFloorPlanPath;

          pendingOldFloorPlanPath=null;

          try{

            await window.SubmissionSync.deletePhotoFile(toDelete);

          }catch(err){

            console.warn(
              "Vanhan pohjakuvan poisto epäonnistui",
              err
            );
          }
        }

      }catch(err){

        console.warn(
          "Pohjakuvan lataus epäonnistui",
          err
        );
      }
    }


    /*
     * Pilveen tallennetaan vain ne kuvat,
     * joilla on olemassa oleva storage-polku.
     */
    const cloudEntries=entries.map(e=>({

      id:e.id,

      methodId:e.methodId,

      values:e.values,

      marker:e.marker||null,

      photos:(e.photos||[])
        .filter(p=>p.path)
        .map(p=>({
          id:p.id,
          path:p.path,
          caption:p.caption||""
        }))
    }));


    await window.SubmissionSync.saveSubmission({

      id:SUBMISSION_ID,

      formKey:FORM_KEY,

      formLabel:FORM_LABEL,

      title:deriveTitle(),

      data:{
        project,
        entries:cloudEntries,
        floorPlanPath:floorPlanPath||null
      }
    });


    setSyncStatus(
      "Synkronoitu pilveen",
      "ok"
    );

  }catch(err){

    console.warn(
      "Pilvisynkronointi epäonnistui",
      err
    );

    setSyncStatus(
      "Ei yhteyttä – tallennettu laitteelle"+(pendingPhotoCount()?" ("+pendingPhotoCount()+" kuvaa odottaa)":""),
      "warn"
    );

  }finally{

    cloudSyncInFlight=false;

    /*
     * Jos muutos tapahtui synkronoinnin aikana,
     * tehdään uusi synkronointi.
     */
    if(cloudSyncQueued){

      cloudSyncQueued=false;

      setTimeout(()=>{
        syncToCloud();
      },50);
    }
  }
}

async function loadState(){

  SUBMISSION_ID=initSubmissionId();

  DB_NAME=
    "kenttasub_"+
    SUBMISSION_ID.replace(/-/g,"")+
    "_db";

  let value=null;
  let loadedFromCloud=false;


  /*
   * Ensin pilvi — mutta aikakatkaisulla. Jos pilvipyyntö ei
   * vastaa kohtuullisessa ajassa (esim. huono verkko tai
   * auth-viive), jatketaan paikallisella datalla sen sijaan
   * että sovellus jää ikuisesti tyhjäksi lataamaan.
   */
  try{

    if(!window.SubmissionSync){
      throw new Error("SubmissionSync ei ole käytettävissä");
    }

    const sub=
      await withTimeout(
        window.SubmissionSync.loadSubmission(SUBMISSION_ID),
        CLOUD_TIMEOUT_MS,
        "loadSubmission"
      );

    if(sub && sub.data){

      if(sub.data.project){

        project=Object.assign(
          project,
          sub.data.project
        );
      }

      entries=[];


      for(const ce of (sub.data.entries||[])){

        const photos=[];


        /*
         * Kuvien lataus rinnakkain.
         */
        const photoResults=
          await Promise.all(
            (ce.photos||[]).map(async p=>{

              try{

                const blob=
                  await window.SubmissionSync.downloadPhoto(
                    p.path
                  );

                const url=
                  URL.createObjectURL(blob);

                return {
                  ok:true,
                  photo:{
                    id:p.id,
                    path:p.path,
                    url,
                    blob,
                    caption:p.caption||""
                  }
                };

              }catch(err){

                console.warn(
                  "Kuvan lataus epäonnistui",
                  p.path,
                  err
                );

                return {
                  ok:false,
                  photo:null
                };
              }
            })
          );


        photoResults.forEach(result=>{

          if(result.ok && result.photo){

            photos.push(result.photo);
          }
        });


        entries.push({

          id:ce.id,

          methodId:ce.methodId,

          values:ce.values||{},

          marker:ce.marker||null,

          photos
        });
      }


      /*
       * Pohjakuva.
       */
      if(sub.data.floorPlanPath){

        try{

          floorPlanBlob=
            await window.SubmissionSync.downloadPhoto(
              sub.data.floorPlanPath
            );

          floorPlanPath=
            sub.data.floorPlanPath;

        }catch(err){

          console.warn(
            "Pohjakuvan lataus epäonnistui",
            err
          );

          floorPlanBlob=null;
          floorPlanPath=null;
        }
      }


      loadedFromCloud=true;

      setSyncStatus(
        "Ladattu pilvestä",
        "ok"
      );
    }

  }catch(err){

    console.warn(
      "Pilvilataus epäonnistui tai aikakatkaistiin",
      err
    );
  }


  /*
   * Jos pilvestä ei saatu tietoja,
   * käytetään IndexedDB:tä.
   */
  if(!loadedFromCloud){

    try{

      value=
        await idbGet(
          "kenttalomake_state"
        ) || null;

    }catch(err){

      console.warn(
        "IndexedDB-lataus epäonnistui",
        err
      );
    }


    /*
     * window.storage.
     */
    if(!value && window.storage){

      try{

        const r=
          await window.storage.get(
            portableStateKey()
          );

        value=
          r && r.value
            ? JSON.parse(r.value)
            : null;

      }catch(err){

        console.warn(
          "window.storage-lataus epäonnistui",
          err
        );
      }
    }


    /*
     * localStorage.
     */
    if(!value){

      try{

        const raw=
          localStorage.getItem(
            portableStateKey()
          );

        if(raw){

          value=JSON.parse(raw);
        }

      }catch(err){

        console.warn(
          "localStorage-lataus epäonnistui",
          err
        );
      }
    }


    if(value){

      if(value.project){

        project=Object.assign(
          project,
          value.project
        );
      }


      /*
       * IndexedDB-tilassa photos sisältää Blobit.
       *
       * JSON-varmistustilassa kuvilta puuttuu Blob,
       * jolloin niiden paikallinen alkuperä ei ole enää
       * saatavilla. Pilveen ladatut kuvat voidaan kuitenkin
       * ladata myöhemmin.
       */
      entries=Array.isArray(value.entries)
        ? value.entries
        : [];


      for(const e of entries){

        if(!Array.isArray(e.photos)){
          e.photos=[];
        }


        for(const p of e.photos){

          if(p.blob instanceof Blob){

            if(!p.url){
              p.url=URL.createObjectURL(p.blob);
            }

          }else if(p.path && window.SubmissionSync){

            try{

              const blob=
                await window.SubmissionSync.downloadPhoto(
                  p.path
                );

              p.blob=blob;
              p.url=URL.createObjectURL(blob);

            }catch(err){

              console.warn(
                "Paikallisen kuvan palautus epäonnistui",
                p.path
              );
            }
          }
        }
      }


      if(value.view){
        view=value.view;
      }

      if("editingEntry" in value){

        editingEntry=value.editingEntry;

        /*
         * Varmistetaan, että editingEntry viittaa
         * entries-taulukon oikeaan objektiin.
         */
        if(editingEntry){

          const realEntry=
            entries.find(
              e=>e.id===editingEntry.id
            );

          if(realEntry){

            editingEntry=realEntry;
          }
        }
      }

      if("editingIsNew" in value){

        editingIsNew=value.editingIsNew;
      }


      await loadFloorPlan();

      toast(
        "Ei pilviyhteyttä juuri nyt — näytetään laitteelle tallennettu kopio."
      );

      setSyncStatus(
        "Offline – paikallinen kopio",
        "warn"
      );

    }else{

      await loadFloorPlan();

      setSyncStatus(
        "Uusi lomake",
        ""
      );
    }
  }


  /*
   * Jos lomakkeen tallennustilasta palautuu vanhentunut
   * näkymä, palautetaan turvallisesti projektinäkymään.
   */
  if(
    view==="entryForm" &&
    (
      !editingEntry ||
      !METHODS.find(
        m=>m.id===editingEntry.methodId
      )
    )
  ){

    view="project";
    editingEntry=null;
    editingIsNew=false;
  }


  render();
}

async function clearForm(){

  const oldSubmissionId=SUBMISSION_ID;
  const oldDbName=DB_NAME;
  const oldFloorPlanKey=floorPlanKey();


  /*
   * Poistetaan paikallinen tila ennen uuden submissionin luontia.
   */
  try{
    await idbDel("kenttalomake_state");
  }catch(err){
    console.warn(err);
  }

  try{
    await idbDel(oldFloorPlanKey);
  }catch(err){
    console.warn(err);
  }


  /*
   * KORJAUS: poistetaan koko vanhan submissionin IndexedDB-tietokanta,
   * jotta tyhjiä tietokantoja ei jää roikkumaan selaimen tallennustilaan.
   */
  try{
    await idbDeleteDatabase(oldDbName);
  }catch(err){
    console.warn(err);
  }


  try{

    if(window.storage){

      await window.storage.delete(
        portableStateKey()
      );
    }

  }catch(err){
    console.warn("kenttalomake_state-tilan poisto epäonnistui", err);
  }


  try{

    localStorage.removeItem(
      portableStateKey()
    );

  }catch(err){
    console.warn("kenttalomake_state-tilan poisto localStoragesta epäonnistui", err);
  }


  /*
   * Poistetaan kuvat muistista.
   */
  revokePhotoUrls();


  /*
   * Pilvestä poistetaan submission.
   */
  if(window.SubmissionSync){

    try{

      await window.SubmissionSync.deleteSubmission(
        oldSubmissionId
      );

    }catch(err){

      console.warn(
        "Pilvisubmissionin poisto epäonnistui",
        err
      );
    }
  }


  /*
   * Uusi submission.
   */
  SUBMISSION_ID=
    (window.SubmissionSync && window.SubmissionSync.newId)
      ? window.SubmissionSync.newId()
      : ("local-"+Date.now()+"-"+Math.random().toString(36).slice(2,10));


  const params=
    new URLSearchParams(
      window.location.search
    );

  params.set(
    "submission",
    SUBMISSION_ID
  );


  window.history.replaceState(
    null,
    "",
    window.location.pathname+
    "?"+
    params.toString()
  );


  DB_NAME=
    "kenttasub_"+
    SUBMISSION_ID.replace(/-/g,"")+
    "_db";


  project={
    nimi:"",
    osoite:"",
    tilaaja:"",
    tutkija:"",
    pvm:localDateISO()
  };

  entries=[];

  editingEntry=null;
  editingIsNew=false;

  floorPlanBlob=null;
  floorPlanPath=null;
  floorPlanPreviewPage=1;
  pendingOldFloorPlanPath=null;


  _pdfDocCache=null;
  _pdfDocCacheBlob=null;


  render();

  toast(
    "Lomake tyhjennetty. Uusi kohde aloitettu."
  );

  setSyncStatus(
    "Uusi lomake",
    ""
  );
}

function toast(msg){

  const t=
    document.getElementById("toast");

  if(!t)return;

  clearTimeout(toastTimer);

  t.textContent=msg;

  t.classList.add("show");

  toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },Math.max(2200,String(msg).length*65));
}


function el(html){

  const d=document.createElement("div");

  d.innerHTML=html.trim();

  return d.firstElementChild;
}

/*
 * el():n kaltainen, mutta <tr>...</tr>-merkkijonoille. Tavallinen
 * div.innerHTML="<tr>...</tr>" ei toimi: selain jäsentää HTML:ää
 * spesifikaation mukaan niin, että tr/td-tagit ilman table-
 * kontekstia hylätään kokonaan, jolloin vain rivin ENSIMMÄINEN
 * sisäkkäinen elementti (esim. ensimmäisen sarakkeen input) jäisi
 * jäljelle ja loput sarakkeet katoaisivat. Käyttämällä <tbody>-
 * elementtiä jäsennyskontekstina (parametrina annettu <tr>...</tr>
 * mukaan lukien) <tr> ja sen <td>-lapset jäsentyvät oikein.
 */
function elRow(html){

  const tbody=document.createElement("tbody");

  tbody.innerHTML=html.trim();

  return tbody.firstElementChild;
}


function escapeHtml(s){

  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


function escapeAttribute(s){

  return escapeHtml(s);
}

function entryHasData(e){
  if(!e)return false;
  const vals=Object.values(e.values||{});
  const has=vals.some(v=>
    Array.isArray(v)
      ?v.some(r=>Object.values(r||{}).some(x=>String(x??"").trim()!==""))
      :String(v??"").trim()!==""
  );
  return has || (e.photos||[]).length>0 || !!e.marker;
}

  view=editingIsNew?"methodSelect":"project";

/* ============================================================
   PAKOLLISTEN KENTTIEN TARKISTUS JA VIRHEIDEN NÄYTTÖ
   ============================================================ */
function isEmptyFieldValue(f,values){
  if(f.type==="table"){
    const tRows=Array.isArray(values[f.id])?values[f.id]:[];
    const cols=Array.isArray(f.columns)?f.columns:[];
    return !tRows.some(r=>cols.some(c=>
      r[c.id]!==undefined && r[c.id]!==null && String(r[c.id]).trim()!==""
    ));
  }
  const v=values[f.id];
  return v===undefined || v===null || String(v).trim()==="";
}

function findMissingRequired(entry,m){
  const values=entry.values||{};
  const vis=computeFieldVisibility(m.fields,values);
  return [...COMMON_FIELDS,...m.fields].filter(f=>
    f.req && vis[f.id]!==false && isEmptyFieldValue(f,values)
  );
}

function clearFieldErrors(root){
  (root||document).querySelectorAll(".has-error").forEach(n=>n.classList.remove("has-error"));
  (root||document).querySelectorAll(".field-error-msg").forEach(n=>n.remove());
}

function fieldHostFor(f){
  const inp=document.getElementById("fld_"+f.id);
  if(inp)return inp.closest(".field-hint-host")||inp.parentElement;
  const tb=document.getElementById("tblbody_"+f.id);
  if(tb)return tb.closest(".table-field");
  return null;
}

/* pairs: [[kenttä, virheteksti], ...] */
function showFieldErrors(pairs){
  clearFieldErrors();
  let first=null;
  pairs.forEach(([f,msg])=>{
    const host=fieldHostFor(f);
    if(!host)return;
    host.classList.add("has-error");
    const label=host.querySelector("label");
    const m=document.createElement("div");
    m.className="field-error-msg";
    m.setAttribute("role","alert");
    m.textContent=msg;
    if(label)label.after(m);else host.prepend(m);
    if(!first)first={host,f};
  });
  if(first){
    first.host.scrollIntoView({block:"center",behavior:"smooth"});
    const focusable=first.host.querySelector("input:not([type=hidden]),select,textarea,.chip");
    if(focusable){
      setTimeout(()=>{try{focusable.focus({preventScroll:true});}catch(e){}},350);
    }
  }
  return !!first;
}

function entrySummary(entry,m){
  const parts=[];
  const vis=computeFieldVisibility(m.fields,entry.values||{});
  for(const f of m.fields){
    if(parts.length>=2)break;
    if(f.type==="table"||vis[f.id]===false)continue;
    const v=(entry.values||{})[f.id];
    if(v===undefined||v===null||String(v).trim()==="")continue;
    const str=String(v).trim().replace(/\s+/g," ");
    parts.push(str.length>40?str.slice(0,40)+"…":str);
  }
  return parts.join(" · ");
}

function newEntryId(){
  return "e"+Date.now()+Math.random().toString(36).slice(2,7);
}

function duplicateEntry(entry){
  const values=JSON.parse(JSON.stringify(entry.values||{}));
  /* Tunnus/tila ja vapaa huomio ovat aina kohtakohtaisia. */
  delete values.paikka;
  delete values.huomiot;
  editingEntry={
    id:newEntryId(),
    methodId:entry.methodId,

    photos:[],
    marker:null
  };

}

}

function appendPhotoToThumb(thumb,p){

  thumb.innerHTML="";


  if(p.url){

    const img=
      document.createElement("img");

    img.src=p.url;

    img.alt=p.caption
      ? p.caption
      : "Tutkimusvalokuva";

    img.loading="lazy";

    thumb.appendChild(img);

    return;
  }


  /*
   * Jos URL puuttuu mutta Blob on olemassa,
   * luodaan URL.
   */
  if(p.blob instanceof Blob){

    try{

      p.url=
        URL.createObjectURL(
          p.blob
        );

      const img=
        document.createElement("img");

      img.src=p.url;

      img.alt=
        p.caption
          ? p.caption
          : "Tutkimusvalokuva";

      img.loading="lazy";

      thumb.appendChild(img);

      return;

    }catch(err){

      console.warn(err);
    }
  }


  thumb.textContent="Kuva ei ole saatavilla";
}

/* ============================================================
   KENTTÄKOHTAISET PDF-OHJEET / RT-KORTIT
   ============================================================
 * Jokaiseen menetelmän kenttään voi liittää yhden PDF-tiedoston
 * (field.guide = {name,path,size}). Menetelmällä voi siis olla useita
 * ohjeita, yksi per kenttä. Ohjepainike on osa kentän omaa elementtiä,
 * joten se piiloutuu automaattisesti, kun kenttä piilotetaan
 * (näyttöehto tai siirtymä).
 *
 * Tiedosto tallennetaan Supabase Storageen (submission-photos, polku
 * <user_id>/_ohjeet/<menetelmä>-<kenttä>-<versio>.pdf) ja välimuistitetaan
 * laitteen IndexedDB:hen (oma tietokanta), jotta ohje aukeaa myös ilman
 * verkkoa. Välimuistin avain on tiedoston polku, joka on uniikki per
 * ladattu versio.
 */
const GUIDE_MAX_BYTES=25*1024*1024;
const GUIDE_DB="kenttalomakeGuides";
const GUIDE_STORE="files";

function guideDb(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){
      reject(new Error("no-idb"));
      return;
    }
    const req=indexedDB.open(GUIDE_DB,1);
    req.onupgradeneeded=()=>{
      if(!req.result.objectStoreNames.contains(GUIDE_STORE)){
        req.result.createObjectStore(GUIDE_STORE);
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

function guideCacheGet(key){
  return guideDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(GUIDE_STORE,"readonly");
    const q=tx.objectStore(GUIDE_STORE).get(key);
    q.onsuccess=()=>resolve(q.result||null);
    q.onerror=()=>reject(q.error);
    tx.oncomplete=()=>db.close();
  }));
}

function guideCachePut(key,buf){
  return guideDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(GUIDE_STORE,"readwrite");
    tx.objectStore(GUIDE_STORE).put(buf,key);
    tx.oncomplete=()=>{db.close();resolve();};
    tx.onerror=()=>{db.close();reject(tx.error);};
  }));
}

function guideCacheDel(key){
  return guideDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(GUIDE_STORE,"readwrite");
    tx.objectStore(GUIDE_STORE).delete(key);
    tx.oncomplete=()=>{db.close();resolve();};
    tx.onerror=()=>{db.close();reject(tx.error);};
  }));
}

function formatGuideSize(n){
  if(!n)return "";
  if(n<1024*1024)return Math.max(1,Math.round(n/1024))+" kt";
  return (n/1024/1024).toFixed(1).replace(".",",")+" Mt";
}

/* Menetelmän kaikki ohjeet (yksi per kenttä, jos kentällä on ohje). */
function methodGuides(m){
  return (m&&Array.isArray(m.fields)?m.fields:[])
    .map(f=>f&&f.guide)
    .filter(g=>g&&g.path);
}

async function getGuideBlob(guide){
  try{
    const cached=await guideCacheGet(guide.path);
    if(cached)return new Blob([cached],{type:"application/pdf"});
  }catch(err){
    console.warn("Ohjeen välimuistihaku epäonnistui",err);
  }
  if(!window.SubmissionSync)throw new Error("Pilviyhteyttä ei ole");
  const blob=await window.SubmissionSync.downloadPhoto(guide.path);
  const buf=await blob.arrayBuffer();
  try{
    await guideCachePut(guide.path,buf);
  }catch(err){
    console.warn("Ohjeen välimuistitallennus epäonnistui",err);
  }
  return new Blob([buf],{type:"application/pdf"});
}

/*
 * Ikkuna avataan heti napin painalluksella (ennen asynkronista latausta),
 * koska mobiiliselaimet (erityisesti iOS Safari) estävät ikkunan
 * avaamisen, jos se tehdään vasta latauksen jälkeen.
 */
async function openMethodGuide(guide){
  if(!guide||!guide.path)return;
  const win=window.open("","_blank");
  if(win){
    try{
      win.document.title=guide.name||"Ohje";
      win.document.body.style.cssText="font-family:sans-serif;padding:24px;color:#555";
      win.document.body.textContent="Ladataan ohjetta...";
    }catch(err){}
  }
  try{
    const blob=await getGuideBlob(guide);
    const url=URL.createObjectURL(blob);
    if(win&&!win.closed){
      win.location.href=url;
    }else{
      const a=document.createElement("a");
      a.href=url;
      a.target="_blank";
      a.rel="noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setTimeout(()=>URL.revokeObjectURL(url),10*60*1000);
  }catch(err){
    console.warn("Ohjeen avaus epäonnistui",err);
    if(win){
      try{win.close();}catch(e){}
    }
    toast("Ohjeen avaus epäonnistui. Ei verkkoyhteyttä eikä tiedostoa laitteella.");
  }
}

async function deleteGuideFile(guide){
  if(!guide||!guide.path)return;
  try{
    if(window.SubmissionSync)await window.SubmissionSync.deletePhotoFile(guide.path);
  }catch(err){
    console.warn("Ohjetiedoston poisto epäonnistui",err);
  }
  guideCacheDel(guide.path).catch(()=>{});
}

/* Lataa kaikkien menetelmien ohjeet laitteelle taustalla (offline-käyttöä varten). */
async function prefetchGuides(){
  for(const m of METHODS){
    for(const g of methodGuides(m)){
      try{
        const cached=await guideCacheGet(g.path);
        if(!cached)await getGuideBlob(g);
      }catch(err){
        console.warn("Ohjeen esilataus epäonnistui",err);
      }
    }
  }
}

/*
 * Poistaa ohjetiedoston pilvestä ja välimuistista, jos se on ladattu
 * tässä muokkauksessa eikä vielä tallennettu menetelmään.
 */
function dropGuideIfUnsaved(g){
  if(!g||!g.path||!editingMethod)return;
  const stored=METHODS.find(x=>x.id===editingMethod.id);
  const savedPaths=new Set(methodGuides(stored).map(x=>x.path));
  if(!savedPaths.has(g.path))deleteGuideFile(g);
}

/* Poistuttaessa tallentamatta siivotaan kaikki tallentamattomat ohjeet. */
function discardUnsavedGuides(){
  if(!editingMethod)return;
  methodGuides(editingMethod).forEach(dropGuideIfUnsaved);
}

/*
 * Ohjepainike kentän otsikon perään. Painike on osa kentän omaa
 * elementtiä, joten se piiloutuu kentän mukana.
 */
function attachFieldGuide(wrapper,f){
  if(!wrapper||!f||!f.guide||!f.guide.path)return;
  const label=wrapper.querySelector("label");
  if(!label)return;
  const b=el(

  };
  label.style.display="inline-block";
  label.insertAdjacentElement("afterend",b);
}

/* Kentän ohjeen muokkaus menetelmän muokkausnäkymässä. */
function renderFieldGuideEditor(body,f){

  const input=el(
    '<input type="file" accept="application/pdf,.pdf" style="display:none">'
  );

  let busy=false;

  function draw(){

    body.innerHTML="";

    const g=f.guide;

    if(g&&g.path){
      body.appendChild(el(`
        <div class="guide-file">
          <span class="guide-ico">📄</span>
          <div>
            <div class="entry-title">${escapeHtml(g.name||"ohje.pdf")}</div>
            <div class="entry-sub">${escapeHtml(formatGuideSize(g.size))}</div>
          </div>
        </div>
      `));
    }

    const actions=el('<div class="guide-actions"></div>');

    if(g&&g.path){
      const bOpen=el(
        '<button type="button" class="btn btn-sm btn-outline">📄 Avaa</button>'
      );
      bOpen.disabled=busy;
      bOpen.onclick=()=>openMethodGuide(g);
      actions.appendChild(bOpen);
    }

    const bPick=el(
      '<button type="button" class="btn btn-sm btn-outline">'+
      (busy?"Ladataan...":(g&&g.path?"Vaihda PDF":"+ Lisää PDF"))+
      '</button>'
    );
    bPick.disabled=busy;
    bPick.onclick=()=>input.click();
    actions.appendChild(bPick);

    if(g&&g.path){
      const bDel=el(
        '<button type="button" class="btn btn-sm btn-danger">Poista ohje</button>'
      );
      bDel.disabled=busy;
      bDel.onclick=()=>{
        if(!confirm("Poistetaanko ohje tästä kentästä?"))return;
        dropGuideIfUnsaved(g);
        delete f.guide;
        draw();
      };
      actions.appendChild(bDel);
    }

    body.appendChild(actions);
    body.appendChild(input);
  }

  input.onchange=async ()=>{

    const file=input.files&&input.files[0];
    input.value="";

    if(!file)return;

    if(file.type!=="application/pdf"&&!/\.pdf$/i.test(file.name)){
      toast("Valitse PDF-tiedosto");
      return;
    }

    if(file.size>GUIDE_MAX_BYTES){
      toast("PDF on liian suuri (enintään 25 Mt)");
      return;
    }

    if(!window.SubmissionSync||!window.__supabaseClient){
      toast("Pilviyhteys puuttuu, ohjetta ei voi tallentaa");
      return;
    }

    busy=true;
    draw();

    try{

      const v=Date.now().toString(36);
      const safeName=
        String(editingMethod.id).replace(/[^\w-]/g,"_")+"-"+
        String(f.id).replace(/[^\w-]/g,"_");

      const path=await window.SubmissionSync.uploadPhoto(
        "_ohjeet",
        safeName+"-"+v+".pdf",
        new Blob([file],{type:"application/pdf"})
      );

      try{
        await guideCachePut(path,await file.arrayBuffer());
      }catch(err){
        console.warn("Ohjeen välimuistitallennus epäonnistui",err);
      }

      /* Poistetaan aiempi tallentamaton versio, jos sellainen on. */
      dropGuideIfUnsaved(f.guide);

      f.guide={
        name:file.name,
        path:path,
        size:file.size
      };

      toast("PDF ladattu. Muista tallentaa menetelmä.");

    }catch(err){
      console.warn("Ohjeen lataus epäonnistui",err);
      toast("PDF:n lataus epäonnistui: "+(err.message||err.statusCode||"tuntematon virhe"));
    }

    busy=false;
    draw();
  };

  draw();
}

/*

 *
 * Taulukkotyyppinen kenttä (esim. rakenneavauksen "Rakennekerrokset")

 */
function syncFieldColumnsFromDom(f,fieldIdx){

/*
 * APULAUSEET
 *
 * Kenttäkohtaisia ehdollisia vihjetekstejä tutkijalle, esim.
 * "Pintakosteus koholla, tee rakennekosteusmittaus", kun kentän
 * arvo täyttää ehdon (esim. > 80). Sallitut vertailut riippuvat
 * kentän tyypistä: numerokentille suuruusvertailut, muille
 * yhtäsuuruus/erisuuruus ja "sisältää".
 */
function hintOpsForType(type){
  if(type==="number"){
    return [
      { value:"gt", label:"suurempi kuin (>)" },
      { value:"gte", label:"vähintään (≥)" },
      { value:"lt", label:"pienempi kuin (<)" },
      { value:"lte", label:"enintään (≤)" },
      { value:"eq", label:"yhtä suuri (=)" },
      { value:"neq", label:"eri suuri (≠)" }
    ];
  }
  return [
    { value:"eq", label:"on (=)" },
    { value:"neq", label:"ei ole (≠)" },
    { value:"contains", label:"sisältää" }
  ];
}

function evalHintRule(rule,type,rawValue){

  if(
    rawValue===undefined ||
    rawValue===null
  )return false;

  const strVal=
    String(rawValue).trim();

  if(strVal==="")return false;


  if(type==="number"){

    const n=Number(strVal);
    const rv=Number(rule.value);

    if(
      !Number.isFinite(n) ||
      !Number.isFinite(rv)
    )return false;

    switch(rule.op){
      case "gt":return n>rv;
      case "gte":return n>=rv;
      case "lt":return n<rv;
      case "lte":return n<=rv;
      case "eq":return n===rv;
      case "neq":return n!==rv;
      default:return false;
    }
  }

  const a=strVal.toLowerCase();
  const b=String(rule.value||"").trim().toLowerCase();

  if(b==="")return false;

  switch(rule.op){
    case "eq":return a===b;
    case "neq":return a!==b;
    case "contains":return a.indexOf(b)!==-1;
    default:return false;
  }
}

function matchingHints(f,rawValue){

  if(!f.hints||!f.hints.length)return [];

  return f.hints
    .filter(r=>
      r.text &&
      r.text.trim() &&
      evalHintRule(r,f.type,rawValue)
    )
    .map(r=>r.text.trim());
}

/*
 * Taulukkokentän apulausesäännöt voivat yhdistää useita ehtoja
 * saman rivin eri sarakkeista (kaikkien pitää täyttyä = JA).
 * Arvioidaan yhtä riviä (row = {sarakeId: arvo}) vasten.
 */
function matchingTableRowHints(f,cols,row){

  if(!f.hints||!f.hints.length)return [];

  return f.hints
    .filter(rule=>
      rule.text &&
      rule.text.trim() &&
      Array.isArray(rule.conditions) &&
      rule.conditions.length &&
      rule.conditions.every(cond=>{

        const col=
          cols.find(c=>c.id===cond.colId);

        if(!col)return false;

        return evalHintRule(
          cond,
          col.type,
          row[col.id]
        );
      })
    )
    .map(rule=>rule.text.trim());
}

/*
 * Lukee kentän apulauserivien nykyiset DOM-arvot talteen f.hints-
 * taulukkoon. Kutsutaan aina ennen kuin apulauserivit tai koko
 * kenttälista piirretään uudelleen, jotta kesken kirjoituksen
 * olevat arvot eivät katoa.
 */
function syncFieldHintsFromDom(f,fieldIdx){

  if(!Array.isArray(f.hints))return;

  f.hints.forEach((r,hIdx)=>{

    const opSel=
      document.getElementById(
        `mf_hint_op_${fieldIdx}_${hIdx}`
      );

    const valInput=
      document.getElementById(
        `mf_hint_val_${fieldIdx}_${hIdx}`
      );

    const textInput=
      document.getElementById(
        `mf_hint_text_${fieldIdx}_${hIdx}`
      );

    if(opSel)r.op=opSel.value;
    if(valInput)r.value=valInput.value;
    if(textInput)r.text=textInput.value;
  });
}

/*
 * Sama kuin syncFieldHintsFromDom, mutta taulukkokentän
 * usean ehdon säännöille (f.hints[i].conditions[j]).
 */
function syncFieldTableHintsFromDom(f,fieldIdx){

  if(!Array.isArray(f.hints))return;

  f.hints.forEach((rule,ruleIdx)=>{

    (rule.conditions||[]).forEach((cond,condIdx)=>{

      const colSel=
        document.getElementById(
          `mf_ruleCond_col_${fieldIdx}_${ruleIdx}_${condIdx}`
        );

      const opSel=
        document.getElementById(
          `mf_ruleCond_op_${fieldIdx}_${ruleIdx}_${condIdx}`
        );

      const valInput=
        document.getElementById(
          `mf_ruleCond_val_${fieldIdx}_${ruleIdx}_${condIdx}`
        );

      if(colSel)cond.colId=colSel.value;
      if(opSel)cond.op=opSel.value;
      if(valInput)cond.value=valInput.value;
    });

    const textInput=
      document.getElementById(
        `mf_ruleText_${fieldIdx}_${ruleIdx}`
      );

    if(textInput)rule.text=textInput.value;
  });
}


/*
 * KENTTIEN EHDOT JA SIIRTYMÄT
 *
 * Kentälle voi määrittää kahdenlaista logiikkaa:
 *
 *  - f.showIf = [{fieldId,op,value}, ...]
 *    Oletuksena kenttä näytetään lomakkeella vain, jos KAIKKI ehdot
 *    täyttyvät (JA). Jos f.showMode==="any", kenttä näytetään kun
 *    JOKIN ehdoista täyttyy (TAI).
 *    Ehto voi viitata vain aiempaan (ylempänä olevaan) kenttään.
 *
 *  - f.jumps = [{id,op,value,target}, ...]
 *    Kun TÄMÄN kentän arvo täyttää ehdon, siirrytään suoraan kohdekenttään
 *    (target = kentän id tai JUMP_END) ja välissä olevat kentät piilotetaan.
 *    Kohteen pitää olla myöhemmin kuin lähdekenttä. Ensimmäinen täsmäävä
 *    siirtymä voittaa.
 *
 * Piilotetun kentän arvoa ei vaadita, ei validoida eikä viedä raporttiin,
 * ja muut ehdot käsittelevät sitä tyhjänä.
 */
const JUMP_END="__end";

function condOpsForType(type){
  let ops=hintOpsForType(type);
  if(type==="select"){
    ops=ops.filter(o=>o.value!=="contains");
  }
  return ops.concat([
    { value:"filled", label:"on täytetty" },
    { value:"empty", label:"on tyhjä" }
  ]);
}

function condNeedsValue(op){
  return op!=="filled" && op!=="empty";
}

/*
 * strictEmpty=true (siirtymät): tyhjä kenttä ei täytä muita ehtoja kuin
 * "on tyhjä" — muuten esim. "ei ole Y" hyppäisi yli kenttiä ennen kuin
 * tutkija on ehtinyt vastata mitään.
 */
function evalCondition(cond,type,rawValue,strictEmpty){

  const isEmpty=
    rawValue===undefined ||
    rawValue===null ||
    String(rawValue).trim()==="";

  if(cond.op==="filled")return !isEmpty;
  if(cond.op==="empty")return isEmpty;

  if(isEmpty)return strictEmpty?false:cond.op==="neq";

  return evalHintRule(cond,type,rawValue);
}

function computeFieldVisibility(fields,values,info){

  const vis={};
  const byId={};

  fields.forEach((f,i)=>{ byId[f.id]=i; });

  let skipUntil=0;

  fields.forEach((f,i)=>{

    if(i<skipUntil){
      vis[f.id]=false;
      return;
    }

    const anyMode=f.showMode==="any";
    let ok=true;
    let checked=0;
    let anyPassed=false;

    (Array.isArray(f.showIf)?f.showIf:[]).forEach(c=>{

      const si=byId[c.fieldId];

      /* Virheellinen viittaus (poistettu / väärässä suunnassa) ohitetaan. */
      if(si===undefined || si>=i)return;

      const src=fields[si];

      if(src.type==="table")return;

      const raw=vis[src.id]?values[src.id]:undefined;

      checked++;

      if(evalCondition(c,src.type,raw,false))anyPassed=true;
      else ok=false;
    });

    /* TAI-tilassa riittää yksi täyttyvä ehto. Jos yhtään kelvollista
       ehtoa ei ole, kenttä näytetään (kuten JA-tilassa). */
    if(anyMode && checked>0)ok=anyPassed;

    if(!ok){
      vis[f.id]=false;
      return;
    }

    vis[f.id]=true;

    if(f.type==="table")return;

    const jumps=Array.isArray(f.jumps)?f.jumps:[];

    for(const j of jumps){

      const t=j.target===JUMP_END?fields.length:byId[j.target];

      if(t===undefined || t<=i)continue;

      if(evalCondition(j,f.type,values[f.id],true)){
        skipUntil=Math.max(skipUntil,t);
        if(info && info.jumps)info.jumps[f.id]={from:i,to:t};
        break;
      }
    }
  });

  return vis;
}

function mkSelect(items,current,style){

  const sel=document.createElement("select");

  if(style)sel.style.cssText=style;

  items.forEach(([v,l])=>{
    const o=document.createElement("option");
    o.value=v;
    o.textContent=l;
    if(v===current)o.selected=true;
    sel.appendChild(o);
  });

  return sel;
}

    const list=[];
    for(let i=0;i<idx;i++){
      if(fields[i].type!=="table")list.push(i);
    }
    return list;
  }

  function showIfInvalid(c){
    const si=fields.findIndex(x=>x.id===c.fieldId);
    return si===-1 || si>=idx || fields[si].type==="table";
  }

  function jumpInvalid(j){
    if(j.target===JUMP_END)return idx>=fields.length-1;
    const ti=fields.findIndex(x=>x.id===j.target);
    return ti===-1 || ti<=idx;
  }

  function updateLogicSummary(){

    const jumps=f.type==="table"?[]:f.jumps;
    const n=f.showIf.length+jumps.length;
    const bad=
      f.showIf.some(showIfInvalid) ||
      jumps.some(jumpInvalid);

    logicCount.innerHTML=
      (n?` (${n})`:"")+
      (bad?` <span style="color:var(--warn);">⚠</span>`:"");
  }

  function buildValueControl(cond,srcField){

    if(!condNeedsValue(cond.op))return null;

    if(srcField.type==="select"){

      const opts=(srcField.options||[]).slice();
      const items=[["","Valitse..."]];

      opts.forEach(o=>items.push([o,o]));

      if(cond.value && !opts.includes(cond.value)){
        items.push([cond.value,cond.value+" (ei enää vaihtoehtona)"]);
      }

      const sel=mkSelect(items,cond.value||"","flex:1;width:auto;min-width:90px;");

      sel.onchange=e=>{ cond.value=e.target.value; };

      return sel;
    }

    const inp=document.createElement("input");
    inp.type="text";
    if(srcField.type==="number")inp.inputMode="decimal";
    inp.placeholder="Arvo";
    inp.value=cond.value||"";
    inp.style.cssText="width:90px;flex:0 0 auto;";
    inp.oninput=e=>{ cond.value=e.target.value; };

    return inp;
  }

  function buildOpControl(cond,srcField){

    const ops=condOpsForType(srcField.type);

    if(!ops.find(o=>o.value===cond.op)){
      cond.op=ops[0].value;
    }

    const sel=mkSelect(
      ops.map(o=>[o.value,o.label]),
      cond.op,
      "flex:0 0 auto;width:auto;"
    );

    sel.onchange=e=>{
      cond.op=e.target.value;
      renderLogic();
    };

    return sel;
  }

  function warnEl(text){
    return el(`<div style="font-size:12px;color:var(--warn);margin:2px 0 6px;">⚠ ${escapeHtml(text)}</div>`);
  }

  function renderLogic(){

    updateLogicSummary();

    logicBody.innerHTML="";

    logicBody.appendChild(el(`
      <div class="hint">
        Ehdot vaikuttavat vain lomakkeeseen. Piilotetun kentän tietoja
        ei vaadita eikä viedä raporttiin, vaikka kenttä olisi pakollinen.
      </div>
    `));

    /* ---------- Näyttöehdot ---------- */

    logicBody.appendChild(el(`<div style="font-weight:700;font-size:13px;margin-top:8px;">Näytä tämä kenttä vain, jos</div>`));

    const sources=eligibleSources();

    if(!sources.length){

      logicBody.appendChild(el(`
        <div class="hint">
          ${idx===0
            ?"Ensimmäiselle kentälle ei voi asettaa näyttöehtoa, koska sen yläpuolella ei ole kenttiä."
            :"Yläpuolella ei ole kenttiä, joiden arvoon ehdon voisi sitoa (taulukkokenttiä ei voi käyttää ehdon lähteenä)."}
        </div>
      `));

    }else{

      if(f.showIf.length>1){

        const modeLine=el(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;"></div>`);

        modeLine.appendChild(el(`<span style="font-size:12px;color:#6b6656;flex:0 0 auto;">Ehtojen yhdistäminen:</span>`));

        const modeSel=mkSelect(
          [
            ["all","JA — kaikkien ehtojen pitää täyttyä"],
            ["any","TAI — riittää, että jokin ehdoista täyttyy"]
          ],
          f.showMode==="any"?"any":"all",
          "flex:1;width:auto;min-width:140px;"
        );

        modeSel.onchange=e=>{
          if(e.target.value==="any")f.showMode="any";
          else delete f.showMode;
          renderLogic();
        };

        modeLine.appendChild(modeSel);
        logicBody.appendChild(modeLine);
      }

      f.showIf.forEach((c,cIdx)=>{

        const invalid=showIfInvalid(c);
        const srcIdx=fields.findIndex(x=>x.id===c.fieldId);
        const src=(!invalid)?fields[srcIdx]:fields[sources[0]];

        const items=sources.map(i=>[fields[i].id,fieldName(i)]);

        if(invalid)items.unshift(["","⚠ Valitse kenttä"]);

        const box=el(`<div style="margin-bottom:8px;"></div>`);
        const line=el(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"></div>`);

        if(cIdx>0){
          line.appendChild(el(`<span style="font-size:11px;color:#6b6656;flex:0 0 auto;">${f.showMode==="any"?"TAI":"JA"}</span>`));
        }

        const srcSel=mkSelect(items,invalid?"":c.fieldId,"flex:1;width:auto;min-width:120px;");

        srcSel.onchange=e=>{
          c.fieldId=e.target.value;
          c.value="";
          renderLogic();
        };

        line.appendChild(srcSel);

        if(!invalid){

          line.appendChild(buildOpControl(c,src));

          const vc=buildValueControl(c,src);
          if(vc)line.appendChild(vc);
        }

        const del=el(`<button type="button" class="btn btn-sm btn-danger" title="Poista ehto">✕</button>`);

        del.onclick=()=>{
          f.showIf.splice(cIdx,1);
          renderLogic();
        };

        line.appendChild(del);
        box.appendChild(line);

        if(invalid && c.fieldId){
          box.appendChild(warnEl("Ehto viittaa kenttään, joka ei ole enää tämän kentän yläpuolella. Valitse kenttä uudelleen tai poista ehto."));
        }

        logicBody.appendChild(box);
      });

      const addShow=el(`<button type="button" class="btn btn-sm btn-outline">+ Lisää näyttöehto</button>`);

      addShow.onclick=()=>{
        const last=fields[sources[sources.length-1]];
        f.showIf.push({
          fieldId:last.id,
          op:condOpsForType(last.type)[0].value,
          value:""
        });
        renderLogic();
      };

      logicBody.appendChild(addShow);
    }

    /* ---------- Siirtymät ---------- */

    logicBody.appendChild(el(`<div style="font-weight:700;font-size:13px;margin-top:14px;">Kun tämän kentän arvo täyttää ehdon</div>`));

    if(f.type==="table"){

      logicBody.appendChild(el(`<div class="hint">Siirtymiä ei voi asettaa taulukkokentälle.</div>`));
      return;
    }

    if(idx>=fields.length-1){

      logicBody.appendChild(el(`<div class="hint">Tämän kentän jälkeen ei ole kenttiä, joihin voisi siirtyä.</div>`));
      return;
    }

    f.jumps.forEach((j,jIdx)=>{

      const invalid=jumpInvalid(j);

      const box=el(`<div class="card" style="padding:8px;margin-bottom:8px;background:#fff;"></div>`);
      const line=el(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"></div>`);

      line.appendChild(el(`<span style="font-size:12px;color:#6b6656;flex:0 0 auto;">Jos arvo</span>`));
      line.appendChild(buildOpControl(j,f));

      const vc=buildValueControl(j,f);
      if(vc)line.appendChild(vc);

      box.appendChild(line);

      const tItems=[];

      for(let i=idx+1;i<fields.length;i++){
        tItems.push([fields[i].id,fieldName(i)]);
      }

      tItems.push([JUMP_END,"Lomakkeen loppu (ohita loput kentät)"]);

      if(invalid)tItems.unshift(["","⚠ Valitse kohdekenttä"]);

      const line2=el(`<div style="display:flex;gap:6px;align-items:center;margin-top:6px;"></div>`);

      line2.appendChild(el(`<span style="font-size:12px;color:#6b6656;flex:0 0 auto;">siirry kenttään</span>`));

      const tSel=mkSelect(tItems,invalid?"":j.target,"flex:1;width:auto;min-width:120px;");

      tSel.onchange=e=>{
        j.target=e.target.value;
        renderLogic();
      };

      line2.appendChild(tSel);

      const del=el(`<button type="button" class="btn btn-sm btn-danger" title="Poista siirtymä">✕</button>`);

      del.onclick=()=>{
        f.jumps.splice(jIdx,1);
        renderLogic();
      };

      line2.appendChild(del);
      box.appendChild(line2);

      box.appendChild(el(`<div style="font-size:12px;color:#6b6656;margin-top:4px;">Välissä olevat kentät piilotetaan.</div>`));

      if(invalid && j.target){
        box.appendChild(warnEl("Kohdekenttä ei ole enää tämän kentän jälkeen. Valitse kohde uudelleen tai poista siirtymä."));
      }

      logicBody.appendChild(box);
    });

    const addJump=el(`<button type="button" class="btn btn-sm btn-outline">+ Lisää siirtymä</button>`);

    addJump.onclick=()=>{
      f.jumps.push({
        id:genFieldId(),
        op:condOpsForType(f.type)[0].value,
        value:"",
        target:fields[idx+1].id
      });
      renderLogic();
    };

    logicBody.appendChild(addJump);
  }

  /* Sisältö piirretään uudelleen aina kun osio avataan, jotta valikoissa
     on muiden kenttien ajantasaiset nimet ja vaihtoehdot. */
  logicBox.addEventListener("toggle",()=>{
    if(logicBox.open){
      logicOpenIds.add(f.id);
      renderLogic();
    }else{
      logicOpenIds.delete(f.id);
    }
  });

  renderLogic();

  return row;
}

/*
 * Ennen kuin kenttälista piirretään uudelleen (kentän lisäys/poisto),
 * luetaan DOM:ssa jo auki olevien kenttärivien arvot talteen — muuten
 * esim. kesken kirjoituksen oleva nimi katoaisi rivin lisäyksen/poiston
 * yhteydessä.
 */
function syncMethodFieldsFromDom(fields){
  fields.forEach((f,idx)=>{
    const labelInput=document.getElementById("mf_label_"+idx);
    if(!labelInput)return;
    f.label=labelInput.value;

    const typeSelect=document.getElementById("mf_type_"+idx);
    if(typeSelect)f.type=typeSelect.value;

    const placeholderInput=document.getElementById("mf_placeholder_"+idx);
    if(placeholderInput)f.placeholder=placeholderInput.value;

    const reqCheck=document.getElementById("mf_req_"+idx);
    if(reqCheck)f.req=reqCheck.checked;

    const optionsTextarea=document.getElementById("mf_options_"+idx);
    if(optionsTextarea){
      f.options=
        optionsTextarea.value
          .split("\n")
          .map(s=>s.trim())
          .filter(Boolean);
    }

    if(f.type==="table"){
      syncFieldTableHintsFromDom(f,idx);
    }else{
      syncFieldHintsFromDom(f,idx);
    }
    syncFieldColumnsFromDom(f,idx);
  });
}

async function saveMethodEdit(){

  const name=document.getElementById("me_name").value.trim();
  const short=document.getElementById("me_short").value.trim();

  if(!name){
    toast("Anna menetelmälle nimi");
    return;
  }

  const fields=editingMethod.fields;

  for(let i=0;i<fields.length;i++){
    const labelInput=document.getElementById("mf_label_"+i);
    const typeSelect=document.getElementById("mf_type_"+i);
    const placeholderInput=document.getElementById("mf_placeholder_"+i);
    const reqCheck=document.getElementById("mf_req_"+i);
    const optionsTextarea=document.getElementById("mf_options_"+i);

    const label=labelInput.value.trim();
    if(!label){
      toast("Jokaisella kentällä pitää olla nimi");
      return;
    }

    fields[i].label=label;
    fields[i].type=typeSelect.value;
    fields[i].placeholder=placeholderInput.value.trim();
    fields[i].req=reqCheck.checked;

    if(fields[i].type==="select"){
      fields[i].options=
        optionsTextarea.value
          .split("\n")
          .map(s=>s.trim())
          .filter(Boolean);
      if(!fields[i].options.length){
        toast('Anna "'+label+'" -kentälle vähintään yksi vaihtoehto');
        return;
      }
    }else{
      delete fields[i].options;
    }

    if(fields[i].type==="table"){

      syncFieldColumnsFromDom(fields[i],i);

      fields[i].columns=
        (fields[i].columns||[])
          .map(col=>{

            const type=
              (col.type==="number"||col.type==="select")
                ?col.type
                :"text";

            const cleaned={
              id:col.id||genFieldId(),
              label:String(col.label||"").trim(),
              type
            };

            if(type==="select"){
              cleaned.options=
                (col.options||[])
                  .map(s=>String(s).trim())
                  .filter(Boolean);
            }

            return cleaned;
          });

      if(fields[i].columns.some(col=>col.label==="")){
        toast('Anna jokaiselle "'+label+'" -taulukon sarakkeelle nimi');
        return;
      }

      if(
        fields[i].columns.some(col=>
          col.type==="select" &&
          (!col.options||!col.options.length)
        )
      ){
        toast('Anna jokaiselle "'+label+'" -taulukon valintasarakkeelle vähintään yksi vaihtoehto');
        return;
      }

      if(!fields[i].columns.length){
        toast('Lisää "'+label+'" -taulukolle vähintään yksi sarake');
        return;
      }

    }else{
      fields[i].columns=[];
    }

    if(fields[i].type==="table"){

      syncFieldTableHintsFromDom(fields[i],i);

      const validColIds=
        new Set(fields[i].columns.map(c=>c.id));

      fields[i].hints=
        (fields[i].hints||[])
          .map(rule=>({
            id:rule.id||genFieldId(),
            conditions:
              (rule.conditions||[])
                .map(c=>({
                  colId:c.colId,
                  op:c.op,
                  value:String(c.value||"").trim()
                }))
                .filter(c=>
                  validColIds.has(c.colId) &&
                  c.value!==""
                ),
            text:String(rule.text||"").trim()
          }))
          .filter(rule=>
            rule.text!=="" &&
            rule.conditions.length>0
          );

    }else{

      syncFieldHintsFromDom(fields[i],i);

      fields[i].hints=
        (fields[i].hints||[])
          .map(r=>({
            id:r.id||genFieldId(),
            op:r.op,
            value:String(r.value||"").trim(),
            text:String(r.text||"").trim()
          }))
          .filter(r=>
            r.text!=="" &&
            r.value!==""
          );
    }

    if(!fields[i].id) fields[i].id=genFieldId();
  }

  if(!fields.length){
    toast("Lisää menetelmälle vähintään yksi kenttä");
    return;
  }

  /*
   * Ehtojen ja siirtymien tarkistus: näyttöehdon lähteen pitää olla
   * ylempänä kuin kenttä itse, ja siirtymän kohteen alempana. Tarkistus
   * tehdään ennen kuin mitään muutetaan, ettei virhe jätä mallia
   * puolittain siivotuksi.
   */
  const idxById={};
  fields.forEach((ff,i)=>{ idxById[ff.id]=i; });

  for(let i=0;i<fields.length;i++){

    const ff=fields[i];

    for(const c of (Array.isArray(ff.showIf)?ff.showIf:[])){

      const si=idxById[c.fieldId];

      if(si===undefined || si>=i || fields[si].type==="table"){
        toast('Kentän "'+ff.label+'" näyttöehto viittaa kenttään, jonka pitää olla ennen tätä kenttää. Korjaa tai poista ehto.');
        return;
      }
    }

    if(ff.type==="table")continue;

    for(const j of (Array.isArray(ff.jumps)?ff.jumps:[])){

      if(j.target===JUMP_END){

        if(i>=fields.length-1){
          toast('Kentän "'+ff.label+'" siirtymän kohde on virheellinen. Korjaa tai poista siirtymä.');
          return;
        }

        continue;
      }

      const ti=idxById[j.target];

      if(ti===undefined || ti<=i){
        toast('Kentän "'+ff.label+'" siirtymän kohdekentän pitää olla tämän kentän jälkeen. Korjaa tai poista siirtymä.');
        return;
      }
    }
  }

  /* Siivotaan keskeneräiset rivit (arvo puuttuu) ja tyhjät listat. */
  const condDone=x=>!condNeedsValue(x.op) || String(x.value||"").trim()!=="";

  fields.forEach(ff=>{

    ff.showIf=
      (Array.isArray(ff.showIf)?ff.showIf:[])
        .filter(condDone)
        .map(c=>({
          fieldId:c.fieldId,
          op:c.op,
          value:condNeedsValue(c.op)?String(c.value).trim():""
        }));

    ff.jumps=
      ff.type==="table"
        ?[]
        :(Array.isArray(ff.jumps)?ff.jumps:[])
          .filter(condDone)
          .map(j=>({
            id:j.id||genFieldId(),
            op:j.op,
            value:condNeedsValue(j.op)?String(j.value).trim():"",
            target:j.target
          }));

    if(!ff.showIf.length)delete ff.showIf;

    /* TAI-tila säilytetään vain, jos ehtoja on useampi kuin yksi. */
    if(ff.showMode!=="any" || !ff.showIf || ff.showIf.length<2)delete ff.showMode;
    if(!ff.jumps.length)delete ff.jumps;
  });

  editingMethod.name=name;
  editingMethod.short=short||name;

  const prevGuides=methodGuides(METHODS.find(m=>m.id===editingMethod.id));

  fields.forEach(ff=>{
    if(!ff.guide||!ff.guide.path)delete ff.guide;
  });

  if(editingMethodIsNew){
    METHODS.push(editingMethod);
  }else{
    const idx=METHODS.findIndex(m=>m.id===editingMethod.id);
    if(idx===-1){
      METHODS.push(editingMethod);
    }else{
      METHODS[idx]=editingMethod;
    }
  }

  await persistMethods();

  /* Poistetaan korvatut ja poistetut vanhat ohjetiedostot. */
  const nowPaths=new Set(methodGuides(editingMethod).map(g=>g.path));
  prevGuides.forEach(g=>{
    if(!nowPaths.has(g.path))deleteGuideFile(g);
  });

  editingMethod=null;
  editingMethodIsNew=false;
  view="methodsManage";
  render();

  toast("Menetelmä tallennettu");
}

function renderEntryForm(){

  const m=

   */

        f,
        editingEntry.values
      )
    );
  });


  container.appendChild(common);


  /*
   * Menetelmäkohtaiset kentät.
   */
  const spec=
    el(`
      <div class="card">
        <h2>${escapeHtml(m.name)}</h2>
      </div>
    `);


  const fieldWrappers={};

  m.fields.forEach(f=>{

    const w=
      renderField(
        f,
        editingEntry.values
      );

    fieldWrappers[f.id]=w;

    attachFieldGuide(w,f);

    spec.appendChild(w);
  });


  /*
   * Ehdolliset kentät: piilotetaan/näytetään kenttiä lennossa aina kun
   * jokin arvo muuttuu (ei koko lomaketta uudelleen piirtäen, ettei
   * kohdistus katoa kirjoittaessa).
   */
  let jumpNotes=[];
  function applyFieldVisibility(){
    const info={jumps:{}};
    const vis=
      computeFieldVisibility(
        m.fields,
        editingEntry.values,
        info
      );
    m.fields.forEach(f=>{
      const w=fieldWrappers[f.id];
      if(w){
        w.style.display=
          vis[f.id]===false?"none":"";
      }
    });
    jumpNotes.forEach(n=>n.remove());
    jumpNotes=[];
    m.fields.forEach((f,i)=>{
      const j=info.jumps[f.id];
      const w=fieldWrappers[f.id];
      if(!j||!w||vis[f.id]===false)return;
      const n=j.to-i-1;
      if(n<=0)return;
      const note=el(
        `<div class="jump-note">↷ Vastauksen perusteella ohitetaan ${n} kenttä${n===1?"":"ä"}</div>`
      );
      w.after(note);
      jumpNotes.push(note);
    });
  }

  applyFieldVisibility();

  spec.addEventListener("input",applyFieldVisibility);
  spec.addEventListener("change",applyFieldVisibility);


  container.appendChild(spec);


  /*
   * Lisähuomiot.
   */
  const note=
    el(`
      <div class="card">
        <h2>Lisähuomiot</h2>
      </div>
    `);


  note.appendChild(
    renderField(
      {
        id:"huomiot",
        label:"Vapaa huomio (valinnainen)",
        type:"textarea"
      },
      editingEntry.values
    )
  );


  container.appendChild(note);


  /*

   */
  function buildPhotoCard(){
  const pc=
    el(`
      <div class="card">
