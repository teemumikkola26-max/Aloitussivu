function renderField(f,values){

  if(f.type==="table"){
    return renderTableField(f,values);
  }

  const rawValue=
    values[f.id];

  const val=
    rawValue===undefined ||
    rawValue===null
      ?""
      :String(rawValue);


  let ih;
  const useChips=
    f.type==="select" &&
    Array.isArray(f.options) &&
    f.options.length>=1 &&
    f.options.length<=4 &&
    f.options.every(o=>String(o).length<=26);
  const chipsHtml=
    useChips
      ?`<input type="hidden" id="fld_${escapeAttribute(f.id)}" value="${escapeAttribute(val)}">
        <div class="chip-group" role="radiogroup" aria-labelledby="lbl_${escapeAttribute(f.id)}">
          ${f.options.map(o=>`<button type="button" class="chip" role="radio" aria-checked="${o===val}" data-val="${escapeAttribute(o)}">${escapeHtml(o)}</button>`).join("")}
        </div>`
      :"";


  if(f.type==="textarea"){

    ih=
      `
        <textarea
          id="fld_${escapeAttribute(f.id)}"
          autocomplete="off"
          placeholder="${escapeAttribute(f.placeholder||"")}"
        >${escapeHtml(val)}</textarea>
      `;

  }else if(useChips){
    ih=chipsHtml;
  }else if(f.type==="select"){

    ih=
      `
        <select
          id="fld_${escapeAttribute(f.id)}"
        >
          <option value="">
            Valitse...
          </option>

          ${f.options.map(o=>`
            <option
              value="${escapeAttribute(o)}"
              ${o===val?"selected":""}
            >
              ${escapeHtml(o)}
            </option>
          `).join("")}

        </select>
      `;

  }else{

    ih=
      `
        <input
          type="${escapeAttribute(f.type)}"
          ${f.type==="number" && f.min!==undefined && Number(f.min)>=0?'inputmode="decimal"':""}
          id="fld_${escapeAttribute(f.id)}"
          autocomplete="off"
          placeholder="${escapeAttribute(f.placeholder||"")}"
          value="${escapeAttribute(val)}"
          ${f.min!==undefined?`min="${escapeAttribute(f.min)}"`:""}
          ${f.max!==undefined?`max="${escapeAttribute(f.max)}"`:""}
          ${f.step!==undefined?`step="${escapeAttribute(f.step)}"`:""}
        >
      `;
  }


  const hasHints=
    Array.isArray(f.hints) &&
    f.hints.length>0;


  const w=
    el(`
      <div class="field-hint-host" style="position:relative;">

        <label class="${f.req?"req":""}" ${useChips?`id="lbl_${escapeAttribute(f.id)}"`:`for="fld_${escapeAttribute(f.id)}"`}>
          ${escapeHtml(f.label)}
        </label>

        ${hasHints?`
          <button
            type="button"
            class="field-hint-btn"
            id="hintbtn_${escapeAttribute(f.id)}"
            title="Näytä apulause"
            style="display:none;"
          >!</button>
        `:""}

        ${ih}

        ${hasHints?`
          <div
            class="field-hint-box"
            id="hintbox_${escapeAttribute(f.id)}"
          ></div>
        `:""}

      </div>
    `);


  const input=
    w.querySelector(
      `#fld_${CSS.escape(f.id)}`
    );


  let refreshHint=()=>{};

  if(hasHints){

    const hintBtn=
      w.querySelector(
        `#hintbtn_${CSS.escape(f.id)}`
      );

    const hintBox=
      w.querySelector(
        `#hintbox_${CSS.escape(f.id)}`
      );

    refreshHint=()=>{

      const matches=
        matchingHints(f,values[f.id]);

      if(matches.length){

        hintBtn.style.display="flex";

        hintBox.innerHTML=
          matches
            .map(t=>escapeHtml(t))
            .join("<br>");

      }else{

        hintBtn.style.display="none";
        hintBox.classList.remove("open");
      }
    };

    hintBtn.onclick=()=>{
      hintBox.classList.toggle("open");
    };

    refreshHint();
  }


  input.oninput=e=>{

    values[f.id]=e.target.value;

    refreshHint();

    scheduleAutosave();
  };


  input.onchange=e=>{

    values[f.id]=e.target.value;

    refreshHint();

    scheduleAutosave();
  };
  if(useChips){
    const chips=[...w.querySelectorAll(".chip")];
    chips.forEach(chip=>{
      chip.onclick=()=>{
        const o=chip.getAttribute("data-val");
        const next=(input.value===o)?"":o;
        input.value=next;
        chips.forEach(c2=>c2.setAttribute("aria-checked",String(c2.getAttribute("data-val")===next)));
        values[f.id]=next;
        refreshHint();
        scheduleAutosave();
        input.dispatchEvent(new Event("change",{bubbles:true}));
      };
    });
  }
  return w;
}


/*
 * TAULUKKOKENTTÄ (esim. rakenneavauksen rakennekerrokset)
 *
 * values[f.id] on lista rivejä, jokainen rivi { [sarakeId]: arvo }.
 * Tutkija voi lisätä ja poistaa rivejä vapaasti lomakkeella.
 */
function renderTableField(f,values){

  if(!Array.isArray(values[f.id])){
    values[f.id]=[];
  }

  const rows=
    values[f.id];

  const cols=
    Array.isArray(f.columns) &&
    f.columns.length
      ?f.columns
      :[{ id:"col1", label:"Arvo", type:"text" }];

  const hasHints=
    Array.isArray(f.hints) &&
    f.hints.length>0;


  const wrap=
    el(`
      <div class="table-field">

        <label class="${f.req?"req":""}">
          ${escapeHtml(f.label)}
        </label>

        <div class="table-field-scroll">
          <table class="table-field-table">
            <thead>
              <tr>
                ${cols.map(c=>`
                  <th>${escapeHtml(c.label||"")}</th>
                `).join("")}
                <th class="table-field-action"></th>
              </tr>
            </thead>
            <tbody id="tblbody_${escapeAttribute(f.id)}"></tbody>
          </table>
        </div>

        <button
          type="button"
          class="btn btn-sm btn-outline"
          id="tbladd_${escapeAttribute(f.id)}"
        >
          + Lisää rivi
        </button>

      </div>
    `);


  const tbody=
    wrap.querySelector(
      `#tblbody_${CSS.escape(f.id)}`
    );


  function renderRows(){

    tbody.innerHTML="";

    rows.forEach((row,rIdx)=>{

      const tr=
        elRow(`
          <tr>
            ${cols.map(c=>{

              if(c.type==="select"){

                const curVal=
                  row[c.id]!==undefined && row[c.id]!==null
                    ?row[c.id]
                    :"";

                return `
                  <td>
                    <select
                      id="tblcell_${escapeAttribute(f.id)}_${rIdx}_${escapeAttribute(c.id)}"
                    >
                      <option value="">Valitse...</option>
                      ${(c.options||[]).map(o=>`
                        <option
                          value="${escapeAttribute(o)}"
                          ${o===curVal?"selected":""}
                        >${escapeHtml(o)}</option>
                      `).join("")}
                    </select>
                  </td>
                `;
              }

              return `
                <td>
                  <input
                    type="${c.type==="number"?"number":"text"}"
                    aria-label="${escapeAttribute(c.label||"")}"
                    id="tblcell_${escapeAttribute(f.id)}_${rIdx}_${escapeAttribute(c.id)}"
                    autocomplete="off"
                    ${c.type==="number"?'step="any"':""}
                    value="${escapeAttribute(
                      row[c.id]!==undefined && row[c.id]!==null
                        ?row[c.id]
                        :""
                    )}"
                  >
                </td>
              `;
            }).join("")}
            <td class="table-field-action">
              <div style="display:flex;gap:4px;align-items:center;">
                ${hasHints?`
                  <button
                    type="button"
                    class="field-hint-btn-inline"
                    id="tblhint_${escapeAttribute(f.id)}_${rIdx}"
                    title="Näytä apulause"
                    style="display:none;"
                  >!</button>
                `:""}
                <button
                  type="button"
                  class="btn btn-sm btn-danger"
                  id="tblrm_${escapeAttribute(f.id)}_${rIdx}"
                >✕</button>
              </div>
            </td>
          </tr>
        `);

      tbody.appendChild(tr);


      let hintRowEl=null;

      if(hasHints){

        hintRowEl=
          elRow(`
            <tr id="tblhintrow_${escapeAttribute(f.id)}_${rIdx}" style="display:none;">
              <td colspan="${cols.length+1}" style="border-bottom:1px solid var(--line);">
                <div class="field-hint-box open" id="tblhintbox_${escapeAttribute(f.id)}_${rIdx}"></div>
              </td>
            </tr>
          `);

        tbody.appendChild(hintRowEl);
      }


      function refreshRowHint(){

        if(!hasHints)return;

        const matches=
          matchingTableRowHints(f,cols,row);

        const btn=
          tr.querySelector(
            `#tblhint_${CSS.escape(f.id)}_${rIdx}`
          );

        if(matches.length){

          btn.style.display="flex";

          hintRowEl.querySelector(
            `#tblhintbox_${CSS.escape(f.id)}_${rIdx}`
          ).innerHTML=
            matches
              .map(t=>escapeHtml(t))
              .join("<br>");

        }else{

          btn.style.display="none";
          hintRowEl.style.display="none";
        }
      }


      if(hasHints){

        tr.querySelector(
          `#tblhint_${CSS.escape(f.id)}_${rIdx}`
        ).onclick=()=>{

          hintRowEl.style.display=
            hintRowEl.style.display==="none"
              ?"table-row"
              :"none";
        };

        refreshRowHint();
      }


      cols.forEach(c=>{

        const inp=
          tr.querySelector(
            `#tblcell_${CSS.escape(f.id)}_${rIdx}_${CSS.escape(c.id)}`
          );

        inp.oninput=e=>{
          row[c.id]=e.target.value;
          refreshRowHint();
          scheduleAutosave();
        };

        inp.onchange=e=>{
          row[c.id]=e.target.value;
          refreshRowHint();
          scheduleAutosave();
        };
      });

      tr.querySelector(
        `#tblrm_${CSS.escape(f.id)}_${rIdx}`
      ).onclick=()=>{

        rows.splice(rIdx,1);

        renderRows();

        scheduleAutosave();
      };
    });
  }

  renderRows();

  wrap.querySelector(
    `#tbladd_${CSS.escape(f.id)}`
  ).onclick=()=>{

    const emptyRow={};

    cols.forEach(c=>{
      emptyRow[c.id]="";
    });

    rows.push(emptyRow);

    renderRows();

    scheduleAutosave();
  };

  return wrap;
}

function saveEntryForm(){

  const m=
    METHODS.find(
      x=>x.id===editingEntry.methodId
    );


  const missing=findMissingRequired(editingEntry,m);
  if(missing.length){
    showFieldErrors(missing.map(f=>[f,"Pakollinen tieto puuttuu"]));
    toast("Pakollisia kenttiä puuttuu: "+missing.length);
    return;
  }
  clearFieldErrors();
  const visMap=
    computeFieldVisibility(
      m.fields,
      editingEntry.values
    );
  const isVisible=
    f=>visMap[f.id]!==false;


  /*
   * Tarkistetaan numeroarvot.
   */
  for(const f of m.fields){

    if(!isVisible(f))continue;

    if(f.type==="table"){

      const tRows=
        Array.isArray(editingEntry.values[f.id])
          ?editingEntry.values[f.id]
          :[];

      const cols=
        Array.isArray(f.columns)
          ?f.columns
          :[];

      for(const col of cols){

        if(col.type!=="number")continue;

        for(const row of tRows){

          const value=
            row[col.id];

          if(
            value===undefined ||
            value===null ||
            String(value).trim()===""
          )continue;

          const n=
            Number(value);

          if(!Number.isFinite(n)){

            showFieldErrors([[f,`Kentän "${f.label} – ${col.label}" arvo ei ole kelvollinen numero.`]]);
          toast("Tarkista korostettu kenttä");
          return;
          }
        }
      }

      continue;
    }

    if(f.type!=="number")continue;

    const value=
      editingEntry.values[f.id];

    if(
      value!==undefined &&
      value!==null &&
      String(value).trim()!==""
    ){

      const n=
        Number(value);

      if(!Number.isFinite(n)){

        showFieldErrors([[f,`Kentän "${f.label}" arvo ei ole kelvollinen numero.`]]);
          toast("Tarkista korostettu kenttä");
          return;
      }


      if(
        f.min!==undefined &&
        n<Number(f.min)
      ){

        showFieldErrors([[f,`Kentän "${f.label}" arvo on liian pieni.`]]);
          toast("Tarkista korostettu kenttä");
          return;
      }


      if(
        f.max!==undefined &&
        n>Number(f.max)
      ){

        showFieldErrors([[f,`Kentän "${f.label}" arvo on liian suuri.`]]);
          toast("Tarkista korostettu kenttä");
          return;
      }
    }
  }


  if(editingIsNew){

    entries.push(
      editingEntry
    );
  }


  autosave();

  toast(
    "Menetelmä tallennettu"
  );


  view="project";

  editingEntry=null;
  editingIsNew=false;

  render();
}


function deleteCurrentEntry(){

  if(!editingEntry)return;


  if(
    !confirm(
      "Poistetaanko tämä menetelmä ja siihen liittyvät valokuvat?"
    )
  ){

    return;
  }


  const target=
    entries.find(
      e=>e.id===editingEntry.id
    );


  if(target){

    (target.photos||[]).forEach(p=>{

      if(p.url){

        try{
          URL.revokeObjectURL(p.url);
        }catch(err){}
      }


      if(
        p.path &&
        window.SubmissionSync
      ){

        window.SubmissionSync
          .deletePhotoFile(p.path)
          .catch(err=>{
            console.warn(
              "Pilvikuvan poisto epäonnistui",
              err
            );
          });
      }
    });
  }


  entries=
    entries.filter(
      e=>e.id!==editingEntry.id
    );


  editingEntry=null;
  editingIsNew=false;
  view="project";


  autosave();

  render();

  toast(
    "Menetelmä poistettu"
  );
}


/* ============================================================
   KUVIEN KÄSITTELY
   ============================================================ */

function dataUrlToBlob(dataUrl){

  const parts=
    dataUrl.split(",");

  const mime=
    (
      parts[0].match(
        /:(.*?);/
      ) || [, "image/jpeg"]
    )[1];


  const bin=
    atob(
      parts[1]||""
    );


  const bytes=
    new Uint8Array(
      bin.length
    );


  for(
    let i=0;
    i<bin.length;
    i++
  ){

    bytes[i]=
      bin.charCodeAt(i);
  }


  return new Blob(
    [bytes],
    {type:mime}
  );
}


/*
 * Kuvan pienennys.
 *
 * Tavoite:
 * - ei turhaa 4K/6K-kuvaa
 * - säilytetään riittävä tutkimuskuvan tarkkuus
 * - pienennetään selaimen muistinkulutusta
 *
 * Huom: nykyselaimet dekoodaavat kuvan EXIF-orientaation
 * automaattisesti <img>-elementtiin, joten canvasille piirto
 * säilyttää oikean suunnan käytännössä kaikissa ajantasaisissa
 * selaimissa. Jos tuki laajennetaan vanhempiin selaimiin,
 * EXIF-orientaatio tulee lukea ja kiertää erikseen.
 */
async function processImageFile(
  file,
  maxDimension=2500,
  quality=.84
){

  if(
    !file ||
    !file.type.startsWith("image/")
  ){

    throw new Error(
      "Tiedosto ei ole kuva"
    );
  }


  const dataUrl=
    await readFileAsDataUrl(file);


  const normalized=
    await normalizeImageOrientation(
      dataUrl,
      maxDimension,
      quality
    );


  return {
    blob:dataUrlToBlob(
      normalized.dataUrl
    ),
    width:normalized.width,
    height:normalized.height
  };
}


function readFileAsDataUrl(file){

  return new Promise(
    (resolve,reject)=>{

      const r=
        new FileReader();

      r.onload=
        ()=>resolve(r.result);

      r.onerror=
        ()=>reject(
          r.error||
          new Error("Tiedoston lukeminen epäonnistui")
        );

      r.readAsDataURL(file);
    }
  );
}


function blobToDataUrl(blob){

  return new Promise(
    (resolve,reject)=>{

      const r=
        new FileReader();

      r.onload=
        ()=>resolve(r.result);

      r.onerror=
        ()=>reject(
          r.error||
          new Error("Blobin lukeminen epäonnistui")
        );

      r.readAsDataURL(blob);
    }
  );
}


function normalizeImageOrientation(
  dataUrl,
  maxDimension=2500,
  quality=.84
){

  return new Promise(resolve=>{

    const img=
      new Image();


    img.onload=()=>{

      let width=
        img.naturalWidth||1;

      let height=
        img.naturalHeight||1;


      /*
       * Pienennetään suuria kuvia.
       */
      const largest=
        Math.max(
          width,
          height
        );


      if(
        largest>maxDimension
      ){

        const scale=
          maxDimension/largest;

        width=
          Math.round(
            width*scale
          );

        height=
          Math.round(
            height*scale
          );
      }


      const canvas=
        document.createElement(
          "canvas"
        );


      canvas.width=width;
      canvas.height=height;


      const ctx=
        canvas.getContext(
          "2d",
          {alpha:false}
        );


      ctx.fillStyle="#fff";
      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      let output;


      try{

        output=
          canvas.toDataURL(
            "image/jpeg",
            quality
          );

      }catch(err){

        output=dataUrl;
      }


      resolve({
        dataUrl:output,
        width,
        height
      });
    };


    img.onerror=()=>{

      resolve({
        dataUrl:dataUrl,
        width:1,
        height:1
      });
    };


    img.src=dataUrl;
  });
}


async function addPhotos(files){
  const target=editingEntry;
  if(!target)return;

  setSyncStatus(
    "Käsitellään kuvia..."
  );


  let added=0;


  for(const file of files){

    try{

      const processed=
        await processImageFile(
          file
        );


      const id=
        "ph"+
        Date.now()+
        Math.random()
          .toString(36)
          .slice(2,8);


      const blob=
        processed.blob;


      const url=
        URL.createObjectURL(
          blob
        );


      target.photos.push({

        id,

        url,

        blob,

        path:null,

        caption:"",

        width:processed.width,

        height:processed.height
      });


      added++;

    }catch(err){

      console.error(
        "Kuvan käsittely epäonnistui",
        err
      );

      toast(
        "Yhden kuvan käsittely epäonnistui."
      );
    }
  }


  if(added){

    await autosave();
    if(view==="entryForm" && editingEntry===target){
      refreshPhotoCard();
    }

    toast(
      `${added} kuva${added===1?"":"a"} lisätty`
    );
  }


  setSyncStatus(
    "Tallennettu laitteelle",
    "ok"
  );
}

let loadedDocStyle=null;


async function loadDocStyle(){

  try{

    if(
      !window.__supabaseClient
    ){

      loadedDocStyle=
        window.DocxStyleEngine.defaultStyle();

      return;
    }


    const {
      data,
      error
    }=
      await window.__supabaseClient
        .from("doc_styles")
        .select("style")
        .eq(
          "form_key",
          FORM_KEY
        )
        .maybeSingle();


    if(error || !data){

      loadedDocStyle=
        window.DocxStyleEngine.defaultStyle();

      return;
    }


    const d=
      window.DocxStyleEngine.defaultStyle();

    const s=
      data.style||{};


    loadedDocStyle={

      coverPage:
        Object.assign(
          {},
          d.coverPage,
          s.coverPage||{}
        ),

      header:
        Object.assign(
          {},
          d.header,
          s.header||{}
        ),

      footer:
        Object.assign(
          {},
          d.footer,
          s.footer||{}
        ),

      fonts:
        Object.assign(
          {},
          d.fonts,
          s.fonts||{}
        ),

      colors:
        Object.assign(
          {},
          d.colors,
          s.colors||{}
        ),

      toc:
        Object.assign(
          {},
          d.toc,
          s.toc||{}
        ),

      pagesBefore:
        s.pagesBefore||[],

      pagesAfter:
        s.pagesAfter||[]
    };

    await fetchDocxAttachments(loadedDocStyle);

  }catch(err){

    console.warn(
      "Word-tyylin lataus epäonnistui",
      err
    );

    loadedDocStyle=
      window.DocxStyleEngine.defaultStyle();
  }
}

/*
 * Hakee käyttäjän lataamat .docx-liitteet (kansilehti ja/tai vakiotekstisivut)
 * Supabase Storagesta ja liittää tavut _docxBytes-kenttään, jota
 * docx-style-engine.js käyttää altChunk-upotukseen.
 */
async function fetchDocxAttachment(path){
  try{
    const { data, error } = await window.__supabaseClient.storage.from("submission-photos").download(path);
    if (error || !data) return null;
    return await data.arrayBuffer();
  }catch(err){
    console.warn("Word-liitteen haku epäonnistui", path, err);
    return null;
  }
}

async function fetchDocxAttachments(s){
  if (s.coverPage && s.coverPage.sourceMode === "docx" && s.coverPage.docxPath){
    s.coverPage._docxBytes = await fetchDocxAttachment(s.coverPage.docxPath);
  }
  for (const page of (s.pagesBefore || []).concat(s.pagesAfter || [])){
    if (page.sourceMode === "docx" && page.docxPath){
      page._docxBytes = await fetchDocxAttachment(page.docxPath);
    }
  }
}


async function exportWord(){

  if(
    !project.nimi ||
    !project.tutkija
  ){

    view="project";

    render();

    toast(
      "Täytä kohteen nimi ja tutkijan nimi ennen vientiä"
    );

    return;
  }


  if(
    !window.DocxStyleEngine
  ){

    toast(
      "Vientimoottoria ei saatu ladattua. Tarkista verkkoyhteys ja yritä uudelleen."
    );

    return;
  }


  toast(
    "Muodostetaan Word-tiedostoa..."
  );


  if(!loadedDocStyle){

    await loadDocStyle();
  }


  const engine=
    window.DocxStyleEngine;

  const s=
    loadedDocStyle;


  const bodyParts=[];
  const extraMedia=[];

  let imgRelCounter=200;
  let imgDocPrCounter=1000;
  let photoNumber=1;


  function fieldRows(rows){

    bodyParts.push(
      engine.tableXml(
        rows,
        {
          headerColCount:1,
          noBorders:true,
          colWidthPercents:[28,72],
          font:s.fonts.body,
          sz:engine.pt2hp(
            s.fonts.bodySize
          ),
          color:s.colors.body,
          labelColor:"666666"
        }
      )
    );


    bodyParts.push(
      engine.paraXml(
        "",
        {after:120}
      )
    );
  }


  // Pääotsikko pidetään aina 16 pt:n kokoisena riippumatta raportin
  // muista otsikkotyylin asetuksista.
  bodyParts.push(
    engine.paraXml(
      "Kenttämuistiinpano",
      {
        bold:true,
        sz:engine.pt2hp(16),
        font:s.fonts.heading,
        color:s.colors.heading,
        pStyle:"Heading1",
        noNum:true,
        after:160
      }
    )
  );


  fieldRows([
    ["Kohde",project.nimi],
    ["Tilaaja",project.tilaaja||"-"],
    ["Tutkija",project.tutkija],
    ["Päivämäärä",project.pvm]
  ]);


  /*
   * Vientiä varten merkinnät ryhmitellään menetelmätyypin mukaan
   * (esim. kaikki rakenneavaukset peräkkäin) sen sijaan, että ne
   * tulostetaan siinä sekalaisessa järjestyksessä, jossa ne on
   * kirjattu. Ryhmien järjestys noudattaa METHODS-listan järjestystä
   * (sama kuin "Muokkaa menetelmiä" -näkymässä), ja saman ryhmän
   * sisällä alkuperäinen kirjaamisjärjestys säilyy.
   *
   * Otsikon numero ("Menetelmä N") pysyy kunkin merkinnän
   * ALKUPERÄISENÄ paikkana entries-taulukossa (originalIndex+1), ei
   * uutena järjestysnumerona. Tämä on tärkeää, koska sama numero on
   * poltettu pohjakuvan PDF-merkintöihin (ks. kohta jossa
   * "Menetelmä ${idx+1}" muodostetaan annotaatioihin) — jos
   * numeroitaisiin uudelleen ryhmittelyn mukaan, Word-raportin
   * numerot eivät enää täsmäisi pohjakuvan merkintöihin.
   */
  const exportOrder=
    entries
      .map((e,originalIndex)=>({e,originalIndex}))
      .sort((a,b)=>{

        const ai=
          METHODS.findIndex(
            x=>x.id===a.e.methodId
          );

        const bi=
          METHODS.findIndex(
            x=>x.id===b.e.methodId
          );

        const aOrder=
          ai===-1?METHODS.length:ai;

        const bOrder=
          bi===-1?METHODS.length:bi;

        if(aOrder!==bOrder)return aOrder-bOrder;

        return a.originalIndex-b.originalIndex;
      });

  /*
   * Suomenkieliset monikkomuodot vakiomenetelmien ryhmäotsikoihin
   * (esim. "avaus" -> "Rakenneavaukset"). Itse tehdyille/muokatuille
   * menetelmille ei voida luotettavasti johtaa monikkomuotoa
   * automaattisesti, joten niiden ryhmäotsikkona käytetään
   * menetelmän omaa (yksikkömuotoista) nimeä sellaisenaan.
   */
  const METHOD_GROUP_HEADING={
    aisti:"Aistinvaraiset tarkastelut",
    pintakosteus:"Pintakosteuden mittaukset",
    rh:"Rakenteen suht. kosteuden mittaukset (RH)",
    merkkiaine:"Merkkiainekokeet",
    nayte:"Näytteet",
    lampokuvaus:"Lämpökuvaukset",
    avaus:"Rakenneavaukset",
    iv:"IV- ja painesuhdemittaukset",
    muu:"Muut menetelmät"
  };

  let lastGroupMethodId=null;

  for(
    const {e,originalIndex:i} of exportOrder
  ){

    const m=
      METHODS.find(
        x=>x.id===e.methodId
      );


    if(!m)continue;


    if(m.id!==lastGroupMethodId){

      bodyParts.push(
        engine.paraXml(
          METHOD_GROUP_HEADING[m.id]||m.name,
          {
            bold:true,
            sz:engine.pt2hp(
              s.fonts.headingSize
            ),
            font:s.fonts.heading,
            color:s.colors.heading,
            pStyle:"Heading1",
            before:320,
            after:120
          }
        )
      );

      lastGroupMethodId=m.id;
    }


    /*
     * Merkinnät nimetään Word-raportissa menetelmän nimellä ja perässä
     * käyttäjän syöttämällä Tunnus/Tila-tiedolla (COMMON_FIELDS-kentä
     * "paikka", esim. "RA1 / Makuuhuone") — ei enää yleisellä
     * "Menetelmä N" -otsikolla. Jos Tunnus/Tila on tyhjä, käytetään
     * pelkkää menetelmän nimeä.
     */
    const tunnusTila=
      e.values &&
      e.values.paikka != null
        ? String(e.values.paikka).trim()
        : "";

    const entryHeading=
      tunnusTila
        ? `${m.name} ${tunnusTila}`
        : m.name;

    bodyParts.push(
      engine.paraXml(
        entryHeading,
        {
          bold:true,
          sz:engine.pt2hp(
            s.fonts.subheadingSize
          ),
          font:s.fonts.heading,
          color:s.colors.heading,
          pStyle:"Heading2",
          before:200,
          after:80
        }
      )
    );


    const rows=[];
    const tableFieldsToRender=[];

    /* Ehdolla tai siirtymällä piilotettujen kenttien tietoja ei viedä raporttiin. */
    const exportVis=
      computeFieldVisibility(
        m.fields,
        e.values
      );


    [
      ...COMMON_FIELDS,
      ...m.fields
    ].forEach(f=>{

      if(exportVis[f.id]===false)return;

      if(f.type==="table"){

        const tRows=
          Array.isArray(e.values[f.id])
            ?e.values[f.id]
            :[];

        const cols=
          Array.isArray(f.columns)
            ?f.columns.filter(c=>c.label&&c.label.trim())
            :[];

        const dataRows=
          tRows.filter(r=>
            cols.some(c=>
              r[c.id]!==undefined &&
              r[c.id]!==null &&
              String(r[c.id]).trim()!==""
            )
          );

        if(cols.length&&dataRows.length){
          tableFieldsToRender.push({f,cols,dataRows});
        }

        return;
      }

      const v=
        e.values[f.id];

      if(
        v!==undefined &&
        v!==null &&
        String(v).trim()!==""
      ){

        rows.push([
          f.label,
          v
        ]);
      }
    });


    if(e.values.huomiot){

      rows.push([
        "Lisähuomiot",
        e.values.huomiot
      ]);
    }


    if(e.marker){

      const pgTxt=
        e.marker.page &&
        e.marker.page>1
          ?` sivu ${e.marker.page},`
          :"";


      const idTxt=
        e.marker.label &&
        e.marker.label.trim()
          ?`tunniste ${e.marker.label.trim()}`
          :`merkintä nro ${i+1}`;


      rows.push([
        "Sijainti pohjakuvalla",
        `Merkitty pohjakuvaan (katso liite,${pgTxt} ${idTxt})`
      ]);
    }


    if(rows.length){

      fieldRows(rows);
    }


    tableFieldsToRender.forEach(({f,cols,dataRows})=>{

      bodyParts.push(
        engine.paraXml(
          f.label,
          {
            font:s.fonts.body,
            sz:engine.pt2hp(s.fonts.bodySize),
            color:"666666",
            after:60
          }
        )
      );

      const docRows=[
        cols.map(c=>c.label),
        ...dataRows.map(r=>
          cols.map(c=>
            r[c.id]!==undefined && r[c.id]!==null
              ?String(r[c.id])
              :""
          )
        )
      ];

      /*
       * Jaetaan sarakeleveydet otsikoiden perusteella. Tasalevyinen jako
       * tekee helposti kapeista sarakkeista niin pieniä, että Word alkaa
       * katkaista otsikot kirjain kerrallaan (esim. "Materiaali").
       * Vähimmäisleveys pitää sarakkeet luettavina ja pisimmät otsikot
       * saavat hieman enemmän tilaa.
       */
      const colWidthPercents = (() => {
        const minPct = 12;
        const maxPct = 28;
        const raw = cols.map(c => {
          const len = String(c.label || "").trim().length;
          return Math.max(1, Math.min(1.8, len / 8));
        });
        const minTotal = minPct * raw.length;

        if(minTotal >= 100){
          return raw.map(() => Math.floor(100 / raw.length));
        }

        const remaining = 100 - minTotal;
        const rawSum = raw.reduce((a,b) => a+b, 0);
        const values = raw.map(r => minPct + remaining * (r / rawSum));
        const capped = values.map(v => Math.min(maxPct, v));
        const sum = capped.reduce((a,b) => a+b, 0);
        const normalized = capped.map(v => v * 100 / sum);

        // Pyöristyskorjaus tehdään tableXml:ssa viimeiseen sarakkeeseen.
        return normalized;
      })();

      bodyParts.push(
        engine.tableXml(
          docRows,
          {
            headerRowCount:1,
            colWidthPercents,
            font:s.fonts.body,
            sz:engine.pt2hp(s.fonts.bodySize),
            color:s.colors.body
          }
        )
      );

      bodyParts.push(
        engine.paraXml("",{after:120})
      );
    });


    if(
      e.photos &&
      e.photos.length
    ){

      bodyParts.push(
        engine.paraXml(
          `Valokuvat (${e.photos.length})`,
          {
            color:"666666",
            font:s.fonts.body,
            sz:18,
            after:80
          }
        )
      );


      for(const p of e.photos){

        let imageData;


        /*
         * Word-vienti käyttää olemassa olevaa Blobia
         * aina kun mahdollista.
         */
        if(p.blob instanceof Blob){

          imageData=
            await blobToDataUrl(
              p.blob
            );

        }else if(p.url){

          imageData=p.url;

        }else{

          continue;
        }


        const n=
          await normalizeImageOrientation(
            imageData,
            2500,
            .85
          );


        const blob=
          dataUrlToBlob(
            n.dataUrl
          );


        const maxCx=4200000;
        const maxCy=2700000; // 7,5 cm — pystysuuntaisen kuvan enimmäiskorkeus

        const {
          cx,
          cy
        }=
          engine.scaledDims(
            n.width,
            n.height,
            maxCx,
            maxCy
          );


        const rId=
          imgRelCounter++;


        const mediaName=
          "image"+
          (extraMedia.length+1)+
          ".jpeg";


        extraMedia.push({
          rId,
          name:mediaName,
          blob
        });


        bodyParts.push(
          engine.imageXml(
            rId,
            cx,
            cy,
            imgDocPrCounter++,
            "left"
          )
        );


        {

          const captionText=
            `Kuva ${photoNumber}.`+
            (
              p.caption &&
              p.caption.trim()
                ? " "+p.caption.trim()
                : ""
            );

          photoNumber++;

          bodyParts.push(
            engine.paraXml(
              captionText,
              {
                italic:true,
                align:"left",
                font:s.fonts.body,
                sz:engine.pt2hp(
                  Math.max(
                    9,
                    s.fonts.bodySize-1
                  )
                ),
                color:"000000",
                after:160
              }
            )
          );
        }


        bodyParts.push(
          engine.paraXml(
            "",
            {after:100}
          )
        );
      }
    }
  }


  try{

    const blob=
      await engine.assembleDocx({
        meta:{
          title:FORM_LABEL
        },
        bodyParts,
        style:s,
        extraMedia
      });


    const url=
      URL.createObjectURL(
        blob
      );


    const safe=
      (project.nimi||"kohde")
        .replace(
          /[^a-z0-9äöå]+/gi,
          "_"
        );


    const a=
      document.createElement("a");

    a.href=url;

    a.download=
      `Kenttamuistiinpano_${safe}_${project.pvm}.docx`;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      4000
    );


    toast(
      "Word-tiedosto (.docx) ladattu"
    );

  }catch(err){

    console.error(
      err
    );

    toast(
      "Word-tiedoston muodostus epäonnistui"
    );
  }
}

async function saveFloorPlan(blob){

  if(!blob){
    return;
  }


  if(
    !(blob instanceof Blob) ||
    blob.type!=="application/pdf"
  ){

    toast(
      "Valitse PDF-tiedosto."
    );

    return;
  }


  /*
   * Uusi pohjakuva tarkoittaa uutta koordinaatistoa.
   * Vanhat merkinnät eivät saa jäädä voimaan.
   */
  const hadMarkers=
    entries.some(
      e=>!!e.marker
    );


  if(
    hadMarkers &&
    floorPlanBlob &&
    !confirm(
      "Pohjakuva vaihdetaan.\n\n"+
      "Nykyiseen pohjakuvaan tehdyt sijaintimerkinnät "+
      "poistetaan, koska niiden koordinaatit eivät välttämättä "+
      "vastaa uutta pohjakuvaa.\n\n"+
      "Jatketaanko?"
    )
  ){

    /*
     * KORJAUS: aiemmin peruutus ei antanut mitään palautetta
     * käyttäjälle, jolloin jäi epäselväksi tapahtuiko mitään.
     */
    toast(
      "Pohjakuvan vaihto peruutettu"
    );

    return;
  }


  /*
   * KORJAUS: vanhaa pilvitiedostoa ei poisteta enää tässä
   * vaiheessa. Sen sijaan se merkitään "odottavaksi poistoksi"
   * ja poistetaan vasta kun uusi pohjakuva on varmasti
   * tallentunut pilveen (ks. syncToCloud()). Näin verkkokatko
   * ei voi hävittää pohjakuvaa kokonaan.
   */
  if(floorPlanPath){

    pendingOldFloorPlanPath=
      floorPlanPath;
  }


  floorPlanBlob=blob;
  floorPlanPath=null;
  floorPlanPreviewPage=1;


  _pdfDocCache=null;
  _pdfDocCacheBlob=null;


  if(hadMarkers){

    entries.forEach(
      e=>{
        delete e.marker;
      }
    );
  }


  /*
   * Tallennetaan submission-kohtaiseen IndexedDB-avaimeen.
   */
  try{

    await idbSet(
      floorPlanKey(),
      blob
    );

  }catch(err){

    console.warn(
      "Pohjakuvan IndexedDB-tallennus epäonnistui",
      err
    );

    toast(
      "Pohjakuvan paikallinen tallennus epäonnistui"
    );
  }


  autosave();
}

      );

      );
    }
  }


  floorPlanPath=null;
  floorPlanPreviewPage=1;
  pendingOldFloorPlanPath=null;

  /*

   * siihen liittyvät sijaintimerkinnät.

      err
    );
  }


  autosave();
}


let _pdfDocCache=null;
let _pdfDocCacheBlob=null;


async function getPdfDocument(blob){

  if(
    _pdfDocCache &&
    _pdfDocCacheBlob===blob
  ){

    return _pdfDocCache;
  }


  if(!window.pdfjsLib){

    throw new Error(
      "PDF.js ei ole ladattu"
    );
  }


  const buf=
    await blob.arrayBuffer();


  _pdfDocCache=
    await pdfjsLib.getDocument({
      data:buf
    }).promise;


  _pdfDocCacheBlob=
    blob;


  return _pdfDocCache;
}

async function renderPdfPageToCanvas(
  blob,
  canvas,
  maxWidth,
  maxHeight,
  pageNum
){

  const pdf=
    await getPdfDocument(
      blob
    );


  const numPages=
    pdf.numPages;


  pageNum=
    Math.min(
      Math.max(
        1,
        pageNum||1
      ),
      numPages
    );


  const page=
    await pdf.getPage(
      pageNum
    );


  const baseViewport=
    page.getViewport({
      scale:1
    });


  const dpr=
    window.devicePixelRatio||1;


  const scale=
    Math.min(
      maxWidth/baseViewport.width,
      maxHeight/baseViewport.height,
      8
    );


  const viewport=
    page.getViewport({
      scale:scale*dpr
    });


  canvas.width=
    Math.round(
      viewport.width
    );


  canvas.height=
    Math.round(
      viewport.height
    );


  canvas.style.width=
    (viewport.width/dpr)+"px";


  canvas.style.height=
    (viewport.height/dpr)+"px";


  const ctx=
    canvas.getContext(
      "2d",
      {alpha:false}
    );


  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;


  return {
    width:viewport.width/dpr,
    height:viewport.height/dpr,
    numPages,
    pageNum
  };
}


async function renderPdfPageAtCssWidth(
  blob,
  canvas,
  cssWidth,
  pageNum
){

  const pdf=
    await getPdfDocument(
      blob
    );


  const numPages=
    pdf.numPages;


  pageNum=
    Math.min(
      Math.max(
        1,
        pageNum||1
      ),
      numPages
    );


  const page=
    await pdf.getPage(
      pageNum
    );


  const baseViewport=
    page.getViewport({
      scale:1
    });


  const dpr=
    window.devicePixelRatio||1;


  const scale=
    (
      cssWidth/
      baseViewport.width
    )*dpr;


  const viewport=
    page.getViewport({
      scale
    });


  canvas.width=
    Math.round(
      viewport.width
    );


  canvas.height=
    Math.round(
      viewport.height
    );


  const cssHeight=
    cssWidth*
    (
      baseViewport.height/
      baseViewport.width
    );


  canvas.style.width=
    cssWidth+"px";


  canvas.style.height=
    cssHeight+"px";


  const ctx=
    canvas.getContext(
      "2d",
      {alpha:false}
    );


  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;


  return {
    width:cssWidth,
    height:cssHeight,
    numPages,
    pageNum
  };
}

      baseCssWidth=

          :"none";


      pageLabelSpan.textContent=

      layoutStage();

      placeDot();

    }catch(err){

      console.error(
        err
      );

      toast(
        "Pohjakuvan renderöinti epäonnistui"
      );

      overlay.remove();
    }
  }


  /*
   * Palauttaa scrollauksen (px), jolla kuvan kohta `frac` (0..1) jää
   * näkymän kohtaan `focus` (px näkymän reunasta), kun kuvan uusi koko
   * on `newSize` ja näkymän koko `viewSize`. Jos kuva mahtuu näkymään,
   * ei scrollata (kuva on keskitetty).
   */
  function focalScroll(frac,focus,newSize,viewSize){

    const max=
      Math.max(
        0,
        newSize-viewSize
      );

    if(max===0)return 0;

    return Math.min(
      max,
      Math.max(
        0,
        frac*newSize-focus
      )
    );
  }


  /*
   * KORJAUS: zoomaus ei enää keskitä kuvaa aina keskelle. Zoomattaessa
   * se kuvan kohta, joka on `focus`-pisteessä (nipistyksen keskipiste
   * tai painikkeilla näkymän keskipiste), pysyy samassa kohdassa ruudulla.
   * `focus` on {x,y} selainikkunan koordinaateissa (clientX/clientY).
   */
  async function renderAtZoom(z,focus){

    zoomLevel=
      Math.min(
        MAX_ZOOM,
        Math.max(
          1,
          z
        )
      );


    canvasWrap.style.transform="";

    canvasWrap.style.transformOrigin=
      "center center";


    const stageRect=
      stage.getBoundingClientRect();

    const canvasRect=
      canvas.getBoundingClientRect();


    const fx=
      focus
        ?focus.x-stageRect.left
        :stage.clientWidth/2;

    const fy=
      focus
        ?focus.y-stageRect.top
        :stage.clientHeight/2;


    const fracX=
      canvasRect.width>0
        ?Math.min(
          1,
          Math.max(
            0,
            (stageRect.left+fx-canvasRect.left)/
            canvasRect.width
          )
        )
        :.5;

    const fracY=
      canvasRect.height>0
        ?Math.min(
          1,
          Math.max(
            0,
            (stageRect.top+fy-canvasRect.top)/
            canvasRect.height
          )
        )
        :.5;


    const cssW=
      baseCssWidth*
      zoomLevel;


    await renderPdfPageAtCssWidth(
      floorPlanBlob,
      canvas,
      cssW,
      currentPage
    );


    zoomLabel.textContent=
      Math.round(
        zoomLevel*100
      )+"%";


    layoutStage();

    placeDot();


    stage.scrollLeft=
      focalScroll(
        fracX,
        fx,
        canvas.clientWidth,
        stage.clientWidth
      );

    stage.scrollTop=
      focalScroll(
        fracY,
        fy,
        canvas.clientHeight,
        stage.clientHeight
      );
  }


  await doRenderFit();


  prevPageBtn.onclick=()=>{

    if(currentPage>1){

      currentPage--;

      doRenderFit();
    }
  };


  nextPageBtn.onclick=()=>{

    if(currentPage<numPages){

      currentPage++;

      doRenderFit();
    }
  };


  zoomOutBtn.onclick=
    ()=>{
      renderAtZoom(
        zoomLevel-.75
      );
    };


  zoomInBtn.onclick=
    ()=>{
      renderAtZoom(
        zoomLevel+.75
      );
    };


  zoomFitBtn.onclick=
    ()=>{
      doRenderFit();
    };


  /*
   * Pinch zoom (nipistys) ja kuvan siirtäminen (pan).
   *
   * KORJAUS: stagella on touch-action:none, joten selain ei scrollaa
   * kosketuksella itse -- siirtäminen on toteutettava tässä. Yhden sormen
   * (tai hiiren) veto siirtää kuvaa; lyhyt napautus asettaa edelleen
   * merkinnän. Nipistys zoomaa sormien keskipisteen ympärille.
   */
  let isPinching=false;
  let pinchStartDist=0;
  let pinchStartZoom=1;
  let pinchFocus=null;

  let drag=null;
  let lastDragEnd=0;

  const DRAG_THRESHOLD=8;


  function touchDist(t0,t1){

    return Math.hypot(
      t1.clientX-t0.clientX,
      t1.clientY-t0.clientY
    );
  }


  function touchMid(t0,t1){

    return {
      x:(t0.clientX+t1.clientX)/2,
      y:(t0.clientY+t1.clientY)/2
    };
  }


  stage.addEventListener(
    "touchstart",
    ev=>{

      if(ev.touches.length===2){

        isPinching=true;

        drag=null;

        pinchStartDist=
          touchDist(
            ev.touches[0],
            ev.touches[1]
          );

        pinchStartZoom=
          zoomLevel;

        pinchFocus=
          touchMid(
            ev.touches[0],
            ev.touches[1]
          );

        const wr=
          canvasWrap.getBoundingClientRect();

        canvasWrap.style.transformOrigin=
          (pinchFocus.x-wr.left)+"px "+
          (pinchFocus.y-wr.top)+"px";
      }

    },
    {passive:true}
  );


  stage.addEventListener(
    "touchmove",
    ev=>{

      if(
        isPinching &&
        ev.touches.length===2
      ){

        ev.preventDefault();


        const d=
          touchDist(
            ev.touches[0],
            ev.touches[1]
          );


        const live=
          Math.min(
            MAX_ZOOM,
            Math.max(
              1,
              pinchStartZoom*
              (
                d/
                pinchStartDist
              )
            )
          );


        canvasWrap.style.transform=
          `scale(${live/zoomLevel})`;
      }

    },
    {passive:false}
  );


  function finishPinch(){

    if(!isPinching)return;

    isPinching=false;


    const m=
      /scale\(([\d.]+)\)/
        .exec(
          canvasWrap.style.transform||""
        );


    const factor=
      m
        ?parseFloat(m[1])
        :1;


    if(Math.abs(factor-1)<.02){

      canvasWrap.style.transform="";

      canvasWrap.style.transformOrigin=
        "center center";

      return;
    }


    renderAtZoom(
      zoomLevel*
      factor,
      pinchFocus
    );
  }


  stage.addEventListener(
    "touchend",
    ev=>{

      if(ev.touches.length<2){
        finishPinch();
      }

    }
  );


  stage.addEventListener(
    "touchcancel",
    ()=>{
      finishPinch();
    }
  );


  stage.addEventListener(
    "pointerdown",
    ev=>{

      if(isPinching)return;

      if(!ev.isPrimary)return;

      if(
        ev.pointerType==="mouse" &&
        ev.button!==0
      )return;


      drag={
        id:ev.pointerId,
        x:ev.clientX,
        y:ev.clientY,
        left:stage.scrollLeft,
        top:stage.scrollTop,
        moved:false
      };
    }
  );


  stage.addEventListener(
    "pointermove",
    ev=>{

      if(
        !drag ||
        ev.pointerId!==drag.id ||
        isPinching
      )return;


      const dx=
        ev.clientX-drag.x;

      const dy=
        ev.clientY-drag.y;


      if(!drag.moved){

        if(
          Math.hypot(dx,dy)<
          DRAG_THRESHOLD
        )return;

        drag.moved=true;

        try{
          stage.setPointerCapture(
            ev.pointerId
          );
        }catch(e){}

        stage.style.cursor="grabbing";
      }


      stage.scrollLeft=
        drag.left-dx;

      stage.scrollTop=
        drag.top-dy;
    }
  );


  function endDrag(ev){

    if(
      !drag ||
      ev.pointerId!==drag.id
    )return;


    if(drag.moved){

      lastDragEnd=
        performance.now();

      stage.style.cursor="";
    }

    drag=null;
  }


  stage.addEventListener(
    "pointerup",
    endDrag
  );

  stage.addEventListener(
    "pointercancel",
    endDrag
  );


  canvas.addEventListener(
    "click",
    ev=>{

      /* Vedon lopussa selain voi lähettää click-tapahtuman -- se ei saa asettaa merkintää. */
      if(
        performance.now()-
        lastDragEnd<400
      )return;


      const rect=
        canvas.getBoundingClientRect();


      const x=
        (
          ev.clientX-
          rect.left
        )/
        rect.width;


      const y=
        (
          ev.clientY-
          rect.top
        )/
        rect.height;


      pending={

        x:Math.min(
          1,
          Math.max(
            0,
            x
          )
        ),

        y:Math.min(
          1,
          Math.max(
            0,
            y
          )
        ),

        page:currentPage
      };


      placeDot();
    }
  );


  cancelBtn.onclick=
    ()=>{
      overlay.remove();
    };


  clearBtn.onclick=
    ()=>{

      delete entry.marker;

      autosave();

      overlay.remove();

      render();

      toast(
        "Merkintä poistettu"
      );
    };


  saveBtn.onclick=
    ()=>{

      if(!pending){

        toast(
          "Napauta ensin sijainti kuvasta"
        );

        return;
      }


      entry.marker={

        x:pending.x,

        y:pending.y,

        page:pending.page,

        color:pendingColor,

        label:
          labelInput.value.trim()
      };


      autosave();

      overlay.remove();

      render();

      toast(
        "Sijainti tallennettu"
      );
    };
}

/*
 * KORJAUS/UUSI OMINAISUUS: pohjakuvan merkinnät viedään nyt oikeina
 * PDF-annotaatioina (Circle/FreeText/Line + Popup) eikä sivun sisältöön
 * "poltettuna" grafiikkana. Tämä mahdollistaa merkintöjen jälkikäteisen
 * siirtämisen, muokkaamisen ja poistamisen esim. Adobe Acrobatissa.
 */

function pdfDateString(){

  const d=new Date();

  const p=n=>String(n).padStart(2,"0");

  return (
    "D:"+
    d.getFullYear()+
    p(d.getMonth()+1)+
    p(d.getDate())+
    p(d.getHours())+
    p(d.getMinutes())+
    p(d.getSeconds())
  );
}


function pdfAddAnnotToPage(context,page,ref){

  const PDFName=PDFLib.PDFName;
  const PDFArray=PDFLib.PDFArray;

  let annots=
    page.node.lookupMaybe(
      PDFName.of("Annots"),
      PDFArray
    );

  if(!annots){

    annots=context.obj([]);

    page.node.set(
      PDFName.of("Annots"),
      annots
    );
  }

  annots.push(ref);
}


/*
 * Piirtää täytetyn + ääriviivallisen ympyrän polkuna (Bezier-approksimaatio)
 * annotaation appearance streamiin (AP/N). Koordinaatit ovat lomakkeen
 * omassa, paikallisessa (0,0)-(size,size) -koordinaatistossa.
 */
function pdfCircleAppearanceOps(size,radius,fillCol,borderW){

  const cx=size/2;
  const cy=size/2;
  const k=0.5523;

  return [
    "q",
    `${fillCol.r.toFixed(3)} ${fillCol.g.toFixed(3)} ${fillCol.b.toFixed(3)} rg`,
    "1 1 1 RG",
    `${borderW} w`,
    `${(cx+radius).toFixed(2)} ${cy.toFixed(2)} m`,
    `${(cx+radius).toFixed(2)} ${(cy+radius*k).toFixed(2)} ${(cx+radius*k).toFixed(2)} ${(cy+radius).toFixed(2)} ${cx.toFixed(2)} ${(cy+radius).toFixed(2)} c`,
    `${(cx-radius*k).toFixed(2)} ${(cy+radius).toFixed(2)} ${(cx-radius).toFixed(2)} ${(cy+radius*k).toFixed(2)} ${(cx-radius).toFixed(2)} ${cy.toFixed(2)} c`,
    `${(cx-radius).toFixed(2)} ${(cy-radius*k).toFixed(2)} ${(cx-radius*k).toFixed(2)} ${(cy-radius).toFixed(2)} ${cx.toFixed(2)} ${(cy-radius).toFixed(2)} c`,
    `${(cx+radius*k).toFixed(2)} ${(cy-radius).toFixed(2)} ${(cx+radius).toFixed(2)} ${(cy-radius*k).toFixed(2)} ${(cx+radius).toFixed(2)} ${cy.toFixed(2)} c`,
    "b",
    "Q"
  ].join("\n");
}


/*
 * Lisää sijaintimerkinnän ympyrän Circle-annotaationa (aidosti muokattava
 * Acrobatissa) + siihen liitetyn Popup-annotaation, jonka Contents-kenttä
 * kertoo mihin menetelmään merkintä liittyy.
 */
function pdfAddCircleMarker(pdfDoc,page,opts){

  const context=pdfDoc.context;
  const PDFName=PDFLib.PDFName;
  const PDFString=PDFLib.PDFString;

  const borderW=1.6;
  const pad=borderW+2;
  const size=2*(opts.radius+pad);

  const ops=
    pdfCircleAppearanceOps(
      size,
      opts.radius,
      opts.color,
      borderW
    );

  const apRef=
    context.register(
      context.stream(ops,{
        Type:"XObject",
        Subtype:"Form",
        FormType:1,
        BBox:[0,0,size,size],
        Matrix:[1,0,0,1,0,0],
        Resources:{}
      })
    );

  const rect=[
    opts.x-size/2,
    opts.y-size/2,
    opts.x+size/2,
    opts.y+size/2
  ];

  const annotDict=
    context.obj({
      Type:"Annot",
      Subtype:"Circle",
      Rect:rect,
      C:[1,1,1],
      IC:[opts.color.r,opts.color.g,opts.color.b],
      CA:1,
      BS:{W:borderW},
      F:4,
      Contents:PDFString.of(opts.contents||""),
      T:PDFString.of("Kenttälomake"),
      M:PDFString.of(pdfDateString()),
      NM:PDFString.of(opts.nameId),
      AP:{N:apRef}
    });

  const ref=
    context.register(annotDict);

  pdfAddAnnotToPage(context,page,ref);


  /*
   * Popup-annotaatio helpottaa merkinnän tietojen lukemista
   * Acrobatin kommenttipaneelista.
   */
  const popupDict=
    context.obj({
      Type:"Annot",
      Subtype:"Popup",
      Rect:[
        rect[2]+10,
        rect[1],
        rect[2]+220,
        rect[1]+90
      ],
      Parent:ref,
      Open:false
    });

  const popupRef=
    context.register(popupDict);

  pdfAddAnnotToPage(context,page,popupRef);

  annotDict.set(
    PDFName.of("Popup"),
    popupRef
  );

  return {rect,size};
}


/*
 * Lisää vapaasti muokattavan tekstilaatikon (FreeText-annotaatio),
 * jossa on valkoinen tausta, värillinen reunus ja tunnisteteksti.
 * Käytetään kun käyttäjä on antanut merkinnälle oman tunnisteen.
 */
function pdfAddLabelBox(pdfDoc,page,font,opts){

  const context=pdfDoc.context;
  const PDFString=PDFLib.PDFString;

  const fs=9;
  const boxPad=4;

  const encoded=
    font.encodeText(opts.text);

  const tw=
    font.widthOfTextAtSize(
      opts.text,
      fs
    );

  const boxW=tw+boxPad*2;
  const boxH=fs+boxPad*2;

  const ops=[
    "q",
    "1 1 1 rg",
    `0 0 ${boxW.toFixed(2)} ${boxH.toFixed(2)} re`,
    "f",
    `${opts.color.r.toFixed(3)} ${opts.color.g.toFixed(3)} ${opts.color.b.toFixed(3)} RG`,
    "1.2 w",
    `0.6 0.6 ${(boxW-1.2).toFixed(2)} ${(boxH-1.2).toFixed(2)} re`,
    "S",
    "BT",
    `/F1 ${fs} Tf`,
    "0.12 0.12 0.12 rg",
    `${boxPad.toFixed(2)} ${(boxPad-1).toFixed(2)} Td`,
    `${encoded.toString()} Tj`,
    "ET",
    "Q"
  ].join("\n");

  const apRef=
    context.register(
      context.stream(ops,{
        Type:"XObject",
        Subtype:"Form",
        FormType:1,
        BBox:[0,0,boxW,boxH],
        Matrix:[1,0,0,1,0,0],
        Resources:{Font:{F1:font.ref}}
      })
    );

  const rect=[
    opts.x,
    opts.y,
    opts.x+boxW,
    opts.y+boxH
  ];

  const annotDict=
    context.obj({
      Type:"Annot",
      Subtype:"FreeText",
      Rect:rect,
      Contents:PDFString.of(opts.text),
      DA:PDFString.of(
        "0.12 0.12 0.12 rg /Helv "+fs+" Tf"
      ),
      C:[opts.color.r,opts.color.g,opts.color.b],
      CA:1,
      F:4,
      NM:PDFString.of(opts.nameId),
      AP:{N:apRef}
    });

  pdfAddAnnotToPage(
    context,
    page,
    context.register(annotDict)
  );

  return {boxW,boxH};
}


/*
 * Numeroitu merkintä (kun tunnistetta ei ole annettu): valkoinen
 * lihavoitu numero ympyrän päällä, ilman taustaa/reunusta. Myös tämä
 * on FreeText-annotaatio, joten se pysyy erikseen muokattavana.
 */
function pdfAddNumberOverlay(pdfDoc,page,font,opts){

  const context=pdfDoc.context;
  const PDFString=PDFLib.PDFString;

  const fs=11;

  const encoded=
    font.encodeText(opts.text);

  const tw=
    font.widthOfTextAtSize(
      opts.text,
      fs
    );

  const boxW=tw+2;
  const boxH=fs+2;

  const ops=
    `BT\n/F1 ${fs} Tf\n1 1 1 rg\n1 1 Td\n${encoded.toString()} Tj\nET`;

  const apRef=
    context.register(
      context.stream(ops,{
        Type:"XObject",
        Subtype:"Form",
        FormType:1,
        BBox:[0,0,boxW,boxH],
        Matrix:[1,0,0,1,0,0],
        Resources:{Font:{F1:font.ref}}
      })
    );

  const rect=[
    opts.x-boxW/2,
    opts.y-boxH/2,
    opts.x+boxW/2,
    opts.y+boxH/2
  ];

  const annotDict=
    context.obj({
      Type:"Annot",
      Subtype:"FreeText",
      Rect:rect,
      Contents:PDFString.of(opts.text),
      DA:PDFString.of(
        "1 1 1 rg /Helv "+fs+" Tf"
      ),
      CA:1,
      F:4,
      NM:PDFString.of(opts.nameId),
      AP:{N:apRef}
    });

  pdfAddAnnotToPage(
    context,
    page,
    context.register(annotDict)
  );
}


/*
 * Yhdysviiva ympyrän reunasta tunnistelaatikkoon, myös omana
 * Line-annotaationaan (muokattava/siirrettävä erikseen).
 */
function pdfAddConnectorLine(pdfDoc,page,opts){

  const context=pdfDoc.context;
  const PDFString=PDFLib.PDFString;

  const lpad=2;

  const minX=Math.min(opts.x1,opts.x2)-lpad;
  const maxX=Math.max(opts.x1,opts.x2)+lpad;
  const minY=Math.min(opts.y1,opts.y2)-lpad;
  const maxY=Math.max(opts.y1,opts.y2)+lpad;

  const ops=[
    "q",
    `${opts.color.r.toFixed(3)} ${opts.color.g.toFixed(3)} ${opts.color.b.toFixed(3)} RG`,
    "1.2 w",
    `${(opts.x1-minX).toFixed(2)} ${(opts.y1-minY).toFixed(2)} m`,
    `${(opts.x2-minX).toFixed(2)} ${(opts.y2-minY).toFixed(2)} l`,
    "S",
    "Q"
  ].join("\n");

  const apRef=
    context.register(
      context.stream(ops,{
        Type:"XObject",
        Subtype:"Form",
        FormType:1,
        BBox:[0,0,maxX-minX,maxY-minY],
        Matrix:[1,0,0,1,0,0],
        Resources:{}
      })
    );

  const annotDict=
    context.obj({
      Type:"Annot",
      Subtype:"Line",
      Rect:[minX,minY,maxX,maxY],
      L:[opts.x1,opts.y1,opts.x2,opts.y2],
      C:[opts.color.r,opts.color.g,opts.color.b],
      F:4,
      NM:PDFString.of(opts.nameId),
      AP:{N:apRef}
    });

  pdfAddAnnotToPage(
    context,
    page,
    context.register(annotDict)
  );
}


function hexToRgb01(hex){

  hex=
    (hex||"#e85908")
      .replace("#","");


  if(hex.length===3){

    hex=
      hex
        .split("")
        .map(ch=>ch+ch)
        .join("");
  }


  const num=
    parseInt(
      hex,
      16
    );


  const n=
    isNaN(num)
      ?0xe85908
      :num;


  return {

    r:
      ((n>>16)&255)/255,

    g:
      ((n>>8)&255)/255,

    b:
      (n&255)/255
  };
}


async function exportFloorPlanPdf(){

  if(
    !floorPlanBlob ||
    !window.PDFLib
  ){

    toast(
      "Pohjakuvaa tai PDF-kirjastoa ei saatu ladattua"
    );

    return;
  }


  toast(
    "Muodostetaan pohjakuvaa merkinnöin..."
  );


  try{

    const {
      PDFDocument,
      StandardFonts
    }=
      PDFLib;


    const bytes=
      new Uint8Array(
        await floorPlanBlob.arrayBuffer()
      );


    const pdfDoc=
      await PDFDocument.load(
        bytes
      );


    const pages=
      pdfDoc.getPages();


    const font=
      await pdfDoc.embedFont(
        StandardFonts.HelveticaBold
      );


    /*
     * KORJAUS/UUSI OMINAISUUS: merkinnät lisätään nyt oikeina
     * PDF-annotaatioina (Circle/FreeText/Line + Popup), jotka Adobe
     * Acrobat (ja muut annotaatioita tukevat PDF-työkalut) tunnistaa
     * erillisiksi, siirrettäviksi, muokattaviksi ja poistettaviksi
     * kommenttiobjekteiksi — ei enää sivun sisältöön poltettua grafiikkaa.
     */
    pages.forEach(
      (page,pIdx)=>{

        const {
          width,
          height
        }=
          page.getSize();


        entries.forEach(
          (e,idx)=>{

            if(!e.marker)return;


            const markerPageIdx=
              (
                e.marker.page||1
              )-1;


            if(
              markerPageIdx!==pIdx
            ){

              return;
            }


            const x=
              e.marker.x*
              width;


            const y=
              height-
              (
                e.marker.y*
                height
              );


            const r=10;


            const col=
              hexToRgb01(
                e.marker.color
              );


            const m=
              METHODS.find(
                mm=>mm.id===e.methodId
              );


            const methodName=
              m ? m.name : "Menetelmä";


            const placeTxt=
              (
                e.values &&
                e.values.paikka
              ) || "";


            const customLabel=
              (
                e.marker.label||
                ""
              ).trim();


            const contentsInfo=
              `Menetelmä ${idx+1}: ${methodName}`+
              (placeTxt?` - ${placeTxt}`:"")+
              (customLabel?` (tunniste ${customLabel})`:"");


            const idBase=
              (e.id||("entry"+idx))+
              "-p"+pIdx;


            const circleInfo=
              pdfAddCircleMarker(
                pdfDoc,
                page,
                {
                  x,
                  y,
                  radius:r,
                  color:col,
                  contents:contentsInfo,
                  nameId:idBase+"-circle"
                }
              );


            if(customLabel){

              const bx=
                x+
                r+
                7;

              /*
               * Tekstilaatikon korkeus (fonttikoko 9 + pehmuste 4x2=8)
               * lasketaan etukäteen, jotta laatikko voidaan keskittää
               * pystysuunnassa ympyrän kanssa ennen sen luomista.
               */
              const labelBoxH=
                9+4*2;

              const by=
                y-
                labelBoxH/2;


              pdfAddLabelBox(
                pdfDoc,
                page,
                font,
                {
                  x:bx,
                  y:by,
                  text:customLabel,
                  color:col,
                  nameId:idBase+"-label"
                }
              );


              pdfAddConnectorLine(
                pdfDoc,
                page,
                {
                  x1:x+r*.6,
                  y1:y,
                  x2:bx,
                  y2:y,
                  color:col,
                  nameId:idBase+"-line"
                }
              );

            }else{

              pdfAddNumberOverlay(
                pdfDoc,
                page,
                font,
                {
                  x,
                  y,
                  text:String(idx+1),
                  nameId:idBase+"-num"
                }
              );
            }
          }
        );
      }
    );


    const outBytes=
      await pdfDoc.save();


    const blob=
      new Blob(
        [outBytes],
        {
          type:"application/pdf"
        }
      );


    const url=
      URL.createObjectURL(
        blob
      );


    const safe=
      (project.nimi||"kohde")
        .replace(
          /[^a-z0-9äöå]+/gi,
          "_"
        );


    const a=
      document.createElement(
        "a"
      );


    a.href=url;


    a.download=
      `Pohjakuva_merkinnoin_${safe}_${project.pvm}.pdf`;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      4000
    );


    toast(
      "Pohjakuva (PDF) ladattu"
    );

  }catch(err){

    console.error(
      err
    );

    toast(
      "Pohjakuvan vienti epäonnistui"
    );
  }
}

   ============================================================ */

function waitForSupabaseClient(
  cb,
  triesLeft
){

  if(
    typeof triesLeft!=="number"
  ){

    triesLeft=100;
  }


  if(
    window.__supabaseClient
  ){

    return cb();
  }


  if(
    triesLeft<=0
  ){

    /*
     * KORJAUS: ei jäädä odottamaan Supabase-yhteyttä loputtomiin.
     * Näytetään lomake paikallisilla tiedoilla sen sijaan, että
     * sivu jää tyhjäksi.
     */
    toast(
      "Kirjautumistietoja ei saatu, jatketaan paikallisella lomakkeella."
    );

    cb();

    return;
  }


  setTimeout(
    ()=>{
      waitForSupabaseClient(
        cb,
        triesLeft-1
      );
    },
    50
  );
}

(async function bootstrap(){

  const footerEl=document.getElementById("footer");
  if(footerEl && window.ResizeObserver){
    new ResizeObserver(updateFooterHeight).observe(footerEl);
  }
  updateNetBanner();
  loadCustomMethods();

  /*
   * KORJAUS: varmistetaan, että sivu näytetään (visibility:visible)
   * ja render() suoritetaan AINA, riippumatta siitä onnistuuko
   * kirjautumisen tai pilven odotus. Aiemmin sivu saattoi jäädä
   * pysyvästi tyhjäksi, jos jokin näistä vaiheista jäi jumiin.
   */

  let renderedOnce=false;

  const safetyTimer=setTimeout(()=>{

    if(!renderedOnce){

      console.warn(
        "Käynnistys kesti liian kauan – näytetään lomake paikallisilla tiedoilla."
      );

      document.documentElement.style.visibility=
        "visible";

      loadState().catch(err=>{
        console.error(err);
      });
    }

  },12000);


  try{

    await new Promise(
      resolve=>{
        waitForSupabaseClient(
          resolve
        );
      }
    );


    /*
     * KORJAUS: window.__supabaseClient on olemassa heti kun
     * auth-gate.js on ajettu, mutta kirjautumisistunto (session) ei
     * välttämättä ole vielä ehtinyt latautua selaimen tallennustilasta
     * Supabase-clientin sisäiseen muistiin. Jos pilvihaku tehdään
     * liian aikaisin, pyyntö voi lähteä ilman istuntoa, jolloin
     * rivikohtainen käyttöoikeussääntö (RLS) ei löydä käyttäjän omaa
     * menetelmärivi — ja pilvessä olevat, esim. toisella laitteella
     * tallennetut menetelmät jäävät hakematta. auth.getSession()
     * odottaa Supabase-clientin sisäisen alustuksen valmiiksi ennen
     * kuin palauttaa, joten sen kutsuminen tässä varmistaa, että
     * seuraava pilvihaku tehdään vasta kun istunto on käytettävissä.
     */
    if(window.__supabaseClient){
      try{
        await window.__supabaseClient.auth.getSession();
      }catch(err){
        console.warn("Istunnon lataus epäonnistui",err);
      }
    }


    await syncCustomMethodsFromCloud();

    prefetchGuides().catch(()=>{});

    await loadState();

    renderedOnce=true;

  }catch(err){

    console.error(
      "Kenttälomakkeen käynnistys epäonnistui",
      err
    );


    toast(
      "Lomakkeen käynnistys epäonnistui, näytetään mitä saatiin ladattua."
    );

    /*
     * Varmistetaan, että näkymä ei jää tyhjäksi vaikka
     * käynnistys epäonnistuisi.
     */
    try{

      render();

    }catch(renderErr){

      console.error(renderErr);
    }

    renderedOnce=true;

  }finally{

    clearTimeout(safetyTimer);
    const splash=document.getElementById("bootSplash");
    if(splash)splash.remove();

    /*
     * Auth-gate voi hallita tätä myös itse.
     * Jos se ei tee sitä, varmistetaan että
     * sovellus ei jää näkymättömäksi.
     */
    document.documentElement.style.visibility=
      "visible";
  }

})();

</script>

</body>
</html>
