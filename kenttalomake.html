<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html{visibility:hidden}</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script src="auth-gate.js" defer></script>
<script src="submission-sync.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="docx-style-engine.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<title>Kenttälomake</title>

<style>
:root{
  --ink:#1c1f1a;
  --paper:#f2f0e8;
  --card:#fff;
  --line:#d8d4c6;
  --safety:#e8590c;
  --safety-dark:#c44a08;
  --ok:#2f6b3a;
  --warn:#b7791f;
  --error:#a3271b;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding-bottom:110px;
  -webkit-tap-highlight-color:transparent
}

button,
input,
select,
textarea{
  font-family:inherit
}

button{
  -webkit-tap-highlight-color:transparent
}

.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:14px 16px 12px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:3px solid var(--safety)
}

.topbar .eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#c9c6b8
}

.topbar h1{
  margin:2px 0 0;
  font-size:19px;
  font-weight:700;
  letter-spacing:-.01em
}

.wrap{
  padding:14px 14px 0
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin-bottom:12px
}

.card h2{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-family:var(--mono);
  color:#66604f;
  margin:0 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  margin:10px 0 4px;
  color:#3a3a34
}

label.req::after{
  content:" *";
  color:var(--safety)
}

input[type=text],
input[type=number],
input[type=date],
select,
textarea{
  width:100%;
  font-size:16px;
  padding:10px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  font-family:inherit
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--safety)
}

textarea{
  min-height:70px;
  resize:vertical
}

input[type=number]{
  appearance:textfield
}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  opacity:1
}

.hint{
  font-size:11.5px;
  color:#8a8574;
  margin-top:3px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:none;
  border-radius:8px;
  padding:11px 16px;
  font-size:14.5px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

.btn-primary{
  background:var(--safety);
  color:#fff
}

.btn-primary:active{
  background:var(--safety-dark)
}

.btn-outline{
  background:#fff;
  color:var(--ink);
  border:1.5px solid var(--line)
}

.btn-ghost{
  background:transparent;
  color:#8a3a15;
  padding:8px 10px;
  font-size:13px
}

.btn-block{
  width:100%
}

.btn-sm{
  padding:7px 10px;
  font-size:12.5px;
  border-radius:6px
}

.btn-danger{
  background:#fff;
  color:#a3271b;
  border:1.5px solid #e3b3ab
}

.method-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.method-tile{
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:12px 10px;
  text-align:left;
  cursor:pointer;
  font-size:13.5px;
  font-weight:700;
  line-height:1.25;
  color:var(--ink)
}

.method-tile .num{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--safety);
  display:block;
  margin-bottom:3px
}

.method-tile:active{
  border-color:var(--safety)
}

.entry-card{
  border:1.5px solid var(--line);
  border-left:5px solid var(--safety);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:9px;
  background:#fffdf9
}

.entry-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px
}

.entry-title{
  font-weight:700;
  font-size:14.5px
}

.entry-sub{
  font-size:12px;
  color:#8a8574;
  margin-top:2px;
  font-family:var(--mono)
}

.entry-actions{
  display:flex;
  gap:6px;
  margin-top:8px
}

.thumbs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px
}

.thumb{
  position:relative;
  width:56px;
  height:56px;
  border-radius:6px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#f6f4ed
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.thumb .rm{
  position:absolute;
  top:1px;
  right:1px;
  background:rgba(0,0,0,.65);
  color:#fff;
  border:none;
  width:20px;
  height:20px;
  border-radius:50%;
  font-size:13px;
  line-height:1;
  padding:0;
  cursor:pointer
}

.photo-add{
  display:flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  border-radius:6px;
  border:1.5px dashed var(--line);
  color:#8a8574;
  font-size:22px;
  background:#fbfaf6;
  cursor:pointer
}

.photo-card-item{
  display:flex;
  flex-direction:column;
  gap:4px;
  width:90px
}

.photo-card-item .thumb{
  width:90px;
  height:90px
}

.photo-caption{
  width:100%;
  font-size:11px;
  padding:5px;
  border:1px solid var(--line);
  border-radius:4px
}

.empty{
  text-align:center;
  padding:24px 10px;
  color:#8a8574;
  font-size:13.5px
}

.footerbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--card);
  border-top:1.5px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:30
}

.step-back{
  font-family:var(--mono);
  font-size:12px;
  color:#8a8574;
  display:flex;
  align-items:center;
  gap:4px;
  margin-bottom:10px;
  cursor:pointer
}

.badge{
  display:inline-block;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--mono);
  font-size:10.5px;
  padding:2px 6px;
  border-radius:4px;
  margin-left:6px
}

select{
  -webkit-appearance:none;
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23666' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;
  background-position:right 10px center
}

.toast{
  position:fixed;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:9px 16px;
  border-radius:20px;
  font-size:13px;
  z-index:500;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1
}

.sync-status{
  position:fixed;
  top:7px;
  right:10px;
  z-index:40;
  font-family:var(--mono);
  font-size:9.5px;
  color:#c9c6b8;
  opacity:.9;
  pointer-events:none
}

.sync-status.ok{
  color:#9bd0a4
}

.sync-status.warn{
  color:#f0c27b
}

.sync-status.error{
  color:#f4a09a
}

.loading{
  text-align:center;
  padding:40px 20px;
  color:#8a8574
}

.field-hint-host{
  position:relative
}

.field-hint-btn{
  position:absolute;
  top:-4px;
  right:0;
  width:22px;
  height:22px;
  border-radius:50%;
  border:1.5px solid var(--warn);
  background:#fbf1de;
  color:var(--warn);
  font-weight:800;
  font-size:.82rem;
  line-height:1;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2
}

.field-hint-box{
  display:none;
  margin:6px 0 4px;
  padding:8px 10px;
  border-radius:8px;
  background:#fbf1de;
  border:1px solid var(--warn);
  color:var(--warn);
  font-size:.85rem
}

.field-hint-box.open{
  display:block
}

.table-field{
  margin-top:10px
}

.table-field-scroll{
  overflow-x:auto;
  margin:6px 0 8px;
  -webkit-overflow-scrolling:touch
}

.table-field-table{
  border-collapse:collapse;
  width:100%
}

.table-field-table th{
  font-family:var(--mono);
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#66604f;
  text-align:left;
  padding:4px 6px;
  border-bottom:1.5px solid var(--line);
  white-space:nowrap
}

.table-field-table td{
  padding:4px 6px 4px 0;
  border-bottom:1px solid var(--line);
  vertical-align:middle
}

.table-field-table input[type=text],
.table-field-table input[type=number],
.table-field-table select{
  width:100px;
  min-width:78px;
  padding:6px 7px;
  font-size:14px;
  border-radius:6px
}

.table-field-table td:last-child{
  padding-right:0
}

.field-hint-btn-inline{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1.5px solid var(--warn);
  background:#fbf1de;
  color:var(--warn);
  font-weight:800;
  font-size:.82rem;
  line-height:1;
  cursor:pointer;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto
}

.table-field-action{
  position:sticky;
  right:0;
  background:var(--card);
  box-shadow:-4px 0 4px -2px rgba(0,0,0,.08)
}

@media(min-width:700px){
  .wrap{
    max-width:850px;
    margin:auto
  }

  .method-grid{
    grid-template-columns:repeat(3,1fr)
  }
}
</style>
</head>

<div class="topbar">
  <a href="index.html"

  <div class="eyebrow">Rakennustutkimus · kenttälomake</div>

<div class="wrap" id="app"><div class="loading">Ladataan lomaketta...</div></div>
<div class="footerbar" id="footer"></div>
<div class="toast" id="toast"></div>

<script>

"use strict";

/* ============================================================
   MENETELMÄT
   ============================================================ */

const DEFAULT_METHODS=[

    fields:[

        id:"havainnot",
        label:"Silmämääräiset havainnot",
        type:"textarea",

        placeholder:"Pintamateriaalin kunto, näkyvät vauriot, jäljet..."
      },
      {
        id:"haju",
        label:"Hajuhavainto",

        options:["Ei havaittu","Lievä","Selvä, poikkeava"]
      },
      {
        id:"hajukuvaus",
        label:"Hajun kuvaus",
        type:"text",
        placeholder:"esim. maakellarimainen, mikrobiperäinen"
      }
    ]
  },

  {
    id:"pintakosteus",
    name:"Pintakosteuden mittaus",
    short:"Pintakosteus",
    fields:[
      {
        id:"laite",

        type:"text",
        req:true,
        placeholder:"esim. Gann Hydromette, Tramex"
      },
      {

      },
      {
        id:"yksikko",
        label:"Yksikkö / asteikko",
        type:"select",
        options:["Vertailuluku (0–100)","Painoprosenttiarvio","Muu"]
      },
      {
        id:"tulkinta",
        label:"Tulkinta",
        type:"select",

      }
    ]
  },

  {
    id:"rh",
    name:"Rakenteen suht. kosteus (RH)",
    short:"RH-mittaus",
    fields:[
      {
        id:"syvyys",
        label:"Mittaussyvyys (mm)",
        type:"number",
        req:true,
        min:"0",
        step:"any"
      },
      {
        id:"rh",
        label:"Suhteellinen kosteus RH (%)",
        type:"number",
        req:true,
        min:"0",
        max:"100",
        step:"any"
      },
      {
        id:"lampo",
        label:"Lämpötila (°C)",
        type:"number",
        step:"any"
      },
      {
        id:"tasaantuminen",
        label:"Tasaantumisaika (h)",
        type:"number",
        min:"0",
        step:"any"
      },
      {
        id:"laite",
        label:"Mittalaite",
        type:"text",
        placeholder:"esim. Vaisala HMP"
      }
    ]
  },

  {
    id:"merkkiaine",
    name:"Merkkiainekoe",
    short:"Merkkiainekoe",
    fields:[
      {
        id:"aine",
        label:"Merkkiaine",
        type:"text",
        req:true,
        placeholder:"esim. vetykaasu"
      },
      {
        id:"injektio",
        label:"Injektointikohta",
        type:"text",
        req:true
      },
      {
        id:"tulos",
        label:"Tulos",
        type:"select",
        options:["Ei havaintoa","Merkkiainetta havaittu"]
      },
      {
        id:"leviaminen",
        label:"Havaittu leviämisreitti",
        type:"textarea",
        placeholder:"Mistä ilmavuoto/reitti kulkee"
      }
    ]
  },

  {
    id:"nayte",
    name:"Näyte",
    short:"Näytteenotto",
    fields:[
      {
        id:"tyyppi",
        label:"Näytteen tyyppi",
        type:"select",
        req:true,
        options:[
          "Mikrobimateriaalinäyte",
          "Mikrobi ilmanäyte",
          "Mikrobi pintasivelynäyte",
          "VOC materiaalinäyte",
          "VOC ilmanäyte",
          "VOC Flec-näyte",
          "Kuitulaskeumanäyte",
          "Pölynkoostumusnäyte",
          "Asbestimateriaalinäyte"
        ]
      },
      {
        id:"nro",
        label:"Näytteen tunnus / numero",
        type:"text",
        req:true
      }
    ]
  },

  {
    id:"lampokuvaus",
    name:"Lämpökuvaus",
    short:"Lämpökuvaus",
    fields:[
      {
        id:"kamera",

        type:"text"
      },
      {
        id:"ulko",

      {
        id:"sisa",

        type:"number",

      },

        placeholder:"esim. Kipsilevy 13 mm, hs-muovi, mineraalivilla 100 mm..."
      },
      {

        placeholder:"Eristekerroksen RH, ao-puun kosteus, sokkelin pko..."
      },
      {

      }
    ]
  },

  {
    id:"iv",

    short:"IV / paine-ero",
    fields:[
      {
        id:"laite",

      },
      {
        id:"paine",
        label:"Painesuhde (Pa)",
        type:"number",

      },

      }
    ]
  },

  {

    name:"Muu menetelmä",
    short:"Muu menetelmä",
    fields:[
      {
        id:"nimi",
        label:"Menetelmän nimi",
        type:"text",
        req:true
      },
      {
        id:"kuvaus",
        label:"Kuvaus ja havainnot",
        type:"textarea",
        req:true
      }
    ]

/*
 * METHODS on muokattava kopio DEFAULT_METHODS-listasta. Käyttäjä voi
 * lisätä/muokata/poistaa menetelmiä "Muokkaa menetelmiä" -näkymässä.
 *
 * Muutokset tallennetaan ensisijaisesti käyttäjäkohtaisesti Supabaseen
 * (tauluun CUSTOM_METHODS_TABLE, yksi rivi per kirjautunut käyttäjä),
 * jotta ne näkyvät samalla tunnuksella kaikilla laitteilla.
 * localStorageen (avain METHODS_STORAGE_KEY) tallennetaan aina myös
 * laitekohtainen kopio, jota käytetään heti sivun latauksen
 * yhteydessä (nopea, ei vaadi verkkoa) sekä varalla, jos
 * pilviyhteyttä ei ole.
 */
const METHODS_STORAGE_KEY="kenttalomake_custom_methods_v1";
const CUSTOM_METHODS_TABLE="custom_methods";

let METHODS=cloneMethods(DEFAULT_METHODS);

function cloneMethods(list){
  return JSON.parse(JSON.stringify(list));
}

function genMethodId(){
  return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function genFieldId(){
  return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function loadCustomMethods(){
  try{
    const raw=localStorage.getItem(METHODS_STORAGE_KEY);
    if(!raw)return;
    const custom=JSON.parse(raw);
    if(Array.isArray(custom)&&custom.length){
      METHODS=custom;
    }
  }catch(err){
    console.warn("Menetelmien lataus localStoragesta epäonnistui",err);
  }
}

/*
 * Hakee kirjautuneen käyttäjän tallentamat menetelmät Supabasesta ja
 * korvaa METHODS-listan niillä (RLS rajaa haun automaattisesti vain
 * omaan riviin, joten mitään user_id-suodatinta ei tarvita tässä).
 *
 * Jos pilvessä ei vielä ole tätä käyttäjää varten riviä mutta tällä
 * laitteella on paikallisesti (localStorage) muokattuja menetelmiä
 * — esim. ennen tätä päivitystä tehtyjä — viedään ne pilveen kertaalleen,
 * jotta ne eivät katoa ja tulevat käyttöön myös muilla laitteilla.
 */
async function syncCustomMethodsFromCloud(){
  if(!window.__supabaseClient)return;

  try{
    const {data,error}=
      await window.__supabaseClient
        .from(CUSTOM_METHODS_TABLE)
        .select("methods")
        .maybeSingle();

    if(error){
      console.warn("Menetelmien lataus pilvestä epäonnistui",error);
      return;
    }

    if(data && Array.isArray(data.methods) && data.methods.length){
      METHODS=data.methods;
      try{
        localStorage.setItem(METHODS_STORAGE_KEY,JSON.stringify(METHODS));
      }catch(err){
        console.warn("Menetelmien paikallinen välimuistitallennus epäonnistui",err);
      }
      return;
    }

    if(JSON.stringify(METHODS)!==JSON.stringify(DEFAULT_METHODS)){
      await pushMethodsToCloud();
    }
  }catch(err){
    console.warn("Menetelmien synkronointi pilvestä epäonnistui",err);
  }
}

/*
 * Vie nykyisen METHODS-listan Supabaseen kirjautuneen käyttäjän
 * riville (upsert user_id-sarakkeen mukaan; user_id täyttyy
 * automaattisesti sarakkeen oletusarvosta auth.uid()).
 */
async function pushMethodsToCloud(){
  if(!window.__supabaseClient)return false;

  try{
    const {error}=
      await window.__supabaseClient
        .from(CUSTOM_METHODS_TABLE)

const CLOUD_TIMEOUT_MS=8000;

function withTimeout(promise,ms,label){

  return new Promise((resolve,reject)=>{

    let settled=false;

    const timer=setTimeout(()=>{

      if(settled)return;

      settled=true;

      reject(new Error("timeout:"+(label||"")));

    },ms);


    Promise.resolve(promise).then(
      value=>{

        if(settled)return;

        settled=true;

        clearTimeout(timer);

        resolve(value);
      },
      err=>{

        if(settled)return;

        settled=true;

        clearTimeout(timer);

        reject(err);
      }
    );
  });
}

let DB_NAME="kenttalomakeDB";
const DB_STORE="state";

function floorPlanKey(){
  return "kenttalomake_floorplan_"+SUBMISSION_ID;
}

/*
 * KORJAUS: window.storage/localStorage-varmistustallennus käytti aiemmin
 * kiinteää avainta "kenttalomake_state" riippumatta SUBMISSION_ID:stä.
 * Tämä sekoitti eri projektien paikalliset varmuuskopiot keskenään --
 * uutta projektia avatessa saatettiin ladata edellisen projektin data
 * ja näyttää virheellisesti "Offline - paikallinen kopio". IndexedDB oli
 * jo oikein SUBMISSION_ID:llä eroteltu (DB_NAME), joten korjataan nyt
 * myös nämä kaksi varmistustasoa samalla periaatteella.
 */
function portableStateKey(){
  return "kenttalomake_state_"+SUBMISSION_ID;
}

function idbOpen(){

  return new Promise((resolve,reject)=>{

    if(!window.indexedDB){
      reject(new Error("no-idb"));
      return;
    }

    const req=indexedDB.open(DB_NAME,1);

    req.onupgradeneeded=()=>{
      const db=req.result;

      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE);
      }
    };

    req.onsuccess=()=>{
      const db=req.result;

      db.onversionchange=()=>{
        db.close();
      };

      resolve(db);
    };

    req.onerror=()=>{
      reject(req.error);
    };
  });
}

function idbSet(key,value){

  return idbOpen().then(db=>new Promise((resolve,reject)=>{

    const tx=db.transaction(DB_STORE,"readwrite");

    tx.objectStore(DB_STORE).put(value,key);

    tx.oncomplete=()=>{
      db.close();
      resolve();
    };

    tx.onerror=()=>{
      db.close();
      reject(tx.error);
    };
  }));
}

function idbGet(key){

  return idbOpen().then(db=>new Promise((resolve,reject)=>{

    const tx=db.transaction(DB_STORE,"readonly");

    const req=tx.objectStore(DB_STORE).get(key);

    req.onsuccess=()=>{
      resolve(req.result);
    };

    req.onerror=()=>{
      reject(req.error);
    };

    tx.oncomplete=()=>{
      db.close();
    };
  }));
}

function idbDel(key){

  return idbOpen().then(db=>new Promise((resolve,reject)=>{

    const tx=db.transaction(DB_STORE,"readwrite");

    tx.objectStore(DB_STORE).delete(key);

    tx.oncomplete=()=>{
      db.close();
      resolve();
    };

    tx.onerror=()=>{
      db.close();
      reject(tx.error);
    };
  }));
}

/*
 * KORJAUS: kokonaisen submission-kohtaisen IndexedDB-tietokannan
 * poisto. Aiemmin clearForm() tyhjensi vain avaimet mutta jätti
 * tyhjän tietokannan roikkumaan selaimen tallennustilaan pysyvästi.
 */
function idbDeleteDatabase(name){

  return new Promise((resolve)=>{

    if(!window.indexedDB || !name){
      resolve();
      return;
    }

    try{

      const req=indexedDB.deleteDatabase(name);

      req.onsuccess=()=>resolve();
      req.onerror=()=>resolve();
      req.onblocked=()=>resolve();

    }catch(err){

      resolve();
    }
  });
}

/*
 * KORJAUS: varoitus jos joudutaan turvautumaan JSON-varmuuskopioon
 * ja osalla valokuvista ei vielä ole pilvipolkua — nämä kuvat
 * katoaisivat, jos IndexedDB ei ole käytettävissä sivun uudelleenlatauksessa.
 */
function hasUnsyncedLocalOnlyPhotos(){

  return entries.some(e=>
    (e.photos||[]).some(p=>!p.path && p.blob instanceof Blob)
  );
}

async function autosave(){

  if(autosaveInProgress)return;

  autosaveInProgress=true;
  clearTimeout(saveTimer);

  setSyncStatus("Tallennetaan...");

  const indexedState=createIndexedDbState();
  const portableState=createPortableState();

  let localSaved=false;
  let indexedDbSaved=false;

  /*
   * IndexedDB on ensisijainen paikallinen tallennus.
   * Täällä Blobit säilyvät.
   */
  try{

    await idbSet(
      "kenttalomake_state",
      indexedState
    );

    localSaved=true;
    indexedDbSaved=true;

  }catch(err){

    console.warn("IndexedDB-tallennus epäonnistui",err);
  }


  /*
   * window.storage on vaihtoehtoinen varmistus.
   * Sinne tallennetaan vain JSON-yhteensopiva tila.
   */
  if(window.storage){

    try{

      await window.storage.set(
        portableStateKey(),
        JSON.stringify(portableState)
      );

      localSaved=true;

    }catch(err){

      console.warn("window.storage-tallennus epäonnistui",err);
    }
  }


  /*
   * localStorage viimeisenä varmistuksena.
   */
  try{

    localStorage.setItem(
      portableStateKey(),
      JSON.stringify(portableState)
    );

    localSaved=true;

  }catch(err){

    console.warn("localStorage-tallennus epäonnistui",err);
  }


  if(localSaved){

    lastSaveFailed=false;

    if(indexedDbSaved){

      setSyncStatus("Tallennettu laitteelle","ok");

    }else{

      /*
       * IndexedDB ei toiminut: kuvat, joita ei ole vielä
       * synkronoitu pilveen, voivat kadota sivun sulkeutuessa.
       */
      setSyncStatus("Tallennettu (rajoitetusti)","warn");

      if(hasUnsyncedLocalOnlyPhotos()){

        toast(
          "Huom: osaa valokuvista ei ole vielä varmuuskopioitu pilveen. "+
          "Pidä sivu auki kunnes synkronointi valmistuu."
        );
      }
    }

  }else{

    if(!lastSaveFailed){
      toast("Paikallinen tallennus epäonnistui – vapauta laitteen tallennustilaa.");
    }

    lastSaveFailed=true;
    setSyncStatus("Tallennus epäonnistui","error");
  }

  autosaveInProgress=false;

  /*
   * Pilvisynkronointi käynnistetään erillisenä jonona.
   */
  syncToCloud();
}

function deriveTitle(){

  return (
    project.nimi &&
    project.nimi.trim()
  ) || "(nimetön kohde)";
}


async function syncToCloud(){

  if(!window.SubmissionSync || !SUBMISSION_ID){
    return;
  }

  /*
   * Jos synkronointi on jo käynnissä,
   * merkitään uusi synkronointi jonoon.
   */
  if(cloudSyncInFlight){

    cloudSyncQueued=true;

    return;
  }

  cloudSyncInFlight=true;
  cloudSyncQueued=false;

  setSyncStatus("Synkronoidaan...");

  try{

    /*
     * Ladataan uudet valokuvat pilveen.
     */
    for(const e of entries){

      for(const p of (e.photos||[])){

        if(!p.path && p.blob){

          try{

            const path=await window.SubmissionSync.uploadPhoto(
              SUBMISSION_ID,
              p.id+".jpg",
              p.blob
            );

            if(path){
              p.path=path;
            }

          }catch(err){

            console.warn(
              "Kuvan lataus epäonnistui:",
              p.id,
              err
            );

            /*
             * Ei keskeytetä koko synkronointia.
             */
          }
        }
      }
    }


    /*
     * Pohjakuva.
     */
    if(floorPlanBlob && !floorPlanPath){

      try{

        floorPlanPath=
          await window.SubmissionSync.uploadPhoto(
            SUBMISSION_ID,
            "floorplan.pdf",
            floorPlanBlob
          );


        /*
         * KORJAUS: vasta kun uusi pohjakuva on varmasti tallentunut
         * pilveen, poistetaan mahdollinen vanha pohjakuva. Aiemmin
         * vanha tiedosto poistettiin heti kuvan valinnan yhteydessä,
         * jolloin yhteysongelma saattoi hävittää pohjakuvan kokonaan.
         */
        if(floorPlanPath && pendingOldFloorPlanPath){

          const toDelete=pendingOldFloorPlanPath;

          pendingOldFloorPlanPath=null;

          try{

            await window.SubmissionSync.deletePhotoFile(toDelete);

          }catch(err){

            console.warn(
              "Vanhan pohjakuvan poisto epäonnistui",
              err
            );
          }
        }

      }catch(err){

        console.warn(
          "Pohjakuvan lataus epäonnistui",
          err
        );
      }
    }


    /*
     * Pilveen tallennetaan vain ne kuvat,
     * joilla on olemassa oleva storage-polku.
     */
    const cloudEntries=entries.map(e=>({

      id:e.id,

      methodId:e.methodId,

      values:e.values,

      marker:e.marker||null,

      photos:(e.photos||[])
        .filter(p=>p.path)
        .map(p=>({
          id:p.id,
          path:p.path,
          caption:p.caption||""
        }))
    }));


    await window.SubmissionSync.saveSubmission({

      id:SUBMISSION_ID,

      formKey:FORM_KEY,

      formLabel:FORM_LABEL,

      title:deriveTitle(),

      data:{
        project,
        entries:cloudEntries,
        floorPlanPath:floorPlanPath||null
      }
    });


    setSyncStatus(
      "Synkronoitu pilveen",
      "ok"
    );

  }catch(err){

    console.warn(
      "Pilvisynkronointi epäonnistui",
      err
    );

    setSyncStatus(
      "Ei yhteyttä – tallennettu laitteelle",
      "warn"
    );

  }finally{

    cloudSyncInFlight=false;

    /*
     * Jos muutos tapahtui synkronoinnin aikana,
     * tehdään uusi synkronointi.
     */
    if(cloudSyncQueued){

      cloudSyncQueued=false;

      setTimeout(()=>{
        syncToCloud();
      },50);
    }
  }
}


/* ============================================================
   TILAN LATAUS
   ============================================================ */

async function loadState(){

  SUBMISSION_ID=initSubmissionId();

  DB_NAME=
    "kenttasub_"+
    SUBMISSION_ID.replace(/-/g,"")+
    "_db";

  let value=null;
  let loadedFromCloud=false;


  /*
   * Ensin pilvi — mutta aikakatkaisulla. Jos pilvipyyntö ei
   * vastaa kohtuullisessa ajassa (esim. huono verkko tai
   * auth-viive), jatketaan paikallisella datalla sen sijaan
   * että sovellus jää ikuisesti tyhjäksi lataamaan.
   */
  try{

    if(!window.SubmissionSync){
      throw new Error("SubmissionSync ei ole käytettävissä");
    }

    const sub=
      await withTimeout(
        window.SubmissionSync.loadSubmission(SUBMISSION_ID),
        CLOUD_TIMEOUT_MS,
        "loadSubmission"
      );

    if(sub && sub.data){

      if(sub.data.project){

        project=Object.assign(
          project,
          sub.data.project
        );
      }

      entries=[];


      for(const ce of (sub.data.entries||[])){

        const photos=[];


        /*
         * Kuvien lataus rinnakkain.
         */
        const photoResults=
          await Promise.all(
            (ce.photos||[]).map(async p=>{

              try{

                const blob=
                  await window.SubmissionSync.downloadPhoto(
                    p.path
                  );

                const url=
                  URL.createObjectURL(blob);

                return {
                  ok:true,
                  photo:{
                    id:p.id,
                    path:p.path,
                    url,
                    blob,
                    caption:p.caption||""
                  }
                };

              }catch(err){

                console.warn(
                  "Kuvan lataus epäonnistui",
                  p.path,
                  err
                );

                return {
                  ok:false,
                  photo:null
                };
              }
            })
          );


        photoResults.forEach(result=>{

          if(result.ok && result.photo){

            photos.push(result.photo);
          }
        });


        entries.push({

          id:ce.id,

          methodId:ce.methodId,

          values:ce.values||{},

          marker:ce.marker||null,

          photos
        });
      }


      /*
       * Pohjakuva.
       */
      if(sub.data.floorPlanPath){

        try{

          floorPlanBlob=
            await window.SubmissionSync.downloadPhoto(
              sub.data.floorPlanPath
            );

          floorPlanPath=
            sub.data.floorPlanPath;

        }catch(err){

          console.warn(
            "Pohjakuvan lataus epäonnistui",
            err
          );

          floorPlanBlob=null;
          floorPlanPath=null;
        }
      }


      loadedFromCloud=true;

      setSyncStatus(
        "Ladattu pilvestä",
        "ok"
      );
    }

  }catch(err){

    console.warn(
      "Pilvilataus epäonnistui tai aikakatkaistiin",
      err
    );
  }


  /*
   * Jos pilvestä ei saatu tietoja,
   * käytetään IndexedDB:tä.
   */
  if(!loadedFromCloud){

    try{

      value=
        await idbGet(
          "kenttalomake_state"
        ) || null;

    }catch(err){

      console.warn(
        "IndexedDB-lataus epäonnistui",
        err
      );
    }


    /*
     * window.storage.
     */
    if(!value && window.storage){

      try{

        const r=
          await window.storage.get(
            portableStateKey()
          );

        value=
          r && r.value
            ? JSON.parse(r.value)
            : null;

      }catch(err){

        console.warn(
          "window.storage-lataus epäonnistui",
          err
        );
      }
    }


    /*
     * localStorage.
     */
    if(!value){

      try{

        const raw=
          localStorage.getItem(
            portableStateKey()
          );

        if(raw){

          value=JSON.parse(raw);
        }

      }catch(err){

        console.warn(
          "localStorage-lataus epäonnistui",
          err
        );
      }
    }


    if(value){

      if(value.project){

        project=Object.assign(
          project,
          value.project
        );
      }


      /*
       * IndexedDB-tilassa photos sisältää Blobit.
       *
       * JSON-varmistustilassa kuvilta puuttuu Blob,
       * jolloin niiden paikallinen alkuperä ei ole enää
       * saatavilla. Pilveen ladatut kuvat voidaan kuitenkin
       * ladata myöhemmin.
       */
      entries=Array.isArray(value.entries)
        ? value.entries
        : [];


      for(const e of entries){

        if(!Array.isArray(e.photos)){
          e.photos=[];
        }


        for(const p of e.photos){

          if(p.blob instanceof Blob){

            if(!p.url){
              p.url=URL.createObjectURL(p.blob);
            }

          }else if(p.path && window.SubmissionSync){

            try{

              const blob=
                await window.SubmissionSync.downloadPhoto(
                  p.path
                );

              p.blob=blob;
              p.url=URL.createObjectURL(blob);

            }catch(err){

              console.warn(
                "Paikallisen kuvan palautus epäonnistui",
                p.path
              );
            }
          }
        }
      }


      if(value.view){
        view=value.view;
      }

      if("editingEntry" in value){

        editingEntry=value.editingEntry;

        /*
         * Varmistetaan, että editingEntry viittaa
         * entries-taulukon oikeaan objektiin.
         */
        if(editingEntry){

          const realEntry=
            entries.find(
              e=>e.id===editingEntry.id
            );

          if(realEntry){

            editingEntry=realEntry;
          }
        }
      }

      if("editingIsNew" in value){

        editingIsNew=value.editingIsNew;
      }


      await loadFloorPlan();

      toast(
        "Ei pilviyhteyttä juuri nyt — näytetään laitteelle tallennettu kopio."
      );

      setSyncStatus(
        "Offline – paikallinen kopio",
        "warn"
      );

    }else{

      await loadFloorPlan();

      setSyncStatus(
        "Uusi lomake",
        ""
      );
    }
  }


  /*
   * Jos lomakkeen tallennustilasta palautuu vanhentunut
   * näkymä, palautetaan turvallisesti projektinäkymään.
   */
  if(
    view==="entryForm" &&
    (
      !editingEntry ||
      !METHODS.find(
        m=>m.id===editingEntry.methodId
      )
    )
  ){

    view="project";
    editingEntry=null;
    editingIsNew=false;
  }


  render();
}

async function clearForm(){

  const oldSubmissionId=SUBMISSION_ID;
  const oldDbName=DB_NAME;
  const oldFloorPlanKey=floorPlanKey();


  /*
   * Poistetaan paikallinen tila ennen uuden submissionin luontia.
   */
  try{
    await idbDel("kenttalomake_state");
  }catch(err){
    console.warn(err);
  }

  try{
    await idbDel(oldFloorPlanKey);
  }catch(err){
    console.warn(err);
  }


  /*
   * KORJAUS: poistetaan koko vanhan submissionin IndexedDB-tietokanta,
   * jotta tyhjiä tietokantoja ei jää roikkumaan selaimen tallennustilaan.
   */
  try{
    await idbDeleteDatabase(oldDbName);
  }catch(err){
    console.warn(err);
  }


  try{

    if(window.storage){

      await window.storage.delete(
        portableStateKey()
      );
    }

  }catch(err){
    console.warn("kenttalomake_state-tilan poisto epäonnistui", err);
  }


  try{

    localStorage.removeItem(
      portableStateKey()
    );

  }catch(err){
    console.warn("kenttalomake_state-tilan poisto localStoragesta epäonnistui", err);
  }


  /*
   * Poistetaan kuvat muistista.
   */
  revokePhotoUrls();


  /*
   * Pilvestä poistetaan submission.
   */
  if(window.SubmissionSync){

    try{

      await window.SubmissionSync.deleteSubmission(
        oldSubmissionId
      );

    }catch(err){

      console.warn(
        "Pilvisubmissionin poisto epäonnistui",
        err
      );
    }
  }


  /*
   * Uusi submission.
   */
  SUBMISSION_ID=
    (window.SubmissionSync && window.SubmissionSync.newId)
      ? window.SubmissionSync.newId()
      : ("local-"+Date.now()+"-"+Math.random().toString(36).slice(2,10));


  const params=
    new URLSearchParams(
      window.location.search
    );

  params.set(
    "submission",
    SUBMISSION_ID
  );


  window.history.replaceState(
    null,
    "",
    window.location.pathname+
    "?"+
    params.toString()
  );


  DB_NAME=
    "kenttasub_"+
    SUBMISSION_ID.replace(/-/g,"")+
    "_db";


  project={
    nimi:"",
    osoite:"",
    tilaaja:"",
    tutkija:"",
    pvm:localDateISO()
  };

  entries=[];

  editingEntry=null;
  editingIsNew=false;

  floorPlanBlob=null;
  floorPlanPath=null;
  floorPlanPreviewPage=1;
  pendingOldFloorPlanPath=null;


  _pdfDocCache=null;
  _pdfDocCacheBlob=null;


  render();

  toast(
    "Lomake tyhjennetty. Uusi kohde aloitettu."
  );

  setSyncStatus(
    "Uusi lomake",
    ""
  );
}

function toast(msg){

  const t=
    document.getElementById("toast");

  if(!t)return;

  clearTimeout(toastTimer);

  t.textContent=msg;

  t.classList.add("show");

  toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}


function el(html){

  const d=document.createElement("div");

  d.innerHTML=html.trim();

  return d.firstElementChild;
}

/*
 * el():n kaltainen, mutta <tr>...</tr>-merkkijonoille. Tavallinen
 * div.innerHTML="<tr>...</tr>" ei toimi: selain jäsentää HTML:ää
 * spesifikaation mukaan niin, että tr/td-tagit ilman table-
 * kontekstia hylätään kokonaan, jolloin vain rivin ENSIMMÄINEN
 * sisäkkäinen elementti (esim. ensimmäisen sarakkeen input) jäisi
 * jäljelle ja loput sarakkeet katoaisivat. Käyttämällä <tbody>-
 * elementtiä jäsennyskontekstina (parametrina annettu <tr>...</tr>
 * mukaan lukien) <tr> ja sen <td>-lapset jäsentyvät oikein.
 */
function elRow(html){

  const tbody=document.createElement("tbody");

  tbody.innerHTML=html.trim();

  return tbody.firstElementChild;
}


function escapeHtml(s){

  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


function escapeAttribute(s){

  return escapeHtml(s);
}

function appendPhotoToThumb(thumb,p){

  thumb.innerHTML="";


  if(p.url){

    const img=
      document.createElement("img");

    img.src=p.url;

    img.alt=p.caption
      ? p.caption
      : "Tutkimusvalokuva";

    img.loading="lazy";

    thumb.appendChild(img);

    return;
  }


  /*
   * Jos URL puuttuu mutta Blob on olemassa,
   * luodaan URL.
   */
  if(p.blob instanceof Blob){

    try{

      p.url=
        URL.createObjectURL(
          p.blob
        );

      const img=
        document.createElement("img");

      img.src=p.url;

      img.alt=
        p.caption
          ? p.caption
          : "Tutkimusvalokuva";

      img.loading="lazy";

      thumb.appendChild(img);

      return;

    }catch(err){

      console.warn(err);
    }
  }


  thumb.textContent="Kuva ei ole saatavilla";
}

/*
 * TAULUKKOKENTÄN SARAKKEET
 *
 * Taulukkotyyppinen kenttä (esim. rakenneavauksen "Rakennekerrokset")
 * koostuu käyttäjän määrittelemistä sarakkeista (f.columns:
 * {id,label,type}), ja tutkija lisää lomakkeella rivejä tarpeen
 * mukaan. Jokainen rivi on olio { [columnId]: arvo }, ja koko
 * taulukon arvo tallentuu values[f.id]:hen listana rivejä.
 */
function syncFieldColumnsFromDom(f,fieldIdx){

  if(!Array.isArray(f.columns))return;

  f.columns.forEach((col,cIdx)=>{

    const labelInput=
      document.getElementById(
        `mf_col_label_${fieldIdx}_${cIdx}`
      );

    const typeSelect=
      document.getElementById(
        `mf_col_type_${fieldIdx}_${cIdx}`
      );

    const optionsTextarea=
      document.getElementById(
        `mf_col_options_${fieldIdx}_${cIdx}`
      );

    if(labelInput)col.label=labelInput.value;
    if(typeSelect)col.type=typeSelect.value;

    if(optionsTextarea){
      col.options=
        optionsTextarea.value
          .split("\n")
          .map(s=>s.trim())
          .filter(Boolean);
    }
  });
}

/*
 * APULAUSEET
 *
 * Kenttäkohtaisia ehdollisia vihjetekstejä tutkijalle, esim.
 * "Pintakosteus koholla, tee rakennekosteusmittaus", kun kentän
 * arvo täyttää ehdon (esim. > 80). Sallitut vertailut riippuvat
 * kentän tyypistä: numerokentille suuruusvertailut, muille
 * yhtäsuuruus/erisuuruus ja "sisältää".
 */
function hintOpsForType(type){
  if(type==="number"){
    return [
      { value:"gt", label:"suurempi kuin (>)" },
      { value:"gte", label:"vähintään (≥)" },
      { value:"lt", label:"pienempi kuin (<)" },
      { value:"lte", label:"enintään (≤)" },
      { value:"eq", label:"yhtä suuri (=)" },
      { value:"neq", label:"eri suuri (≠)" }
    ];
  }
  return [
    { value:"eq", label:"on (=)" },
    { value:"neq", label:"ei ole (≠)" },
    { value:"contains", label:"sisältää" }
  ];
}

function evalHintRule(rule,type,rawValue){

  if(
    rawValue===undefined ||
    rawValue===null
  )return false;

  const strVal=
    String(rawValue).trim();

  if(strVal==="")return false;


  if(type==="number"){

    const n=Number(strVal);
    const rv=Number(rule.value);

    if(
      !Number.isFinite(n) ||
      !Number.isFinite(rv)
    )return false;

    switch(rule.op){
      case "gt":return n>rv;
      case "gte":return n>=rv;
      case "lt":return n<rv;
      case "lte":return n<=rv;
      case "eq":return n===rv;
      case "neq":return n!==rv;
      default:return false;
    }
  }

  const a=strVal.toLowerCase();
  const b=String(rule.value||"").trim().toLowerCase();

  if(b==="")return false;

  switch(rule.op){
    case "eq":return a===b;
    case "neq":return a!==b;
    case "contains":return a.indexOf(b)!==-1;
    default:return false;
  }
}

function matchingHints(f,rawValue){

  if(!f.hints||!f.hints.length)return [];

  return f.hints
    .filter(r=>
      r.text &&
      r.text.trim() &&
      evalHintRule(r,f.type,rawValue)
    )
    .map(r=>r.text.trim());
}

/*
 * Taulukkokentän apulausesäännöt voivat yhdistää useita ehtoja
 * saman rivin eri sarakkeista (kaikkien pitää täyttyä = JA).
 * Arvioidaan yhtä riviä (row = {sarakeId: arvo}) vasten.
 */
function matchingTableRowHints(f,cols,row){

  if(!f.hints||!f.hints.length)return [];

  return f.hints
    .filter(rule=>
      rule.text &&
      rule.text.trim() &&
      Array.isArray(rule.conditions) &&
      rule.conditions.length &&
      rule.conditions.every(cond=>{

        const col=
          cols.find(c=>c.id===cond.colId);

        if(!col)return false;

        return evalHintRule(
          cond,
          col.type,
          row[col.id]
        );
      })
    )
    .map(rule=>rule.text.trim());
}

/*
 * Lukee kentän apulauserivien nykyiset DOM-arvot talteen f.hints-
 * taulukkoon. Kutsutaan aina ennen kuin apulauserivit tai koko
 * kenttälista piirretään uudelleen, jotta kesken kirjoituksen
 * olevat arvot eivät katoa.
 */
function syncFieldHintsFromDom(f,fieldIdx){

  if(!Array.isArray(f.hints))return;

  f.hints.forEach((r,hIdx)=>{

    const opSel=
      document.getElementById(
        `mf_hint_op_${fieldIdx}_${hIdx}`
      );

    const valInput=
      document.getElementById(
        `mf_hint_val_${fieldIdx}_${hIdx}`
      );

    const textInput=
      document.getElementById(
        `mf_hint_text_${fieldIdx}_${hIdx}`
      );

    if(opSel)r.op=opSel.value;
    if(valInput)r.value=valInput.value;
    if(textInput)r.text=textInput.value;
  });
}

/*
 * Sama kuin syncFieldHintsFromDom, mutta taulukkokentän
 * usean ehdon säännöille (f.hints[i].conditions[j]).
 */
function syncFieldTableHintsFromDom(f,fieldIdx){

  if(!Array.isArray(f.hints))return;

  f.hints.forEach((rule,ruleIdx)=>{

    (rule.conditions||[]).forEach((cond,condIdx)=>{

      const colSel=
        document.getElementById(
          `mf_ruleCond_col_${fieldIdx}_${ruleIdx}_${condIdx}`
        );

      const opSel=
        document.getElementById(
          `mf_ruleCond_op_${fieldIdx}_${ruleIdx}_${condIdx}`
        );

      const valInput=
        document.getElementById(
          `mf_ruleCond_val_${fieldIdx}_${ruleIdx}_${condIdx}`
        );

      if(colSel)cond.colId=colSel.value;
      if(opSel)cond.op=opSel.value;
      if(valInput)cond.value=valInput.value;
    });

    const textInput=
      document.getElementById(
        `mf_ruleText_${fieldIdx}_${ruleIdx}`
      );

    if(textInput)rule.text=textInput.value;
  });
}

        Muokkaa olemassa olevia menetelmiä tai lisää uusia.
        Muutokset tallennetaan tälle laitteelle.
      </div>
    </div>
  `);

  if(!METHODS.length){
    c.appendChild(
      el(`<div class="empty">Ei yhtään menetelmää. Lisää uusi alta.</div>`)
    );
    return c;
  }

  METHODS.forEach((m,idx)=>{

    const usedCount=
      entries.filter(e=>e.methodId===m.id).length;

    const row=el(`
      <div class="entry-card">
        <div class="entry-top">
          <div>
            <div class="entry-title">${escapeHtml(m.name||"(nimetön menetelmä)")}</div>
            <div class="entry-sub">
              ${m.fields.length} kenttää
              ${usedCount?(" · käytössä "+usedCount+" kirjauksessa"):""}
            </div>
          </div>
          <div class="entry-actions">
            <button type="button" class="btn btn-sm btn-outline" data-act="edit">Muokkaa</button>
            <button type="button" class="btn btn-sm btn-danger" data-act="del">Poista</button>
          </div>
        </div>
      </div>
    `);

    row.querySelector('[data-act="edit"]').onclick=()=>{
      editingMethod=cloneMethods([m])[0];
      editingMethodIsNew=false;
      view="methodEdit";
      render();
    };

    row.querySelector('[data-act="del"]').onclick=async ()=>{
      const warn=
        usedCount
          ?("Menetelmää on käytetty "+usedCount+" kirjatussa menetelmässä. "+
            "Jos poistat sen, näitä kirjauksia ei enää voi avata muokattavaksi, "+
            "mutta niiden data säilyy taustalla.\n\n")
          :"";
      if(
        confirm(
          warn+
          'Poistetaanko menetelmä "'+m.name+'" pysyvästi?'
        )
      ){
        METHODS.splice(idx,1);
        await persistMethods();
        render();
      }
    };

    c.appendChild(row);
  });

  return c;
}

function renderMethodFieldRow(f,idx,fields){

  if(!Array.isArray(f.hints))f.hints=[];
  if(!Array.isArray(f.columns))f.columns=[];

  const row=el(`
    <div class="card" style="padding:12px;margin-bottom:10px;background:var(--paper);">
      <div style="display:flex;gap:8px;align-items:flex-start;">
        <div style="flex:1;">
          <label>Kentän nimi</label>
          <input type="text" id="mf_label_${idx}" value="${escapeAttribute(f.label||"")}" placeholder="esim. Mittausarvo">
        </div>
        <button type="button" class="btn btn-sm btn-danger" id="mf_del_${idx}" style="margin-top:22px;">✕</button>
      </div>

      <label>Kentän tyyppi</label>
      <select id="mf_type_${idx}">
        ${FIELD_TYPES.map(t=>`
          <option value="${t.value}" ${t.value===f.type?"selected":""}>${t.label}</option>
        `).join("")}
      </select>

      <div id="mf_options_wrap_${idx}" style="${f.type==="select"?"":"display:none;"}">
        <label>Vaihtoehdot (yksi per rivi)</label>
        <textarea id="mf_options_${idx}" placeholder="Vaihtoehto 1&#10;Vaihtoehto 2">${escapeHtml((f.options||[]).join("\n"))}</textarea>
      </div>

      <div id="mf_table_wrap_${idx}" style="${f.type==="table"?"":"display:none;"}margin-top:8px;">
        <label>Taulukon sarakkeet</label>
        <div class="hint">
          Määritä sarakkeet, joita tutkija täyttää rivi kerrallaan
          (esim. "Rakennekerros", "Paksuus (mm)", "Kosteus (%)").
          Tutkija voi lisätä lomakkeella niin monta riviä kuin tarvitsee.
        </div>
        <div id="mf_cols_${idx}"></div>
        <button type="button" class="btn btn-sm btn-outline" id="mf_addcol_${idx}">
          + Lisää sarake
        </button>
      </div>

      <div id="mf_placeholder_wrap_${idx}" style="${f.type==="table"?"display:none;":""}">
        <label>Ohjeteksti (valinnainen)</label>
        <input type="text" id="mf_placeholder_${idx}" value="${escapeAttribute(f.placeholder||"")}" placeholder="Kenttäkohtainen esimerkkiteksti">
      </div>

      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <input type="checkbox" id="mf_req_${idx}" style="width:auto;" ${f.req?"checked":""}>
        Pakollinen kenttä
      </label>

      <div id="mf_hints_wrap_${idx}" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">
        <label>Apulauseet tutkijalle (valinnainen)</label>
        <div class="hint">
          Näytetään huutomerkki-kuvakkeena, kun ehdot täyttyvät.
          Taulukkokentässä voit yhdistää useita saman rivin ehtoja
          (JA), esim. "Kosteus &gt; 80" TAI "Rakennekerros = eriste
          JA Kosteus &gt; 30" — apulause näkyy silloin kyseisen rivin
          kohdalla.
        </div>
        <div id="mf_hints_${idx}"></div>
        <button type="button" class="btn btn-sm btn-outline" id="mf_addhint_${idx}">
          + Lisää apulause
        </button>
      </div>
    </div>
  `);

  const typeSelect=row.querySelector(`#mf_type_${idx}`);
  const optionsWrap=row.querySelector(`#mf_options_wrap_${idx}`);
  const tableWrap=row.querySelector(`#mf_table_wrap_${idx}`);
  const placeholderWrap=row.querySelector(`#mf_placeholder_wrap_${idx}`);
  const hintsWrap=row.querySelector(`#mf_hints_${idx}`);
  const colsWrap=row.querySelector(`#mf_cols_${idx}`);

  function renderHints(){

    hintsWrap.innerHTML="";

    if(f.type==="table"){

      const cols=f.columns||[];

      f.hints.forEach((rule,ruleIdx)=>{

        if(
          !Array.isArray(rule.conditions) ||
          !rule.conditions.length
        ){
          rule.conditions=[{
            colId:cols[0]?cols[0].id:"",
            op:"eq",
            value:""
          }];
        }

        rule.conditions.forEach(cond=>{
          if(!cols.find(c=>c.id===cond.colId)){
            cond.colId=cols[0]?cols[0].id:"";
          }
        });

        const ruleBox=el(`
          <div class="card" style="padding:8px;margin-bottom:10px;background:#fff;">
            <div id="mf_rule_conds_${idx}_${ruleIdx}"></div>
            <button type="button" class="btn btn-sm btn-outline" id="mf_rule_addcond_${idx}_${ruleIdx}" style="margin-top:2px;">
              + Ja ehto
            </button>
            <input
              type="text"
              id="mf_ruleText_${idx}_${ruleIdx}"
              placeholder="Apulause, esim. Rakenne kostunut, jatkotutkimus tarpeen"
              value="${escapeAttribute(rule.text||"")}"
              style="margin-top:8px;"
            >
            <button type="button" class="btn btn-sm btn-danger" id="mf_rule_del_${idx}_${ruleIdx}" style="margin-top:8px;">
              Poista sääntö
            </button>
          </div>
        `);

        hintsWrap.appendChild(ruleBox);

        const condsWrap=
          ruleBox.querySelector(`#mf_rule_conds_${idx}_${ruleIdx}`);

        function renderConds(){

          condsWrap.innerHTML="";

          rule.conditions.forEach((cond,condIdx)=>{

            const col=
              cols.find(c=>c.id===cond.colId)||cols[0];

            const ops=
              hintOpsForType(col?col.type:"text");

            if(!ops.find(o=>o.value===cond.op)){
              cond.op=ops[0]?ops[0].value:"eq";
            }

            const condRow=el(`
              <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
                ${condIdx>0?`<span style="font-size:11px;color:#8a8574;flex:0 0 auto;">JA</span>`:""}
                <select id="mf_ruleCond_col_${idx}_${ruleIdx}_${condIdx}" style="flex:1;width:auto;">
                  ${cols.map(c=>`
                    <option value="${escapeAttribute(c.id)}" ${c.id===cond.colId?"selected":""}>${escapeHtml(c.label||"")}</option>
                  `).join("")}
                </select>
                <select id="mf_ruleCond_op_${idx}_${ruleIdx}_${condIdx}" style="flex:0 0 auto;width:auto;">
                  ${ops.map(o=>`
                    <option value="${o.value}" ${o.value===cond.op?"selected":""}>${o.label}</option>
                  `).join("")}
                </select>
                <input
                  type="text"
                  id="mf_ruleCond_val_${idx}_${ruleIdx}_${condIdx}"
                  placeholder="Arvo"
                  value="${escapeAttribute(cond.value||"")}"
                  style="width:80px;flex:0 0 auto;"
                >
                ${rule.conditions.length>1?`
                  <button type="button" class="btn btn-sm btn-danger" id="mf_ruleCond_del_${idx}_${ruleIdx}_${condIdx}">✕</button>
                `:""}
              </div>
            `);

            condsWrap.appendChild(condRow);

            condRow.querySelector(`#mf_ruleCond_col_${idx}_${ruleIdx}_${condIdx}`).onchange=e=>{
              syncFieldTableHintsFromDom(f,idx);
              cond.colId=e.target.value;
              renderConds();
            };

            if(rule.conditions.length>1){
              condRow.querySelector(`#mf_ruleCond_del_${idx}_${ruleIdx}_${condIdx}`).onclick=()=>{
                syncFieldTableHintsFromDom(f,idx);
                rule.conditions.splice(condIdx,1);
                renderConds();
              };
            }
          });
        }

        renderConds();

        ruleBox.querySelector(`#mf_rule_addcond_${idx}_${ruleIdx}`).onclick=()=>{
          syncFieldTableHintsFromDom(f,idx);
          rule.conditions.push({
            colId:cols[0]?cols[0].id:"",
            op:"eq",
            value:""
          });
          renderConds();
        };

        ruleBox.querySelector(`#mf_rule_del_${idx}_${ruleIdx}`).onclick=()=>{
          syncFieldTableHintsFromDom(f,idx);
          f.hints.splice(ruleIdx,1);
          renderHints();
        };
      });

      return;
    }

    const ops=hintOpsForType(f.type);

    f.hints.forEach((r,hIdx)=>{

      if(!ops.find(o=>o.value===r.op)){
        r.op=ops[0].value;
      }

      const hr=el(`
        <div class="card" style="padding:8px;margin-bottom:8px;background:#fff;">
          <div style="display:flex;gap:6px;align-items:center;">
            <select id="mf_hint_op_${idx}_${hIdx}" style="flex:0 0 auto;width:auto;">
              ${ops.map(o=>`
                <option value="${o.value}" ${o.value===r.op?"selected":""}>${o.label}</option>
              `).join("")}
            </select>
            <input
              type="text"
              id="mf_hint_val_${idx}_${hIdx}"
              placeholder="Arvo"
              value="${escapeAttribute(r.value||"")}"
              style="width:90px;flex:0 0 auto;"
            >
            <button type="button" class="btn btn-sm btn-danger" id="mf_hint_del_${idx}_${hIdx}" style="margin-left:auto;">✕</button>
          </div>
          <input
            type="text"
            id="mf_hint_text_${idx}_${hIdx}"
            placeholder="Apulause, esim. Pintakosteus koholla, tee rakennekosteusmittaus"
            value="${escapeAttribute(r.text||"")}"
            style="margin-top:6px;"
          >
        </div>
      `);

      hintsWrap.appendChild(hr);

      hr.querySelector(`#mf_hint_del_${idx}_${hIdx}`).onclick=()=>{
        syncFieldHintsFromDom(f,idx);
        f.hints.splice(hIdx,1);
        renderHints();
      };
    });
  }

  function renderColumns(){

    colsWrap.innerHTML="";

    f.columns.forEach((col,cIdx)=>{

      const cr=el(`
        <div class="card" style="padding:8px;margin-bottom:8px;background:#fff;">
          <div style="display:flex;gap:6px;align-items:center;">
            <input
              type="text"
              id="mf_col_label_${idx}_${cIdx}"
              placeholder="Sarakkeen nimi"
              value="${escapeAttribute(col.label||"")}"
              style="flex:1;"
            >
            <select id="mf_col_type_${idx}_${cIdx}" style="flex:0 0 auto;width:auto;">
              <option value="text" ${col.type==="text"?"selected":""}>Teksti</option>
              <option value="number" ${col.type==="number"?"selected":""}>Numero</option>
              <option value="select" ${col.type==="select"?"selected":""}>Valinta</option>
            </select>
            <button type="button" class="btn btn-sm btn-danger" id="mf_col_del_${idx}_${cIdx}">✕</button>
          </div>
          <div id="mf_col_options_wrap_${idx}_${cIdx}" style="${col.type==="select"?"":"display:none;"}margin-top:6px;">
            <label style="margin-top:0;">Vaihtoehdot (yksi per rivi)</label>
            <textarea id="mf_col_options_${idx}_${cIdx}" placeholder="Vaihtoehto 1&#10;Vaihtoehto 2">${escapeHtml((col.options||[]).join("\n"))}</textarea>
          </div>
        </div>
      `);

      colsWrap.appendChild(cr);

      const colOptionsWrap=
        cr.querySelector(`#mf_col_options_wrap_${idx}_${cIdx}`);

      cr.querySelector(`#mf_col_type_${idx}_${cIdx}`).onchange=e=>{
        colOptionsWrap.style.display=
          e.target.value==="select"?"":"none";
        syncFieldColumnsFromDom(f,idx);
        renderHints();
      };

      cr.querySelector(`#mf_col_del_${idx}_${cIdx}`).onclick=()=>{
        syncFieldColumnsFromDom(f,idx);
        f.columns.splice(cIdx,1);
        renderColumns();
        renderHints();
      };
    });
  }

  renderHints();
  renderColumns();

  row.querySelector(`#mf_addhint_${idx}`).onclick=()=>{

    if(f.type==="table"){

      syncFieldTableHintsFromDom(f,idx);

      f.hints.push({
        id:genFieldId(),
        conditions:[{
          colId:f.columns[0]?f.columns[0].id:"",
          op:"eq",
          value:""
        }],
        text:""
      });

    }else{

      syncFieldHintsFromDom(f,idx);

      f.hints.push({
        id:genFieldId(),
        op:hintOpsForType(f.type)[0].value,
        value:"",
        text:""
      });
    }

    renderHints();
  };

  row.querySelector(`#mf_addcol_${idx}`).onclick=()=>{
    syncFieldColumnsFromDom(f,idx);
    f.columns.push({
      id:genFieldId(),
      label:"",
      type:"text"
    });
    renderColumns();
    renderHints();
  };

  typeSelect.onchange=()=>{

    const prevType=f.type;

    f.type=typeSelect.value;

    optionsWrap.style.display=
      f.type==="select"?"":"none";

    tableWrap.style.display=
      f.type==="table"?"":"none";

    placeholderWrap.style.display=
      f.type==="table"?"none":"";

    if(prevType==="table"){
      syncFieldTableHintsFromDom(f,idx);
    }else{
      syncFieldHintsFromDom(f,idx);
    }

    /*
     * Apulauseiden muoto on erilainen taulukkokentälle (usean ehdon
     * säännöt) kuin muille kentille (yksi ehto), joten kentän tyyppiä
     * vaihdettaessa vanhat apulauseet eivät sellaisenaan sovi uuteen
     * muotoon — nollataan lista, ettei jää virheellistä dataa.
     */
    if(
      (f.type==="table") !== (prevType==="table")
    ){
      f.hints=[];
    }

    renderHints();
  };

  row.querySelector(`#mf_del_${idx}`).onclick=()=>{
    syncMethodFieldsFromDom(fields);
    fields.splice(idx,1);
    renderMethodEditFieldsInto(fieldsListEl,fields);
  };

  return row;
}

let fieldsListEl=null;

function renderMethodEditFieldsInto(wrap,fields){
  wrap.innerHTML="";
  fields.forEach((f,idx)=>{
    wrap.appendChild(renderMethodFieldRow(f,idx,fields));
  });
  const countEl=document.getElementById("methodFieldsCount");
  if(countEl)countEl.textContent=fields.length;
}

/*
 * Ennen kuin kenttälista piirretään uudelleen (kentän lisäys/poisto),
 * luetaan DOM:ssa jo auki olevien kenttärivien arvot talteen — muuten
 * esim. kesken kirjoituksen oleva nimi katoaisi rivin lisäyksen/poiston
 * yhteydessä.
 */
function syncMethodFieldsFromDom(fields){
  fields.forEach((f,idx)=>{
    const labelInput=document.getElementById("mf_label_"+idx);
    if(!labelInput)return;
    f.label=labelInput.value;

    const typeSelect=document.getElementById("mf_type_"+idx);
    if(typeSelect)f.type=typeSelect.value;

    const placeholderInput=document.getElementById("mf_placeholder_"+idx);
    if(placeholderInput)f.placeholder=placeholderInput.value;

    const reqCheck=document.getElementById("mf_req_"+idx);
    if(reqCheck)f.req=reqCheck.checked;

    const optionsTextarea=document.getElementById("mf_options_"+idx);
    if(optionsTextarea){
      f.options=
        optionsTextarea.value
          .split("\n")
          .map(s=>s.trim())
          .filter(Boolean);
    }

    if(f.type==="table"){
      syncFieldTableHintsFromDom(f,idx);
    }else{
      syncFieldHintsFromDom(f,idx);
    }
    syncFieldColumnsFromDom(f,idx);
  });
}

async function saveMethodEdit(){

  const name=document.getElementById("me_name").value.trim();
  const short=document.getElementById("me_short").value.trim();

  if(!name){
    toast("Anna menetelmälle nimi");
    return;
  }

  const fields=editingMethod.fields;

  for(let i=0;i<fields.length;i++){
    const labelInput=document.getElementById("mf_label_"+i);
    const typeSelect=document.getElementById("mf_type_"+i);
    const placeholderInput=document.getElementById("mf_placeholder_"+i);
    const reqCheck=document.getElementById("mf_req_"+i);
    const optionsTextarea=document.getElementById("mf_options_"+i);

    const label=labelInput.value.trim();
    if(!label){
      toast("Jokaisella kentällä pitää olla nimi");
      return;
    }

    fields[i].label=label;
    fields[i].type=typeSelect.value;
    fields[i].placeholder=placeholderInput.value.trim();
    fields[i].req=reqCheck.checked;

    if(fields[i].type==="select"){
      fields[i].options=
        optionsTextarea.value
          .split("\n")
          .map(s=>s.trim())
          .filter(Boolean);
      if(!fields[i].options.length){
        toast('Anna "'+label+'" -kentälle vähintään yksi vaihtoehto');
        return;
      }
    }else{
      delete fields[i].options;
    }

    if(fields[i].type==="table"){

      syncFieldColumnsFromDom(fields[i],i);

      fields[i].columns=
        (fields[i].columns||[])
          .map(col=>{

            const type=
              (col.type==="number"||col.type==="select")
                ?col.type
                :"text";

            const cleaned={
              id:col.id||genFieldId(),
              label:String(col.label||"").trim(),
              type
            };

            if(type==="select"){
              cleaned.options=
                (col.options||[])
                  .map(s=>String(s).trim())
                  .filter(Boolean);
            }

            return cleaned;
          });

      if(fields[i].columns.some(col=>col.label==="")){
        toast('Anna jokaiselle "'+label+'" -taulukon sarakkeelle nimi');
        return;
      }

      if(
        fields[i].columns.some(col=>
          col.type==="select" &&
          (!col.options||!col.options.length)
        )
      ){
        toast('Anna jokaiselle "'+label+'" -taulukon valintasarakkeelle vähintään yksi vaihtoehto');
        return;
      }

      if(!fields[i].columns.length){
        toast('Lisää "'+label+'" -taulukolle vähintään yksi sarake');
        return;
      }

    }else{
      fields[i].columns=[];
    }

    if(fields[i].type==="table"){

      syncFieldTableHintsFromDom(fields[i],i);

      const validColIds=
        new Set(fields[i].columns.map(c=>c.id));

      fields[i].hints=
        (fields[i].hints||[])
          .map(rule=>({
            id:rule.id||genFieldId(),
            conditions:
              (rule.conditions||[])
                .map(c=>({
                  colId:c.colId,
                  op:c.op,
                  value:String(c.value||"").trim()
                }))
                .filter(c=>
                  validColIds.has(c.colId) &&
                  c.value!==""
                ),
            text:String(rule.text||"").trim()
          }))
          .filter(rule=>
            rule.text!=="" &&
            rule.conditions.length>0
          );

    }else{

      syncFieldHintsFromDom(fields[i],i);

      fields[i].hints=
        (fields[i].hints||[])
          .map(r=>({
            id:r.id||genFieldId(),
            op:r.op,
            value:String(r.value||"").trim(),
            text:String(r.text||"").trim()
          }))
          .filter(r=>
            r.text!=="" &&
            r.value!==""
          );
    }

    if(!fields[i].id) fields[i].id=genFieldId();
  }

  if(!fields.length){
    toast("Lisää menetelmälle vähintään yksi kenttä");
    return;
  }

  editingMethod.name=name;
  editingMethod.short=short||name;

  if(editingMethodIsNew){
    METHODS.push(editingMethod);
  }else{
    const idx=METHODS.findIndex(m=>m.id===editingMethod.id);
    if(idx===-1){
      METHODS.push(editingMethod);
    }else{
      METHODS[idx]=editingMethod;
    }
  }

  await persistMethods();

  editingMethod=null;
  editingMethodIsNew=false;
  view="methodsManage";
  render();

  toast("Menetelmä tallennettu");
}

function renderField(f,values){

  if(f.type==="table"){
    return renderTableField(f,values);
  }

  const rawValue=
    values[f.id];

  const val=
    rawValue===undefined ||
    rawValue===null
      ?""
      :String(rawValue);


  let ih;


  if(f.type==="textarea"){

    ih=
      `
        <textarea
          id="fld_${escapeAttribute(f.id)}"
          autocomplete="off"
          placeholder="${escapeAttribute(f.placeholder||"")}"
        >${escapeHtml(val)}</textarea>
      `;

  }else if(f.type==="select"){

    ih=
      `
        <select
          id="fld_${escapeAttribute(f.id)}"
        >
          <option value="">
            Valitse...
          </option>

          ${f.options.map(o=>`
            <option
              value="${escapeAttribute(o)}"
              ${o===val?"selected":""}
            >
              ${escapeHtml(o)}
            </option>
          `).join("")}

        </select>
      `;

  }else{

    ih=
      `
        <input
          type="${escapeAttribute(f.type)}"
          id="fld_${escapeAttribute(f.id)}"
          autocomplete="off"
          placeholder="${escapeAttribute(f.placeholder||"")}"
          value="${escapeAttribute(val)}"
          ${f.min!==undefined?`min="${escapeAttribute(f.min)}"`:""}
          ${f.max!==undefined?`max="${escapeAttribute(f.max)}"`:""}
          ${f.step!==undefined?`step="${escapeAttribute(f.step)}"`:""}
        >
      `;
  }


  const hasHints=
    Array.isArray(f.hints) &&
    f.hints.length>0;


  const w=
    el(`
      <div class="field-hint-host" style="position:relative;">

        <label class="${f.req?"req":""}">
          ${escapeHtml(f.label)}
        </label>

        ${hasHints?`
          <button
            type="button"
            class="field-hint-btn"
            id="hintbtn_${escapeAttribute(f.id)}"
            title="Näytä apulause"
            style="display:none;"
          >!</button>
        `:""}

        ${ih}

        ${hasHints?`
          <div
            class="field-hint-box"
            id="hintbox_${escapeAttribute(f.id)}"
          ></div>
        `:""}

      </div>
    `);


  const input=
    w.querySelector(
      `#fld_${CSS.escape(f.id)}`
    );


  let refreshHint=()=>{};

  if(hasHints){

    const hintBtn=
      w.querySelector(
        `#hintbtn_${CSS.escape(f.id)}`
      );

    const hintBox=
      w.querySelector(
        `#hintbox_${CSS.escape(f.id)}`
      );

    refreshHint=()=>{

      const matches=
        matchingHints(f,values[f.id]);

      if(matches.length){

        hintBtn.style.display="flex";

        hintBox.innerHTML=
          matches
            .map(t=>escapeHtml(t))
            .join("<br>");

      }else{

        hintBtn.style.display="none";
        hintBox.classList.remove("open");
      }
    };

    hintBtn.onclick=()=>{
      hintBox.classList.toggle("open");
    };

    refreshHint();
  }


  input.oninput=e=>{

    values[f.id]=e.target.value;

    refreshHint();

    scheduleAutosave();
  };


  input.onchange=e=>{

    values[f.id]=e.target.value;

    refreshHint();

    scheduleAutosave();
  };


  return w;
}


/*
 * TAULUKKOKENTTÄ (esim. rakenneavauksen rakennekerrokset)
 *
 * values[f.id] on lista rivejä, jokainen rivi { [sarakeId]: arvo }.
 * Tutkija voi lisätä ja poistaa rivejä vapaasti lomakkeella.
 */
function renderTableField(f,values){

  if(!Array.isArray(values[f.id])){
    values[f.id]=[];
  }

  const rows=
    values[f.id];

  const cols=
    Array.isArray(f.columns) &&
    f.columns.length
      ?f.columns
      :[{ id:"col1", label:"Arvo", type:"text" }];

  const hasHints=
    Array.isArray(f.hints) &&
    f.hints.length>0;


  const wrap=
    el(`
      <div class="table-field">

        <label class="${f.req?"req":""}">
          ${escapeHtml(f.label)}
        </label>

        <div class="table-field-scroll">
          <table class="table-field-table">
            <thead>
              <tr>
                ${cols.map(c=>`
                  <th>${escapeHtml(c.label||"")}</th>
                `).join("")}
                <th class="table-field-action"></th>
              </tr>
            </thead>
            <tbody id="tblbody_${escapeAttribute(f.id)}"></tbody>
          </table>
        </div>

        <button
          type="button"
          class="btn btn-sm btn-outline"
          id="tbladd_${escapeAttribute(f.id)}"
        >
          + Lisää rivi
        </button>

      </div>
    `);


  const tbody=
    wrap.querySelector(
      `#tblbody_${CSS.escape(f.id)}`
    );


  function renderRows(){

    tbody.innerHTML="";

    rows.forEach((row,rIdx)=>{

      const tr=
        elRow(`
          <tr>
            ${cols.map(c=>{

              if(c.type==="select"){

                const curVal=
                  row[c.id]!==undefined && row[c.id]!==null
                    ?row[c.id]
                    :"";

                return `
                  <td>
                    <select
                      id="tblcell_${escapeAttribute(f.id)}_${rIdx}_${escapeAttribute(c.id)}"
                    >
                      <option value="">Valitse...</option>
                      ${(c.options||[]).map(o=>`
                        <option
                          value="${escapeAttribute(o)}"
                          ${o===curVal?"selected":""}
                        >${escapeHtml(o)}</option>
                      `).join("")}
                    </select>
                  </td>
                `;
              }

              return `
                <td>
                  <input
                    type="${c.type==="number"?"number":"text"}"
                    id="tblcell_${escapeAttribute(f.id)}_${rIdx}_${escapeAttribute(c.id)}"
                    autocomplete="off"
                    ${c.type==="number"?'step="any"':""}
                    value="${escapeAttribute(
                      row[c.id]!==undefined && row[c.id]!==null
                        ?row[c.id]
                        :""
                    )}"
                  >
                </td>
              `;
            }).join("")}
            <td class="table-field-action">
              <div style="display:flex;gap:4px;align-items:center;">
                ${hasHints?`
                  <button
                    type="button"
                    class="field-hint-btn-inline"
                    id="tblhint_${escapeAttribute(f.id)}_${rIdx}"
                    title="Näytä apulause"
                    style="display:none;"
                  >!</button>
                `:""}
                <button
                  type="button"
                  class="btn btn-sm btn-danger"
                  id="tblrm_${escapeAttribute(f.id)}_${rIdx}"
                >✕</button>
              </div>
            </td>
          </tr>
        `);

      tbody.appendChild(tr);


      let hintRowEl=null;

      if(hasHints){

        hintRowEl=
          elRow(`
            <tr id="tblhintrow_${escapeAttribute(f.id)}_${rIdx}" style="display:none;">
              <td colspan="${cols.length+1}" style="border-bottom:1px solid var(--line);">
                <div class="field-hint-box open" id="tblhintbox_${escapeAttribute(f.id)}_${rIdx}"></div>
              </td>
            </tr>
          `);

        tbody.appendChild(hintRowEl);
      }


      function refreshRowHint(){

        if(!hasHints)return;

        const matches=
          matchingTableRowHints(f,cols,row);

        const btn=
          tr.querySelector(
            `#tblhint_${CSS.escape(f.id)}_${rIdx}`
          );

        if(matches.length){

          btn.style.display="flex";

          hintRowEl.querySelector(
            `#tblhintbox_${CSS.escape(f.id)}_${rIdx}`
          ).innerHTML=
            matches
              .map(t=>escapeHtml(t))
              .join("<br>");

        }else{

          btn.style.display="none";
          hintRowEl.style.display="none";
        }
      }


      if(hasHints){

        tr.querySelector(
          `#tblhint_${CSS.escape(f.id)}_${rIdx}`
        ).onclick=()=>{

          hintRowEl.style.display=
            hintRowEl.style.display==="none"
              ?"table-row"
              :"none";
        };

        refreshRowHint();
      }


      cols.forEach(c=>{

        const inp=
          tr.querySelector(
            `#tblcell_${CSS.escape(f.id)}_${rIdx}_${CSS.escape(c.id)}`
          );

        inp.oninput=e=>{
          row[c.id]=e.target.value;
          refreshRowHint();
          scheduleAutosave();
        };

        inp.onchange=e=>{
          row[c.id]=e.target.value;
          refreshRowHint();
          scheduleAutosave();
        };
      });

      tr.querySelector(
        `#tblrm_${CSS.escape(f.id)}_${rIdx}`
      ).onclick=()=>{

        rows.splice(rIdx,1);

        renderRows();

        scheduleAutosave();
      };
    });
  }

  renderRows();

  wrap.querySelector(
    `#tbladd_${CSS.escape(f.id)}`
  ).onclick=()=>{

    const emptyRow={};

    cols.forEach(c=>{
      emptyRow[c.id]="";
    });

    rows.push(emptyRow);

    renderRows();

    scheduleAutosave();
  };

  return wrap;
}
