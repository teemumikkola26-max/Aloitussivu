<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script src="auth-gate.js" defer></script>
<script src="submission-sync.js"></script>
<title>Kenttälomakkeet</title>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#4a5568;
    --paper:#f7f5f0;
    --paper-raised:#ffffff;
    --line:#dcd7cb;
    --line-strong:#b9b2a0;
    --brand:#33455c;
    --brand-deep:#233043;
    --accent:#8fb79c;
    --radius:12px;
    --shadow:0 1px 3px rgba(28,36,48,.08), 0 1px 2px rgba(28,36,48,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
    min-height:100vh;
  }
  h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;margin:0;}

  header.topbar{
    background:var(--brand-deep);
    color:#f2efe6;
    padding:26px 20px 22px;
  }
  header.topbar h1{font-size:1.4rem;font-weight:700;letter-spacing:.01em;}
  header.topbar .sub{font-size:.85rem;color:#c9cfd8;margin-top:6px;max-width:34em;}

  main{
    max-width:640px;
    margin:0 auto;
    padding:16px 14px 40px;
  }

  .form-card{
    display:block;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 16px 15px;
    margin-bottom:12px;
    text-decoration:none;
    color:inherit;
    position:relative;
  }
  .form-card:active{background:#f4f2ec;}
  .fc-top{display:flex;align-items:flex-start;gap:12px;}
  .fc-icon{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:9px;
    background:var(--brand);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
  }
  .fc-body{flex:1;min-width:0;}
  .fc-title{font-size:1.02rem;font-weight:700;color:var(--brand-deep);margin-bottom:2px;}
  .fc-tag{
    display:inline-block;
    font-size:.68rem;
    color:var(--ink-soft);
    background:#eeece5;
    border-radius:99px;
    padding:2px 8px;
    margin-bottom:6px;
  }
  .fc-desc{font-size:.86rem;color:var(--ink-soft);}
  .fc-arrow{
    flex:0 0 auto;
    width:9px;height:9px;
    border-right:2px solid var(--line-strong);
    border-bottom:2px solid var(--line-strong);
    transform:rotate(-45deg);
    margin-top:16px;
  }
  .fc-external{
    font-size:.68rem;
    color:var(--ink-soft);
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:4px;
  }

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:.88rem;
    padding:40px 20px;
  }

  .section-label{
    padding:10px 18px 4px;
    font-size:.78rem;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .draft-card{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    margin:0 14px 10px; padding:13px 14px;
  }
  .dc-body{ flex:1; min-width:0; }
  .dc-title{ font-weight:700; color:var(--brand-deep); font-size:.95rem; }
  .dc-meta{ font-size:.74rem; color:var(--ink-soft); margin-top:2px; }
  .dc-actions{ display:flex; flex-direction:column; gap:5px; flex:0 0 auto; }
  .dc-btn{
    border:1px solid var(--line-strong); background:#fff; color:var(--ink);
    border-radius:7px; padding:6px 12px; font-size:.76rem; cursor:pointer; white-space:nowrap;
  }
  .dc-btn-primary{ background:var(--brand-deep); color:#fff; border-color:var(--brand-deep); }
  .dc-btn-danger{ color:#a13030; border-color:#a13030; }

  footer.note{
    max-width:640px;
    margin:0 auto;
    padding:4px 18px 28px;
    font-size:.76rem;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>Kenttälomakkeet</h1>
  <div class="sub">Valitse täytettävä lomake. Kaikki lomakkeet toimivat mobiilissa, tallentavat edistymisen laitteelle automaattisesti ja vievät raportin Word-tiedostona (.docx).</div>
</header>

<main id="formList"></main>

<div class="section-label" id="draftsLabel" style="display:none;">Kesken olevat lomakkeet</div>
<main id="draftsList"></main>

<div class="section-label">Omat lomakkeet</div>
<main id="customFormsList"></main>
<div style="padding:0 14px 6px;">
  <a href="editor.html" class="form-card" style="border-style:dashed;">
    <div class="fc-top">
      <div class="fc-icon">➕</div>
      <div class="fc-body">
        <div class="fc-title">Luo uusi lomake</div>
        <div class="fc-desc">Avaa lomake-editori</div>
      </div>
      <div class="fc-arrow"></div>
    </div>
  </a>
</div>

<footer class="note" id="footerNote"></footer>

<script>
"use strict";
/* =========================================================================
   LOMAKEREKISTERI
   Uuden lomakkeen lisääminen: kopioi yksi objekti alla olevaan FORMS-
   taulukkoon ja täytä kentät. Ei muita muutoksia tarvita — sivu piirtää
   kortin automaattisesti taulukon perusteella.

   Kentät:
     id       - yksilöivä tunniste (ei näy käyttäjälle)
     title    - lomakkeen nimi
     tag      - lyhyt standardi-/ohjeviite (esim. RT-kortin numero)
     desc     - 1-2 lauseen kuvaus siitä, mihin lomake on tarkoitettu
     icon     - yksi emoji tunnisteeksi
     url      - polku tai osoite lomakkeeseen. Sama repo -> pelkkä
                tiedostonimi (esim. "kuntoarvio.html"). Eri repo/sivusto
                -> täysi osoite (https://...).
     external - true, jos lomake on julkaistu toisessa sovelluksessa/
                osoitteessa (näyttää pienen huomautuksen kortissa)
   ========================================================================= */
const FORMS = [
  {
    id: "kuntotarkastus",
    title: "Asuntokaupan kuntotarkastus",
    tag: "RT 103996 (KH 90-00394)",
    desc: "Kenttälomake asunnon tai pientalon kuntotarkastukseen asuntokaupan yhteydessä.",
    icon: "🏠",
    url: "kuntotarkastus.html",
    external: false
  },
  {
    id: "kuntoarvio",
    title: "Kiinteistön kuntoarvio",
    tag: "RT 103002 / 103003",
    desc: "Kenttälomake taloyhtiön kuntoarvioon: kuntoluokitus (KL 1–5) ja PTS-suositukset rakennusosittain.",
    icon: "🏢",
    url: "kuntoarvio.html",
    external: false
  },
  {
    id: "kuntotutkimus",
    title: "Kosteus- ja sisäilmatekninen kuntotutkimus",
    tag: "Kenttätutkimus",
    desc: "Kenttälomake kosteus- ja sisäilmateknisen kuntotutkimuksen tutkimusmenetelmien (aistinvarainen tarkastelu, pintakosteus, RH, merkkiainekoe, näytteet, lämpökuvaus ym.) kirjaamiseen.",
    icon: "💧",
    url: "https://teemumikkola26-max.github.io/Kentt-lomake/",
    external: true
  }
];

function createFormCard(form){
  const a = document.createElement("a");
  a.className = "form-card";
  a.href = form.url;

  const top = document.createElement("div");
  top.className = "fc-top";

  const icon = document.createElement("div");
  icon.className = "fc-icon";
  icon.textContent = form.icon || "📋";
  top.appendChild(icon);

  const body = document.createElement("div");
  body.className = "fc-body";

  if (form.tag){
    const tag = document.createElement("span");
    tag.className = "fc-tag";
    tag.textContent = form.tag;
    body.appendChild(tag);
  }

  const title = document.createElement("div");
  title.className = "fc-title";
  title.textContent = form.title;
  body.appendChild(title);

  const desc = document.createElement("div");
  desc.className = "fc-desc";
  desc.textContent = form.desc || "";
  body.appendChild(desc);

  if (form.external){
    const ext = document.createElement("div");
    ext.className = "fc-external";
    ext.textContent = "↗ Avautuu erillisestä sovelluksesta";
    body.appendChild(ext);
  }

  top.appendChild(body);

  const arrow = document.createElement("div");
  arrow.className = "fc-arrow";
  top.appendChild(arrow);

  a.appendChild(top);
  return a;
}

function renderForms(){
  const wrap = document.getElementById("formList");
  wrap.innerHTML = "";

  if (FORMS.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Ei vielä yhtään lomaketta.";
    wrap.appendChild(empty);
    return;
  }

  FORMS.forEach(form => wrap.appendChild(createFormCard(form)));
}

function waitForSupabaseClient(cb, triesLeft){
  if (typeof triesLeft !== "number") triesLeft = 100;
  if (window.__supabaseClient) return cb(window.__supabaseClient);
  if (triesLeft <= 0) return;
  setTimeout(() => waitForSupabaseClient(cb, triesLeft - 1), 50);
}

function renderCustomForms(rows){
  const wrap = document.getElementById("customFormsList");
  wrap.innerHTML = "";
  if (!rows || rows.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Ei vielä omia lomakkeita — luo ensimmäinen alla olevasta painikkeesta.";
    wrap.appendChild(empty);
    return;
  }
  rows.forEach(row => {
    wrap.appendChild(createFormCard({
      title: row.title,
      tag: row.tag,
      desc: row.description,
      icon: row.icon,
      url: "form.html?id=" + encodeURIComponent(row.id)
    }));
  });
}

/* ---------- Kesken olevat lomakkeet (submissions) ---------- */
const STATIC_FORM_URLS = {
  kuntotarkastus: "kuntotarkastus.html",
  kuntoarvio: "kuntoarvio.html",
  kenttalomake: "kenttalomake.html"
};
function resumeUrl(sub){
  const base = STATIC_FORM_URLS[sub.form_key] || ("form.html?id=" + encodeURIComponent(sub.form_key));
  const sep = base.indexOf("?") === -1 ? "?" : "&";
  return base + sep + "submission=" + encodeURIComponent(sub.id);
}
function formatUpdatedAt(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString("fi-FI", { day:"numeric", month:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }catch(e){ return ""; }
}
async function renderDrafts(){
  const wrap = document.getElementById("draftsList");
  const label = document.getElementById("draftsLabel");
  let rows;
  try{
    rows = await window.SubmissionSync.listMySubmissions();
  }catch(err){
    label.style.display = "";
    wrap.innerHTML = '<div class="empty-state">Kesken olevien lomakkeiden haku epäonnistui: ' +
      String(err.message || err).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) +
      '</div>';
    return;
  }
  wrap.innerHTML = "";
  if (!rows || rows.length === 0){
    label.style.display = "none";
    return;
  }
  label.style.display = "";
  rows.forEach(sub => {
    const card = document.createElement("div");
    card.className = "draft-card";
    card.innerHTML =
      '<div class="dc-body">' +
        '<div class="dc-title">' + escapeHtmlLite(sub.title || "(nimetön)") + '</div>' +
        '<div class="dc-meta">' + escapeHtmlLite(sub.form_label || sub.form_key) + ' · päivitetty ' + formatUpdatedAt(sub.updated_at) + '</div>' +
      '</div>' +
      '<div class="dc-actions">' +
        '<button type="button" class="dc-btn dc-btn-primary" data-action="resume">Jatka</button>' +
        '<button type="button" class="dc-btn dc-btn-danger" data-action="delete">Poista</button>' +
      '</div>';
    card.querySelector('[data-action="resume"]').addEventListener("click", () => {
      window.location.href = resumeUrl(sub);
    });
    card.querySelector('[data-action="delete"]').addEventListener("click", async () => {
      if (!confirm('Poistetaanko lomake "' + (sub.title || "(nimetön)") + '" pysyvästi? Kaikki tiedot ja valokuvat häviävät.')) return;
      try{
        await window.SubmissionSync.deleteSubmission(sub.id);
        renderDrafts();
      }catch(err){
        alert("Poisto epäonnistui: " + (err.message || err));
      }
    });
    wrap.appendChild(card);
  });
}
function escapeHtmlLite(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

waitForSupabaseClient(async (supabaseClient) => {
  const { data, error } = await supabaseClient
    .from("forms")
    .select("id,title,tag,description,icon,updated_at")
    .order("updated_at", { ascending:false });
  if (error){
    const wrap = document.getElementById("customFormsList");
    wrap.innerHTML = '<div class="empty-state">Omien lomakkeiden haku epäonnistui: ' +
      String(error.message || error).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) +
      '</div>';
    return;
  }
  renderCustomForms(data);
});

waitForSupabaseClient(() => { renderDrafts(); });

renderForms();
document.getElementById("footerNote").textContent =
  `${FORMS.length} lomake${FORMS.length === 1 ? "" : "tta"} saatavilla.`;
</script>
</body>
</html>
